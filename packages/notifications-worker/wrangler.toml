name = "terrace-notifications"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

[[kv_namespaces]]
binding = "DEVICES"
id = "a5801c1de5e145bba8d73d08f1ad03fc"
preview_id = "2da6c626db9645a69181a674ea60b1c3"

[vars]
# Shared secret between bot and worker — override with `wrangler secret put WORKER_SECRET` for prod
WORKER_SECRET = "terrace-link-dev-2026"

# API_FOOTBALL_KEY is deliberately NOT a var — set it as a secret so it never
# lands in the repo or reaches a device:
#   wrangler secret put API_FOOTBALL_KEY
# It backs GET /football/* , which proxies api-football with a shared cache so
# every install draws on one 100/day allowance instead of its own.

[observability]
enabled = true
