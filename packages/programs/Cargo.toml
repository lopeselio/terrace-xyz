[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# blake3 1.8+ pulls in digest 0.11 → crypto-common 0.2.1 (requires Rust
# edition2024), which breaks Solana platform-tools Cargo 1.79.0. Force
# resolution to 1.5.5 (digest 0.10 / crypto-common 0.1) via a shared
# workspace dependency so solana-program's "blake3 = 1" constraint is met.
[workspace.dependencies]
blake3 = "=1.5.5"

# anchor-syn 0.30.1 calls proc_macro2::Span::source_file() inside a
# #[cfg(procmacro2_semver_exempt)] block; proc-macro2 1.0.106 sets that cfg
# unconditionally, but source_file() is only available on nightly. Patch to
# gate the block on proc_macro_span (nightly-only) so stable builds work.
[patch.crates-io]
anchor-syn = { path = "anchor-syn-patched" }
