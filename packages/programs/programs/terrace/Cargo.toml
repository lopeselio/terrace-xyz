[package]
name = "terrace"
version = "0.1.0"
description = "On-chain football prediction markets"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "terrace"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "arcium-anchor/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.0", features = ["token", "associated_token"] }
arcium-anchor = "0.9.7"
arcium-macros = "0.9.7"
arcium-client = { version = "0.9.7", default-features = false }
blake3 = { workspace = true }
