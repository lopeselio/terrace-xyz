[toolchain]
anchor_version = "0.30.0"

[features]
resolution = true
skip-lint = false

[programs.devnet]
terrace = "8dDXHX1x6didMogjFcMCNL6ZoY4XkP2RkSCKcCiaQssF"

[registry]
url = "https://api.apr.dev"

[provider]
# Real endpoint: export ANCHOR_PROVIDER_URL=https://devnet.helius-rpc.com/?api-key=<key>
# Fallback used only when ANCHOR_PROVIDER_URL is not set
cluster = "https://api.devnet.solana.com"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
