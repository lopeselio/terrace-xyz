[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
# Same chain through Alchemy (export ALCHEMY_API_KEY first); steadier for deploys than the public RPC.
monad_alchemy = "https://monad-testnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
