# Secret id used by the workflows -> env var in cre/.env that holds its value.
# CRE fails if a listed env var is missing. To use Claude for questions, add:
#   ANTHROPIC_API_KEY:
#     - CRE_SECRET_ANTHROPIC_API_KEY
secretsNames:
  RESULTS_API_KEY:
    - CRE_SECRET_RESULTS_API_KEY
  CRE_SIM_ATTESTOR_PRIVATE_KEY:
    - CRE_SECRET_SIM_ATTESTOR_PRIVATE_KEY
  GEMINI_API_KEY:
    - CRE_SECRET_GEMINI_API_KEY
  REVEAL_PRIVATE_KEY:
    - CRE_SECRET_REVEAL_PRIVATE_KEY
