<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrace pitch deck</title>
<meta name="description" content="Terrace: the social prediction game for football, on Monad.">
<meta property="og:title" content="Terrace pitch deck">
<meta property="og:description" content="The social prediction game for football, on Monad.">
<meta property="og:image" content="https://pitch.terrace.social/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/terrace.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #070908; --ink: #F3F4EF; --muted: #7F8A82; --line: #26302A; --green: #2BD46B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Barlow', Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: rgba(7,9,8,.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  header img { width: 28px; height: 28px; }
  header b { font-family: 'Barlow Condensed', Arial, sans-serif; font-size: 22px; letter-spacing: 2px; }
  header span { color: var(--muted); font-size: 14px; flex: 1; }
  header a { color: #0B0E0C; background: var(--green); font-weight: 700; font-size: 14px; text-decoration: none; padding: 8px 14px; border-radius: 999px; white-space: nowrap; }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 24px; }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .slide { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .slide section { position: relative; width: 1920px; height: 1080px; overflow: hidden; box-sizing: border-box; }
  .slide p, .slide h1, .slide h2, .slide h3 { margin: 0; }
  .slide a { color: inherit; text-decoration: none; }
  .slide [data-build-in] { transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
  .js .slide:not(.seen) [data-build-in] { opacity: 0; }
  .js .slide:not(.seen) [data-build-in^="rise"] { transform: translateY(40px); }
  .js .slide:not(.seen) [data-build-in^="pop"] { transform: scale(.94); }
  .js .slide:not(.seen) [data-build-in^="left"] { transform: translateX(40px); }
  footer { text-align: center; color: var(--muted); font-size: 14px; padding: 0 16px 40px; }
  footer a { color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { .slide [data-build-in] { transition: none; } }
</style>
</head>
<body>
<header><img src="assets/terrace.png" alt=""><b>TERRACE</b><span>Pitch deck</span><a href="https://play.terrace.social" target="_blank" rel="noopener">Play now</a></header>
<main>
<!--SLIDES-->
</main>
<footer>Elio Jordan Lopes, founder · <a href="https://x.com/ElioCodes">@ElioCodes</a> · <a href="https://x.com/terrace_social">@terrace_social</a> · Testnet figures, 11 Nov 2026</footer>
<script>
  document.documentElement.classList.add('js');
  const frames = [...document.querySelectorAll('.frame')];
  const fit = () => frames.forEach(f => { f.firstElementChild.style.transform = `scale(${f.clientWidth / 1920})`; });
  fit(); addEventListener('resize', fit);
  // Stagger each slide's pieces by their build order the first time it scrolls into view.
  document.querySelectorAll('.slide [data-build-in]').forEach(el => {
    const step = parseInt(el.dataset.buildIn.split(' ')[1] || '1', 10);
    el.style.transitionDelay = `${(step - 1) * 0.12}s`;
  });
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('seen'); io.unobserve(e.target); } }), { threshold: 0.35 });
  frames.forEach(f => io.observe(f.firstElementChild));
  // Arrow keys and space step slide by slide.
  addEventListener('keydown', e => {
    const dir = { ArrowDown: 1, ArrowRight: 1, PageDown: 1, ' ': 1, ArrowUp: -1, ArrowLeft: -1, PageUp: -1 }[e.key];
    if (!dir) return;
    e.preventDefault();
    const mid = innerHeight / 2;
    const i = frames.findIndex(f => f.getBoundingClientRect().bottom > mid);
    const next = frames[Math.max(0, Math.min(frames.length - 1, (i < 0 ? frames.length - 1 : i) + dir))];
    next.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
</script>
</body>
</html>
