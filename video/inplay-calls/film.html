<body>
<div id="frame">
  <div id="glow"></div>
  <div id="grid"></div>
  <div id="stage" class="layer"></div>
  <div id="phonewrap"><div id="phone"><div id="screen"><div id="island"></div><div id="status"><span>9:41</span><span>●●● ▮</span></div><div id="view"></div></div></div></div>
  <div id="cap"></div>
  <div id="fx" style="position:absolute;inset:0;z-index:24;pointer-events:none"></div>
  <div id="tap"></div><div id="ripple"></div>
  <div id="vig"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const VERT = new URLSearchParams(location.search).get("f") === "9x16";
if (VERT) document.body.classList.add("v");
const W = VERT ? 1080 : 1920, H = VERT ? 1920 : 1080;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => cl((t - a) / d);           // a start and a duration
const span = (t, [a, b]) => prog(t, a, b - a);       // a start and an end
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const spring = (x) => (x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(9 * x));
const lerp = (a, b, x) => a + (b - a) * x;
function life(t, a, b, { d = 0.5, dy = 26, out = 0.35 } = {}) {
  const i = spring(prog(t, a, d)), o = eo(prog(t, b - out, out));
  return { o: cl(prog(t, a, d * 0.6)) * (1 - o), y: (1 - i) * dy - o * 14, s: lerp(0.96, 1, i) };
}
const st = ({ o, y = 0, s = 1 }) => `opacity:${o.toFixed(3)};transform:translateY(${y.toFixed(1)}px) scale(${s.toFixed(4)})`;
const icon = (n, s = 24, sw = 1.75) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const usd = (n) => `$${Math.abs(n).toFixed(2)}`;
const signed = (n) => `${n >= 0 ? "+" : "−"}${usd(n)}`;

/** Words rise out of a mask one after another, and drop away together at `b`. *word* is green, _word_ red. */
function words(t, a, b, html, { stag = 0.07, d = 0.55 } = {}) {
  return html.split(/(<br\/>)/).map((chunk) => chunk === "<br/>" ? "<br/>" : chunk.split(" ").filter(Boolean).map((w, i) => {
    const p = spring(prog(t, a + i * stag, d)), o = eo(prog(t, b - 0.3, 0.3));
    const txt = /^\*.*\*$/.test(w) ? `<span class="green">${w.slice(1, -1)}</span>` : /^_.*_$/.test(w) ? `<span class="redt">${w.slice(1, -1)}</span>` : w;
    return `<span class="m"><span class="w" style="transform:translateY(${((1 - p) * 110 + o * -110).toFixed(1)}%)">${txt}</span></span>`;
  }).join(" ")).join("");
}

/** Old text rolls up and out, new text rolls in from below, character by character (RollingNumber). */
function roll(prev, next, k) {
  if (k >= 1 || prev === next) return next;
  const n = Math.max(prev.length, next.length), a = prev.padStart(n, " "), b = next.padStart(n, " ");
  return [...b].map((c, i) => {
    if (c === a[i]) return c === " " ? "" : c;
    const ki = eio(cl(k * 1.25 - (n - 1 - i) * 0.06));
    return `<span class="roll"><span style="transform:translateY(${(-ki * 100).toFixed(1)}%)"><span style="display:block">${a[i] === " " ? "&nbsp;" : a[i]}</span><span style="display:block">${c === " " ? "&nbsp;" : c}</span></span></span>`;
  }).join("");
}

/* ---------------- 63 minutes in and nothing's happening (48 s) ---------------- */
const T = {
  cover: [0, 3.6],
  story: [3.6, 39.6],
  strip: 7.4,          // In play now opens on the card
  tapYes: 16.9,
  sheet: [17.05, 17.45],
  tap5: 17.9,
  tapPlace: 18.8,
  placed: 19.6,
  close: [21.0, 21.4],
  gGoal: 24.0,         // Bruno Fernandes 74', on the drop
  ft: 33.0,
  taps: [35.0, 35.7],
  end: 39.6, dur: 48,
};
const BEATS = [
  [3.9, "63'. *Nil-nil.*", "Your Man Utd win needs a goal."],
  [7.3, "*In* *play* *now.*", "A goal or a card, in the next stretch."],
  [11.9, "Closes in *five.*", "The window opens after. No backing a goal you've seen."],
  [16.3, "Tap *Yes.* $5.", "Evens: $5 pays back $10."],
  [19.5, "*Locked* *in.*", "Then you wait. 69'… 70'… 72'…"],
  [23.95, "74'. *GOAL.*", "Bruno. Your call flips to winning."],
  [28.5, "Settled by *Chainlink.*", "Straight from the match data."],
  [32.9, "*Full* *time.*", "Two from two. Collect $29.70."],
];
const CLOCK = [[T.story[0], 63], [16.0, 64], [21.4, 65], [T.gGoal, 74], [28.6, 79], [T.ft - 0.2, 90]];
function clock(t) {
  if (t >= T.ft) return "FT";
  let m = CLOCK[0][1];
  for (let i = 1; i < CLOCK.length; i++) if (t >= CLOCK[i - 1][0]) m = lerp(CLOCK[i - 1][1], CLOCK[i][1], span(t, [CLOCK[i - 1][0], CLOCK[i][0]]));
  m = Math.floor(m);
  return `${m}'`;
}

/* every position as a timeline of states: lose / win / won */
const POS = {
  utd: { title: "Man Utd win", pick: "Yes", stake: 10, ret: 19.7, tl: [[-1, "lose"], [T.gGoal, "win"], [T.ft, "won"]] },
  call: { title: "A goal between 69' and 80'", pick: "Yes", stake: 5, ret: 10, live: true, from: T.close[0], tl: [[-1, "lose"], [T.gGoal, "win"], [T.ft, "won"]] },
};
const SCORE = { B: [[-1, "0–0"], [T.gGoal, "1–0"]] };
function at(tl, t) {
  let i = 0;
  while (i + 1 < tl.length && t >= tl[i + 1][0]) i++;
  return { s: tl[i][1], prev: i ? tl[i - 1][1] : tl[i][1], since: tl[i][0] };
}
const held = (p, t) => !p.from || t >= p.from;
const gain = (p, s) => (s === "win" || s === "won" ? p.ret - p.stake : -p.stake);
const netNow = (t) => Object.values(POS).filter((p) => held(p, t)).reduce((n, p) => n + gain(p, at(p.tl, t).s), 0);
function netCount(t) {
  const flips = [T.close[0], T.gGoal].filter((e) => e <= t);
  const e = flips[flips.length - 1];
  if (e === undefined) return netNow(t);
  return lerp(netNow(e - 0.01), netNow(e), eio(prog(t, e, 1.0)));
}
const collectedAt = (i) => T.taps[i] + 0.15;

/* ---------------- cover ---------------- */
const AMBER_RING = "background:radial-gradient(circle at 35% 30%, #3a2408, var(--amber-deep) 70%);border-color:var(--amber);color:var(--amber-ink)";
function cover(t) {
  if (t >= T.cover[1]) return "";
  const out = eo(prog(t, T.cover[1] - 0.5, 0.5));
  const s = (k) => `opacity:${1 - out};transform:translateY(${-out * 30 * k}px)`;
  const cy = VERT ? 520 : 130, R = VERT ? 105 : 82;
  return `<div class="ctr" style="top:${cy}px;${s(1)}">
      <span style="display:inline-flex;align-items:center;gap:16px;font-family:var(--cond);font-weight:800;font-size:${VERT ? 44 : 40}px;letter-spacing:2px"><img src="assets/terrace.png" style="width:${VERT ? 64 : 56}px;height:${VERT ? 64 : 56}px;border-radius:14px" />TERRACE</span>
    </div>
    <div class="ring" style="left:${W / 2 - R}px;top:${cy + (VERT ? 110 : 92)}px;width:${2 * R}px;height:${2 * R}px;${s(1.4)};${AMBER_RING};box-shadow:0 0 ${80 + 24 * Math.sin(t * 4)}px rgba(245,158,11,0.4)">${icon("bolt", VERT ? 96 : 84, 1.9)}</div>
    <div class="ctr" style="top:${cy + (VERT ? 340 : 296)}px;${s(1.8)}">
      <div><span class="kicker" style="height:50px"><span class="dot" style="opacity:${0.55 + 0.45 * Math.sin(t * 6)}"></span>Live</span></div>
      <span class="big" style="display:block;font-size:${VERT ? 180 : 200}px;margin-top:26px">In play <span class="green">now</span></span>
      <span class="lead" style="display:block;font-size:${VERT ? 40 : 42}px;margin-top:26px;color:var(--ink)">${VERT ? "Back a goal in the next ten minutes<br/>of the game you're watching." : "Back a goal in the next ten minutes of the game you're watching."}</span>
      <div style="margin-top:${VERT ? 54 : 40}px"><span class="brandrow">On <img src="assets/monad.png" /><b>MONAD</b> &nbsp;· settled by <img class="cl" src="assets/chainlink.png" /><b>CHAINLINK</b></span></div>
    </div>`;
}

/* ---------------- the Game day screen ---------------- */
const tabs = (on) => `<div class="tabbar">${[["home", "Home"], ["pitch", "Markets"], ["plus", "Create"], ["users", "Social"], ["shield", "Profile"]].map(([ic, l]) =>
  `<div class="tab${l === "Create" ? " tab-create" : ""}${l === on ? " on" : ""}" id="tab-${l}"><span class="pill">${icon(ic, 22)}</span><span class="tl">${l}</span></div>`).join("")}</div>`;
const CREST = (id) => `<span class="crest"><img src="assets/crest-${id}.png" /></span>`;
const BADGE = { lose: ["b-lost", "Losing"], win: ["b-won", "Winning"], won: ["b-won", "Won"] };
const COLOR = { lose: "var(--red)", win: "var(--green)", won: "var(--green)" };

function posLine(key, t, tapIdx) {
  const p = POS[key], { s, prev, since } = at(p.tl, t);
  const k = prog(t, since, 0.9);
  const [cls, label] = BADGE[s];
  const amtOf = (x) => (x === "lose" ? `−${usd(p.stake)}` : `+${usd(p.ret - p.stake)}`);
  const amt = roll(amtOf(prev), amtOf(s), prog(t, since, 0.7));
  const sw = eio(prog(t, since, 0.6));
  const bar = prev === s || k >= 1 ? COLOR[s] : `linear-gradient(180deg, ${COLOR[s]} ${(sw * 100).toFixed(1)}%, ${COLOR[prev]} ${(sw * 100).toFixed(1)}%)`;
  const good = s !== "lose";
  const wash = k > 0 && k < 1 && prev !== s ? `background:rgba(${good ? "34,197,94" : "239,68,68"},${(0.26 * (1 - k)).toFixed(3)});` : "";
  const pop = k > 0 && k < 1 && prev !== s ? `transform:scale(${(1 + 0.14 * Math.sin(Math.min(1, k * 2.2) * Math.PI)).toFixed(3)})` : "";
  // the call waits for its window: a soft amber pulse on the row until the goal
  const waiting = p.live && t < T.gGoal ? `box-shadow:inset 0 0 0 1px rgba(245,158,11,${(0.25 + 0.25 * Math.sin(t * 5)).toFixed(3)});` : "";
  const ft = t >= T.ft, done = ft && t >= collectedAt(tapIdx);
  const btn = ft && t < collectedAt(tapIdx) + 2.0
    ? `<div class="cta gd-pos-cta" id="c${tapIdx}" style="opacity:${eo(prog(t, T.ft + 0.3 + tapIdx * 0.15, 0.4))};${done ? "background:var(--raised);color:var(--green-ink);border:1px solid var(--green-mid)" : ""}">${done ? `${icon("check", 18, 2.4)} Collected` : `Collect ${usd(p.ret)}`}</div>` : "";
  // the new call slides open under the bet that brought the fan here
  const grow = p.from ? eio(prog(t, p.from + 0.15, 0.5)) : 1;
  if (grow <= 0) return "";
  return `<div style="max-height:${(grow * 160).toFixed(1)}px;opacity:${grow.toFixed(3)};overflow:hidden"><div class="gd-pos" id="pos-${key}" style="${wash}${waiting}"><i class="bar" style="background:${bar}"></i>
    <div style="min-width:0"><div class="uname">${p.title}</div><div class="umeta">${p.pick} · ${usd(p.stake)}${p.live ? ` · <span class="badge b-chainlink" style="padding:1px 6px;font-size:10px"><img src="assets/chainlink.png" style="width:11px;height:11px;border-radius:50%;background:#fff" />read live</span>` : ""}</div></div>
    <div class="gd-pos-side"><span class="badge ${cls}" style="${pop}">${label}</span><div class="gd-amt ${good ? "amt-won" : "amt-lost"}">${amt}</div></div>${btn}
  </div></div>`;
}

/** In play now: a goal or a card from 69' to 80' (63' + 6, rounded up to the next five after ten). */
function inPlay(t) {
  const open = eio(prog(t, T.strip, 0.6)) * (1 - eio(span(t, T.close)));
  if (open <= 0) return "";
  const rows = [["goal", "A goal between 69' and 80' in Man Utd v Chelsea"], ["card", "A card between 69' and 80' in Man Utd v Chelsea"]];
  const glow = 0.5 + 0.5 * Math.sin(t * 5);
  const pressed = t >= T.tapYes - 0.05 && t < T.tapYes + 0.3;
  return `<div style="max-height:${(open * 160).toFixed(1)}px;overflow:hidden;opacity:${cl(open * 1.4).toFixed(3)}"><div class="gd-inplay" id="ip">
    <div class="gd-k">${icon("bolt", 12, 2)} In play now</div>
    ${rows.map(([k, txt], i) => `<div class="gd-inplay-row" style="opacity:${cl(prog(t, T.strip + 0.2 + i * 0.15, 0.3))}"><span class="gd-inplay-t">${txt}</span>
      <span class="btn-out" id="yes-${k}" style="${i === 0 && t > 12 && t < T.tapYes + 0.3 ? `box-shadow:0 0 ${(6 + 10 * glow).toFixed(1)}px rgba(34,197,94,${(0.25 + 0.35 * glow).toFixed(2)});` : ""}${i === 0 && pressed ? "background:var(--green-deep)" : ""}">Yes Evens</span><span class="btn-out mute">No</span></div>`).join("")}
  </div></div>`;
}

function board(t) {
  const ft = t >= T.ft;
  const sc = at(SCORE.B, t), sk = prog(t, sc.since, 0.6);
  let banner = "", pop = 1;
  const g = T.gGoal, kk = prog(t, g, 1.7);
  if (kk > 0 && kk < 1) {
    const i = eo(prog(t, g, 0.25)), o = eo(prog(t, g + 1.35, 0.35));
    banner = `<div class="gd-goal" style="opacity:${(cl(prog(t, g, 0.12)) * (1 - o)).toFixed(3)};clip-path:inset(0 ${((1 - i) * 50).toFixed(1)}% 0 ${((1 - i) * 50).toFixed(1)}%)">${icon("ball", 20, 2)}GOAL · BRUNO FERNANDES 74'</div>`;
    pop = 1 + 0.2 * Math.sin(Math.min(1, prog(t, g, 0.7)) * Math.PI);
  }
  const ps = Object.values(POS).filter((p) => held(p, t));
  const n = ps.reduce((s, p) => s + gain(p, at(p.tl, t).s), 0);
  const pulse = 0.5 + 0.5 * Math.sin(t * 6.2);
  return `<div class="card gd-match${ft ? "" : " gd-live"}" id="cardB">
    ${banner}<div class="gd-head">${ft ? `<span class="badge b-settled">FT</span>` : `<span class="badge b-live" style="box-shadow:0 0 ${(4 + 10 * pulse).toFixed(1)}px rgba(239,68,68,${(0.35 + 0.4 * pulse).toFixed(2)})"><i class="livedot" style="opacity:${(0.45 + 0.55 * pulse).toFixed(2)}"></i>${clock(t)}</span>`}Premier League<span style="margin-left:auto;color:var(--ink-4)">${icon("chevronRight", 16)}</span></div>
    <div class="gd-score"><span class="t">${CREST("33")}Man Utd</span><span class="sc" style="display:inline-block;transform:scale(${pop.toFixed(3)});${pop > 1.01 ? "color:var(--green-ink)" : ""}">${roll(sc.prev, sc.s, sk)}</span><span class="t away">Chelsea${CREST("49")}</span></div>
    <div class="gd-positions">${posLine("utd", t, 0)}${posLine("call", t, 1)}</div>
    ${ft ? "" : inPlay(t)}
    <div class="gd-foot">${ft ? "<span>Settled</span>" : `<span>${usd(ps.reduce((s, p) => s + p.stake, 0))} riding</span>`}<span class="${n >= 0 ? "amt-won" : "amt-lost"}">${ft ? "As it finished" : "If it ends now"} ${signed(n)}</span></div>
  </div>`;
}

function hero(t) {
  const ft = t >= T.ft;
  const n = netCount(t);
  const ps = Object.values(POS).filter((p) => held(p, t));
  const states = ps.map((p) => at(p.tl, t).s);
  const w = states.filter((s) => s === "win").length, l = states.filter((s) => s === "lose").length;
  const left = T.taps.filter((x, i) => t < collectedAt(i)).length;
  const rid = ft ? 0 : ps.reduce((s, p) => s + p.stake, 0);
  const tint = n >= 0 ? "var(--green-mid)" : "var(--red-mid)";
  const bg = n >= 0 ? "var(--green-tint)" : "#1a0c0c";
  return `<div class="card gd-hero" id="hero" style="border-color:${tint};background:linear-gradient(180deg, ${bg}, var(--surface) 80%)"><div class="gd-hero-row">
      <div><div class="gd-k">On the line</div><div class="gd-v">${usd(rid)}</div><div class="umeta">${ft ? "0 games" : "1 game"}</div></div>
      <div style="text-align:right"><div class="gd-k">If it all ends now</div><div class="gd-v ${n >= 0 ? "amt-won" : "amt-lost"}">${signed(n)}</div><div class="umeta">${ft ? "2 won" : `${w} winning · ${l} losing`}</div></div>
    </div>${ft && left ? `<div class="gd-collect">${icon("dollar", 16)} ${usd([19.7, 10].filter((x, i) => t < collectedAt(i)).reduce((a, b) => a + b, 0))} ready to collect below</div>` : ""}</div>`;
}

function gameDayScreen(t) {
  const ft = t >= T.ft;
  const enter = (i) => { const p = spring(prog(t, T.story[0] + 0.5 + i * 0.18, 0.6)); return `opacity:${cl(prog(t, T.story[0] + 0.5 + i * 0.18, 0.25))};transform:translateY(${((1 - p) * 40).toFixed(1)}px)`; };
  let h = `<div style="${enter(0)}">${hero(t)}</div>`;
  h += `<div class="sec-hd" style="${enter(1)}">${ft ? "<h3>Full time</h3>" : `<h3 style="color:var(--red-ink)">In play</h3><span class="badge b-live">1 game</span>`}</div>`;
  h += `<div style="${enter(1)}">${board(t)}</div>`;
  h += `<div class="sec-hd" style="${enter(2)}"><h3>Your teams play next</h3><span class="more">Fixtures ›</span></div>
    <div class="card" style="${enter(2)}"><div class="gd-head"><span class="badge b-open">Sat 17:30</span>Premier League</div>
      <div class="gd-score"><span class="t">${CREST("42")}Arsenal</span><span class="sc" style="color:var(--ink-3);font-size:22px">v</span><span class="t away">Man Utd${CREST("33")}</span></div>
      <div class="mk-odds o-3"><div class="o-n"><span class="lbl">Home</span><span class="val">4/5</span></div><div class="o-n"><span class="lbl">Draw</span><span class="val">13/5</span></div><div class="o-n"><span class="lbl">Away</span><span class="val">3/1</span></div></div></div>`;
  const bal = 90 - (t >= T.placed ? 5 : 0) + [19.7, 10].filter((x, i) => t >= collectedAt(i) + 0.3).reduce((a, b) => a + b, 0);
  let out = `<div class="hdr"><div style="flex:1;min-width:0"><div class="hdr-title">Game day</div><div class="hdr-sub">Everything you've got on, as it happens</div></div><span class="balpill">$${bal.toFixed(2)}</span></div>
    <div class="body"><div class="scroll">${h}</div></div>${tabs("Home")}`;
  out += betSheet(t);
  const tp = prog(t, T.taps[1] + 0.4, 0.35) * (1 - prog(t, T.taps[1] + 2.6, 0.3));
  if (tp > 0) out += `<div class="toast" style="opacity:${tp};transform:translate(-50%,${(1 - eo(prog(t, T.taps[1] + 0.4, 0.35))) * 14}px)">${icon("check", 18, 2.4)} <b>${usd(29.7)}</b> collected</div>`;
  return out;
}

/* ---------------- the bet sheet: stake, Place bet, then Bet placed ---------------- */
function betSheet(t) {
  const up = eio(span(t, T.sheet)) * (1 - eio(span(t, T.close)));
  if (up <= 0) return "";
  const five = t >= T.tap5 + 0.05;
  const stake = five ? 5 : 10;
  const busy = t >= T.tapPlace + 0.05 && t < T.placed;
  const placed = t >= T.placed;
  const pk = spring(prog(t, T.placed, 0.5));
  const dots = ".".repeat(1 + (Math.floor(t * 6) % 3));
  const badges = `<div style="display:flex;justify-content:center;gap:6px;margin-top:14px"><span class="badge b-won">Terrace pool</span><span class="badge b-chainlink"><img src="assets/chainlink.png" style="width:12px;height:12px;border-radius:50%;background:#fff" />Settled by Chainlink</span></div>`;
  const body = placed
    ? `<div style="text-align:center;padding-bottom:4px">
        <div style="width:58px;height:58px;border-radius:50%;background:var(--green-deep);border:1.5px solid var(--green);color:var(--green);display:flex;align-items:center;justify-content:center;margin:6px auto 14px;transform:scale(${lerp(0.5, 1, pk).toFixed(3)})">${icon("check", 26, 2.4)}</div>
        <div class="sheet-title">Bet placed</div>
        <div class="umeta" style="font-size:13px;margin-top:4px">$5.00 on In play · Yes at Evens</div>
        <div class="card" style="text-align:left;margin-top:16px;padding:12px 14px"><div class="kv" style="padding:0"><span class="k">Returns if it lands</span><span class="v">$10.00</span></div></div>
        <div style="display:flex;gap:8px;margin-top:14px"><div class="cta cta-ghost" style="flex:1;height:44px;font-size:14px">Keep going</div><div class="cta" style="flex:1;height:44px;font-size:14px">My bets</div></div>
      </div>${badges}`
    : `<div style="display:flex;align-items:flex-start;gap:10px"><div style="flex:1;min-width:0"><div class="sheet-eyebrow">Man Utd v Chelsea · In play</div><div class="sheet-title">Yes <span style="color:var(--green)">Evens</span></div></div><span style="width:32px;height:32px;border-radius:50%;background:var(--raised);display:grid;place-items:center;color:var(--ink-3);font-weight:700">✕</span></div>
      <div class="uname" style="font-size:14px;margin-top:8px">A goal between 69' and 80' in Man Utd v Chelsea</div>
      <div class="umeta" style="margin-top:4px">How it settles: from the match data, by Chainlink. Betting closes in five minutes.</div>
      <div class="flabel" style="margin-top:16px">Stake</div>
      <div class="field"><span style="color:var(--ink-3);font-weight:600">$</span>${roll(String(10), String(stake), prog(t, T.tap5, 0.4))}<span style="width:2px;height:22px;background:var(--green);opacity:${Math.floor(t * 2.5) % 2 ? 0 : 1}"></span></div>
      <div class="oddsrow">${[5, 10, 20, 50].map((s) => `<div class="odd${s === stake ? " on" : ""}" id="stake-${s}">$${s}</div>`).join("")}</div>
      <div class="kv" style="border-top:1px solid var(--line-hair);margin-top:14px"><span class="k">Potential returns</span><span class="v">${roll(usd(20), usd(stake * 2), prog(t, T.tap5, 0.5))}</span></div>
      <div class="cta" id="place" style="${busy ? "background:#1c2a20;color:#7fbf95" : ""}">${busy ? `Locking it in${dots}` : `Place bet · $${stake}`}</div>${badges}`;
  return `<div class="scrim" style="opacity:${up.toFixed(3)}"></div><div class="sheet" id="sheet" style="transform:translateY(${((1 - up) * 105).toFixed(1)}%)"><div class="grabber"></div>${body}</div>`;
}

/* ---------------- camera ---------------- */
const SHOTS = [[7.7, 11.5, "ip", 1.22], [12.0, 16.4, "ip", 1.22], [17.5, 20.9, "sheet", 1.1], [21.6, 23.7, "cardB", 1.16], [23.9, 28.2, "cardB", 1.18], [28.6, 32.6, "pos-call", 1.24]];
function camera(t) {
  let s = 1, oy = 450;
  for (const [a, b, id, z] of SHOTS) {
    const k = eio(prog(t, a, 0.9)) * (1 - eio(prog(t, b - 0.9, 0.9)));
    if (k <= 0) continue;
    const el = $(id);
    if (!el) continue;
    let y = el.offsetHeight / 2, n = el;
    while (n && n.id !== "screen") { y += n.offsetTop; n = n.offsetParent; }
    y += 12;
    const zz = VERT ? 1.08 : z; // 9:16: the phone has 520..1540 to itself, so only a small push
    s = lerp(1, zz, k);
    oy = lerp(450, cl(y, 200, 760), k);
  }
  return { s, oy };
}

/* ---------------- collect: coins burst out of each button ---------------- */
function coins(t) {
  let h = "";
  T.taps.forEach((tp, i) => {
    const kc = prog(t, tp + 0.1, 1.1), el = $(`c${i}`);
    if (kc <= 0 || kc >= 1 || !el) return;
    const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    h += [0, 1, 2, 3, 4, 5].map((j) => {
      const ang = -Math.PI / 2 + (j - 2.5) * 0.4, d = eo(kc) * (140 + (j % 3) * 28);
      return `<div class="coinpop" style="left:${x + Math.cos(ang) * d}px;top:${y + Math.sin(ang) * d - 60 * kc}px;opacity:${1 - eo(kc)};transform:scale(${lerp(0.4, 1, spring(kc))})">$</div>`;
    }).join("");
  });
  $("fx").innerHTML = h;
}

const TAPS = [[T.tapYes, "yes-goal"], [T.tap5, "stake-5"], [T.tapPlace, "place"], [T.taps[0], "c0"], [T.taps[1], "c1"]];
function tap(t) {
  const dot = $("tap"), rip = $("ripple");
  dot.style.opacity = 0; rip.style.opacity = 0;
  for (const [a, id] of TAPS) {
    if (t < a - 0.45 || t > a + 0.5) continue;
    const el = $(id);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2, k = t - a;
    const o = k < -0.3 ? prog(t, a - 0.45, 0.15) : k > 0.3 ? 1 - prog(t, a + 0.3, 0.2) : 1;
    dot.style.cssText = `left:${x}px;top:${y + (k < -0.1 ? (1 - eo(prog(t, a - 0.45, 0.35))) * 40 : 0)}px;opacity:${o};transform:scale(${k > -0.08 && k < 0.1 ? 0.8 : 1})`;
    if (k > 0) {
      const p = eo(prog(t, a, 0.45)), size = 30 + p * 70;
      rip.style.cssText = `left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;opacity:${(1 - p) * 0.9}`;
    }
  }
}

/* ---------------- narration ---------------- */
/** Now 63' → betting closes 68' → goal window 69'–80', for the "closes in five" beat. */
function windowChips(t, x) {
  const chip = (i, bg, fg, html) => `<span class="chip-cl" style="background:${bg};color:${fg};padding:0 16px;${st(life(t, x + 0.8 + i * 0.35, 99, { dy: 14 }))};display:inline-flex">${html}</span>`;
  const arrow = (i) => `<span style="color:var(--ink-4);font-weight:800;font-size:22px;${st(life(t, x + 0.95 + i * 0.35, 99, { dy: 0 }))};display:inline-block">→</span>`;
  return `<span style="display:inline-flex;align-items:center;gap:${VERT ? 8 : 12}px">${chip(0, "var(--raised)", "var(--ink)", `${icon("clock", 20, 2)}Now 63'`)}${arrow(0)}${chip(1, "var(--amber-deep)", "var(--amber-ink)", `Bets close 68'`)}${arrow(1)}${chip(2, "var(--green-deep)", "var(--green-ink)", `${icon("ball", 20, 2)}Window 69'–80'`)}</span>`;
}
function narration(t) {
  const [a, b] = T.story;
  if (t < a || t >= b) return "";
  const idx = BEATS.reduce((n, [x], i) => (t >= x ? i : n), -1);
  let h = `<div style="${st(life(t, a + 0.1, b))}"><span class="kicker"><span class="dot" style="opacity:${0.55 + 0.45 * Math.sin(t * 6)}"></span>One fan · In play now</span></div>`;
  if (idx >= 0) {
    const [x, line, sub] = BEATS[idx], next = BEATS[idx + 1] ? BEATS[idx + 1][0] : b;
    const long = line.replace(/[*_]/g, "").length > 15;
    h += `<div class="beat" style="${long ? `font-size:${VERT ? 80 : 98}px` : ""}">${words(t, x + 0.05, next, line)}</div>`;
    h += `<div class="bsub" style="${st(life(t, x + 0.45, next, { dy: 20, out: 0.3 }))}${sub.length > 44 ? `;font-size:${VERT ? 29 : 36}px` : ""}">${sub}</div>`;
    const extra = idx === 2 ? windowChips(t, x)
      : idx === 6 ? `<span class="chip-cl"><img src="assets/chainlink.png" />Read live from the match data</span>` : "";
    h += `<div class="cextra" style="${st(life(t, x + 0.7, next, { dy: 16, out: 0.3 }))}">${extra}</div>`;
  }
  h += `<div class="steps" style="${st(life(t, a + 0.6, b))}">${BEATS.map((_, i) => `<i class="${i < idx ? "on" : i === idx ? "now" : ""}"></i>`).join("")}</div>`;
  return h;
}

function endCard(t) {
  if (t < T.end) return "";
  const e = (k, dy = 30) => st(life(t, T.end + 0.25 + k * 0.3, 99, { d: 0.7, dy }));
  const top = VERT ? 540 : 150;
  return `<div class="ctr" style="top:${top}px;opacity:${1 - prog(t, T.dur - 0.6, 0.6)}">
    <div class="ring" style="position:relative;display:inline-flex;width:150px;height:150px;${AMBER_RING};box-shadow:0 0 80px rgba(245,158,11,0.35);${e(0)}">${icon("bolt", 80, 1.9)}</div>
    <span class="big" style="display:block;font-size:${VERT ? 140 : 150}px;margin-top:40px;${e(1)}">In play <span class="green">now</span></span>
    <span class="lead" style="display:block;font-size:${VERT ? 42 : 44}px;margin-top:24px;color:var(--ink);${e(2, 16)}">Calls on the game you're watching.</span>
    <div style="margin-top:40px;${e(3, 16)}"><span class="pillurl">play.terrace.social</span></div>
    <div style="margin-top:38px;${e(4, 12)}"><span class="brandrow"><img src="assets/terrace.png" /><b>TERRACE</b> &nbsp;on <img src="assets/monad.png" /><b>MONAD</b></span></div>
    <div style="margin-top:22px;${e(5, 12)}"><span class="brandrow">Settled by <img class="cl" src="assets/chainlink.png" /><b>CHAINLINK</b></span></div>
  </div>`;
}

/* ---------------- seek ---------------- */
window.seek = (t) => {
  // red while the fan needs a goal, amber while the call waits, green once it's in
  const n = t >= T.story[0] && t < T.end ? netCount(t) : 0;
  const g = cl((n + 15) / 30), red = 0.11 * (1 - g), grn = 0.05 + 0.1 * g;
  const amb = t >= T.strip && t < T.gGoal ? 0.08 * eo(prog(t, T.strip, 1)) * (1 - eo(prog(t, T.gGoal, 0.6))) : 0;
  $("glow").style.background = `radial-gradient(900px 760px at ${VERT ? 50 : 30}% ${VERT ? 55 : 48}%, rgba(239,68,68,${red.toFixed(3)}), transparent 70%), radial-gradient(1000px 760px at ${VERT ? 50 : 62}% ${VERT ? 30 : 40}%, rgba(245,158,11,${amb.toFixed(3)}), transparent 70%), radial-gradient(1000px 760px at ${VERT ? 50 : 62}% ${VERT ? 30 : 40}%, rgba(34,197,94,${grn.toFixed(3)}), transparent 70%)`;
  $("stage").innerHTML = cover(t) + endCard(t);

  const inPhone = t >= T.story[0] - 0.2 && t < T.end;
  $("phonewrap").style.display = inPhone ? "" : "none";
  if (inPhone) {
    $("view").innerHTML = gameDayScreen(t);
    const ph = life(t, T.story[0], T.end, { d: 0.8, dy: 120, out: 0.5 });
    const cam = camera(t);
    let ty = ph.y;
    if (VERT) { // keep the phone's bottom inside the safe area while the camera pushes in
      const bottom = 560 + 1.05 * (cam.oy + (900 - cam.oy) * cam.s);
      ty -= Math.max(0, bottom - 1540) / 1.05;
    } else { // 16:9: the push may run off the bottom, never off the top
      ty += Math.max(0, 28 - (92 + cam.oy * (1 - cam.s)));
    }
    $("phone").style.cssText = `opacity:${ph.o.toFixed(3)};transform-origin:220px ${cam.oy.toFixed(1)}px;transform:translateY(${ty.toFixed(1)}px) scale(${(ph.s * cam.s).toFixed(4)})`;
  }
  $("status").firstElementChild.textContent = t < T.gGoal ? "16:18" : "16:29";
  $("cap").innerHTML = narration(t);
  coins(t);
  tap(t);
};

const IMGS = ["assets/terrace.png", "assets/monad.png", "assets/chainlink.png", ...["42", "33", "49"].map((id) => `assets/crest-${id}.png`)];
document.fonts.ready.then(() => Promise.all(IMGS.map((s) => { const i = new Image(); i.src = s; return i.decode().catch(() => {}); }))).then(() => {
  window.seek(Number(new URLSearchParams(location.search).get("t") || 0));
  window.ready = true;
});
</script>
