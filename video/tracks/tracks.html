<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Terrace · Sponsor tracks</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet" />
<style>
  :root {
    --canvas: #0a0a0a; --surface: #121412; --raised: #191c19; --line: #2a2e2a;
    --green: #22c55e; --red: #ef4444; --amber: #fbbf24; --violet: #a78bfa;
    --ink: #f5f6f3; --ink2: #a3aaa4; --ink3: #6b736c;
    --sans: "Barlow", system-ui, sans-serif; --cond: "Barlow Condensed", "Arial Narrow", sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
    --acc: #22c55e; --acc2: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }
  #frame { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--canvas); font-family: var(--sans); color: var(--ink); transform-origin: 0 0; -webkit-font-smoothing: antialiased; }
  #bg { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1.2px); background-size: 32px 32px; }
  #glow { position: absolute; width: 1600px; height: 1600px; border-radius: 50%; filter: blur(40px); opacity: 0.16; background: radial-gradient(circle, var(--acc) 0%, transparent 62%); }

  /* diagram */
  #world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #edges { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  .node { position: absolute; border-radius: 18px; background: var(--surface); border: 2px solid var(--line); padding: 18px 22px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .node .nt { font-family: var(--cond); font-weight: 700; font-size: 31px; line-height: 1; letter-spacing: 0.2px; }
  .node .ns { font-size: 19px; line-height: 1.3; color: var(--ink2); white-space: pre-line; }
  .node .tag { position: absolute; right: 14px; top: 12px; font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 4px 9px; border-radius: 7px; background: #1f231f; color: var(--ink2); }
  .node .tag.hot { background: color-mix(in srgb, var(--acc) 22%, #000); color: var(--acc2); }
  .node.mono .nt { font-family: var(--mono); font-weight: 600; font-size: 24px; }
  .node.group { background: rgba(255,255,255,0.015); border: 2px dashed #333833; padding: 0; justify-content: flex-start; }
  .node.group .nt { position: absolute; left: 20px; top: 14px; font-family: var(--sans); font-weight: 700; font-size: 15px; letter-spacing: 2.4px; text-transform: uppercase; color: var(--ink3); }
  .node.chip { border-radius: 12px; padding: 0 18px; background: var(--raised); }
  .node.chip .nt { font-family: var(--sans); font-weight: 700; font-size: 21px; }
  .node.db { border-radius: 50% / 16%; text-align: center; align-items: center; padding: 34px 26px; }
  .node.phone { border-radius: 36px; border-width: 3px; align-items: center; text-align: center; }
  .node.phone::before { content: ""; position: absolute; top: 14px; width: 70px; height: 9px; border-radius: 9px; background: #262a26; }
  .node.hero { border-width: 3px; }
  .node.hero .nt { font-size: 46px; }
  .node img.logo { height: 40px; align-self: flex-start; margin-bottom: 6px; }
  .edge { fill: none; stroke-width: 3px; stroke-linecap: round; }
  .elabel { position: absolute; transform: translate(-50%, -50%); font-size: 15px; font-weight: 700; letter-spacing: 0.3px; padding: 4px 10px; border-radius: 8px; background: #0d0f0d; border: 1.5px solid #2c312c; color: var(--ink2); white-space: nowrap; }

  /* chrome: scrims so diagram content fades under the title and at the frame edges when zoomed */
  #scrim { position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background: linear-gradient(to bottom, var(--canvas) 0, var(--canvas) 150px, transparent 235px),
                linear-gradient(to right, var(--canvas) 0, transparent 90px),
                linear-gradient(to left, var(--canvas) 0, transparent 90px); }
  /* chrome */
  #head { position: absolute; left: 80px; top: 56px; right: 80px; z-index: 5; }
  #kicker { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 20px; letter-spacing: 2.6px; text-transform: uppercase; color: var(--ink2); }
  #kicker img { height: 30px; }
  #kicker .x { color: var(--ink3); }
  #title { margin-top: 12px; font-family: var(--cond); font-weight: 800; font-size: 68px; line-height: 0.95; text-transform: uppercase; white-space: nowrap; }
  #title .hot { color: var(--acc2); }
  #step { position: absolute; right: 0; top: 0; font-family: var(--cond); font-weight: 700; font-size: 26px; color: var(--ink3); letter-spacing: 1px; }
  #step b { color: var(--ink); }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: #161816; z-index: 6; }
  #bar i { display: block; height: 100%; background: var(--acc); }
  #cap { position: absolute; left: 50%; bottom: 58px; width: 1480px; transform: translateX(-50%); z-index: 6; text-align: center; font-size: 35px; font-weight: 600; line-height: 1.32; color: #fff; padding: 20px 36px; border-radius: 18px; background: rgba(8,9,8,0.86); border: 1.5px solid #222622; }
  #cap code, .panel code { font-family: var(--mono); font-size: 0.86em; color: var(--acc2); }

  /* panels (screen space) */
  .panel { position: absolute; z-index: 4; border-radius: 20px; background: #0c0e0c; border: 2px solid #2c312c; box-shadow: 0 30px 80px rgba(0,0,0,0.6); overflow: hidden; }
  .panel .ph { display: flex; align-items: center; gap: 10px; padding: 14px 22px; border-bottom: 1.5px solid #1f231f; font-family: var(--mono); font-size: 18px; color: var(--ink3); }
  .panel .ph i { width: 13px; height: 13px; border-radius: 50%; background: #2a2e2a; }
  .panel pre { padding: 22px 28px 26px; font-family: var(--mono); font-size: 25px; line-height: 1.55; color: #e6e9e4; white-space: pre; }
  .c-com { color: #6b736c; } .c-str { color: #86efac; } .c-num { color: #fcd34d; } .c-key { color: #c4b5fd; }

  /* terminal */
  #term { position: absolute; left: 110px; top: 200px; width: 1700px; height: 650px; z-index: 4; border-radius: 20px; background: #070807; border: 2px solid #2c312c; box-shadow: 0 30px 90px rgba(0,0,0,0.7); overflow: hidden; display: none; }
  #term .ph { display: flex; align-items: center; gap: 10px; padding: 14px 22px; border-bottom: 1.5px solid #1a1d1a; font-family: var(--mono); font-size: 17px; color: var(--ink3); }
  #term .ph i { width: 13px; height: 13px; border-radius: 50%; }
  #tbody { position: absolute; left: 0; right: 0; top: 54px; bottom: 0; padding: 18px 28px; font-family: var(--mono); font-size: 21px; line-height: 1.6; overflow: hidden; }
  #tbody div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-cmd { color: #fff; } .t-cmd b { color: #4ade80; font-weight: 600; }
  .t-ok { color: #4ade80; } .t-log { color: #e5e7eb; } .t-log em { color: #93c5fd; font-style: normal; } .t-res { color: #fcd34d; } .t-dim { color: #5b625c; }
  .cursor { display: inline-block; width: 12px; height: 24px; background: #e5e7eb; vertical-align: -4px; margin-left: 2px; }

  /* intro / outro */
  .card { position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; background: var(--canvas); }
  .card .logos { display: flex; align-items: center; gap: 44px; }
  .card .logos img { height: 96px; }
  .card .logos .pill { background: #fff; padding: 22px 34px; border-radius: 26px; }
  .card .logos .pill img { height: 70px; display: block; }
  .card .logos .x { font-family: var(--cond); font-size: 70px; color: var(--ink3); }
  .card .wordmark { font-family: var(--cond); font-weight: 800; font-size: 96px; letter-spacing: 1px; }
  .card h1 { font-family: var(--cond); font-weight: 800; font-size: 104px; line-height: 0.95; text-transform: uppercase; text-align: center; }
  .card h1 .hot { color: var(--acc2); }
  .card p { font-size: 34px; color: var(--ink2); text-align: center; }
  .card .url { font-size: 40px; font-weight: 700; color: #0a0a0a; background: var(--green); padding: 16px 44px; border-radius: 999px; }
  .card .meta { font-family: var(--mono); font-size: 22px; color: var(--ink3); }
</style>
</head>
<body>
<div id="frame">
  <div id="bg"></div>
  <div id="glow"></div>
  <div id="world"><svg id="edges"></svg></div>
  <div id="scrim"></div>
  <div id="head">
    <div id="kicker"></div>
    <div id="title"></div>
    <div id="step"></div>
  </div>
  <div id="panels"></div>
  <div id="term"><div class="ph"><i style="background:#ef4444"></i><i style="background:#f59e0b"></i><i style="background:#22c55e"></i><span style="margin-left:12px">monad/cre — zsh</span></div><div id="tbody"></div></div>

  <div id="bar"><i></i></div>
  <div class="card" id="intro"></div>

</div>

/* ---------------------------------------------------------------- helpers */
const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const hi = (s) => s.replace(/<c>/g, '<span class="c-com">').replace(/<\/c>/g, "</span>").replace(/<s>/g, '<span class="c-str">').replace(/<\/s>/g, "</span>")
  .replace(/<n>/g, '<span class="c-num">').replace(/<\/n>/g, "</span>").replace(/<k>/g, '<span class="c-key">').replace(/<\/k>/g, "</span>");

const params = new URLSearchParams(location.search);

document.documentElement.style.setProperty("--acc2", T.acc2);

/* ---------------------------------------------------------------- build */
const byId = {};
const world = $("#world"), svg = $("#edges");
const NS = "http://www.w3.org/2000/svg";
const beats = T.beats;

// When each node first appears: the first beat that shows it (default: the first beat).
const firstShown = {};
for (const b of beats) for (const id of b.show || []) firstShown[id] ??= b.t;
for (const n of T.nodes) {
  n.at = firstShown[n.id] ?? (n.parent && firstShown[n.parent]) ?? INTRO;
  const el = document.createElement("div");
  el.className = `node ${n.kind || ""}`;
  Object.assign(el.style, { left: n.x + "px", top: n.y + "px", width: n.w + "px", height: n.h + "px" });
  el.innerHTML = (n.img ? `<img class="logo" src="${n.img}">` : "") + `<div class="nt">${n.t}</div>` + (n.s ? `<div class="ns">${n.s}</div>` : "") + (n.tag ? `<div class="tag ${n.hot ? "hot" : ""}">${n.tag}</div>` : "");
  if (n.img) el.querySelector(".nt").style.display = "none";
  world.appendChild(el);
  n.el = el;
  byId[n.id] = n;
}
// groups behind everything else
for (const n of T.nodes) if (n.kind === "group") world.insertBefore(n.el, svg.nextSibling);

function anchor(n, side) {
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
  return { r: [n.x + n.w, cy], l: [n.x, cy], t: [cx, n.y], b: [cx, n.y + n.h] }[side];
}
for (const e of T.edges) {
  const A = byId[e.a], B = byId[e.b];
  let fs = e.fs, ts = e.ts;
  if (!fs) {
    const dx = (B.x + B.w / 2) - (A.x + A.w / 2), dy = (B.y + B.h / 2) - (A.y + A.h / 2);
    if (B.x >= A.x + A.w - 4) { fs = "r"; ts = "l"; } else if (B.x + B.w <= A.x + 4) { fs = "l"; ts = "r"; } else if (dy > 0) { fs = "b"; ts = "t"; } else { fs = "t"; ts = "b"; }
  }
  const [x1, y1] = anchor(A, fs), [x2, y2] = anchor(B, ts);
  const k = (s, d) => ({ r: [d, 0], l: [-d, 0], t: [0, -d], b: [0, d] }[s]);
  const d = Math.max(50, Math.hypot(x2 - x1, y2 - y1) * 0.42);
  const [c1x, c1y] = k(fs, d), [c2x, c2y] = k(ts, d);
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", `M${x1},${y1} C${x1 + c1x},${y1 + c1y} ${x2 + c2x},${y2 + c2y} ${x2},${y2}`);
  p.setAttribute("class", "edge");
  svg.appendChild(p);
  e.p = p; e.len = p.getTotalLength();
  if (e.dash) p.style.strokeDasharray = "9 9";
  e.dots = [0, 1].map(() => { const c = document.createElementNS(NS, "circle"); c.setAttribute("r", 6); svg.appendChild(c); return c; });
  const tip = document.createElementNS(NS, "circle"); tip.setAttribute("r", 4.5); svg.appendChild(tip); e.tip = tip;
  e.end = [x2, y2];
  if (e.l) {
    const m = p.getPointAtLength(e.len / 2);
    const lab = document.createElement("div");
    lab.className = "elabel"; lab.textContent = e.l;
    Object.assign(lab.style, { left: m.x + "px", top: m.y + "px" });
    world.appendChild(lab); e.lab = lab;
  }
  e.at = Math.max(A.at, B.at) + 0.45;
}

}

// chrome
$("#kicker").innerHTML = `<span>${T.kicker}</span><span class="x">×</span><span>Terrace</span>`;
const logoHtml = T.wordmark ? `<span class="wordmark">${T.wordmark}</span>` : T.pill ? `<span class="pill"><img src="${T.logo}"></span>` : `<img src="${T.logo}">`;

// terminal replay of a real CRE CLI run (Chainlink only)
let RUN = null;
const TERM_GAP = 0.9; // seconds between runs on screen
function termScript(run) {
  // Real timings, but the ~5 s of compiling is shortened so the video doesn't sit on a spinner.
  const rows = [];
  let at = 0;
  for (const r of run.runs) {
    rows.push({ at, type: "cmd", text: r.cmd, why: r.why });
    at += 1.6;
    const first = r.lines[0]?.at ?? 0;
    for (const l of r.lines) {
      if (l.text.startsWith("│")) continue;
      const dt = Math.min(1.1, (l.at - first) * 0.5);
      rows.push({ at: at + dt, type: "out", text: l.text });
      at += 0.16;
    }
    at += Math.min(1.1, ((r.lines.at(-1)?.at ?? first) - first) * 0.5) + TERM_GAP;
  }
  return rows;
}
function lineHtml(text) {
  const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  if (esc.startsWith("✓")) return `<div class="t-ok">${esc}</div>`;
  if (esc.startsWith("\"")) return `<div class="t-res">→ ${esc}</div>`;
  if (/^Binary hash/.test(esc)) return `<div class="t-dim">${esc}</div>`;
  const m = esc.match(/^(\S+Z) \[(USER LOG|SIMULATION)\] (.*)$/);
  if (m) return `<div class="${m[2] === "USER LOG" ? "t-log" : "t-dim"}"><span class="t-dim">${m[1].slice(11, 19)} [${m[2]}]</span> ${m[2] === "USER LOG" ? `<em>${m[3]}</em>` : m[3]}</div>`;
  return `<div class="t-log">${esc}</div>`;
}

/* ---------------------------------------------------------------- seek */
function beatAt(t) { let i = 0; for (let j = 0; j < beats.length; j++) if (beats[j].t <= t) i = j; return i; }
const CAM0 = [960, 545, 1];
function lit(n, b) {
  if (!b || !b.hl) return 1;
  if (b.hl === "all") return 1;
  if (b.hl.includes(n.id) || (n.parent && b.hl.includes(n.parent))) return 1;
  if (n.kind === "group" && T.nodes.some((c) => c.parent === n.id && b.hl.includes(c.id))) return 1;
  return 0;
}

window.seek = (t) => {
  const i = beatAt(t), b = beats[i], prev = beats[i - 1];
  const since = t - b.t;
  const k = ease(since / 1.4);
  // camera
  const c0 = prev?.cam || CAM0, c1 = b.cam || c0;
  const cx = lerp(c0[0], c1[0], k), cy = lerp(c0[1], c1[1], k), z = lerp(c0[2], c1[2], k);
  world.style.transform = `translate(${960 - cx * z}px, ${560 - cy * z}px) scale(${z})`;
  $("#glow").style.transform = `translate(${960 - 800 + (cx - 960) * 0.4}px, ${560 - 800 + (cy - 540) * 0.3}px)`;

  // panels, terminal: dim the world under them
  const pid = b.panel, pIn = pid ? out((since - 0.6) / 0.7) : 0;
  const prevP = prev?.panel && prev.panel !== pid ? prev.panel : null;
  const pOut = prevP ? 1 - out(since / 0.45) : 0;
  for (const [id, el] of Object.entries(panelEls)) {
    const v = id === pid ? pIn : id === prevP ? pOut : 0;
    el.style.opacity = v;
    el.style.transform = `translateX(${(1 - v) * 60}px)`;
  }
  const termOn = b.term ? out(since / 0.8) : 0;
  const dim = Math.max(pid ? pIn : 0, pOut, termOn);

  // highlight weight, blended from the previous beat
  const hk = out(since / 0.6);
  for (const n of T.nodes) {
    const appear = out((t - n.at) / 0.6);
    const w = lerp(prev ? lit(n, prev) : 1, lit(n, b), hk);
    const op = appear * lerp(0.28, 1, w) * (1 - dim * 0.6) * (1 - termOn * 0.4);
    n.el.style.opacity = op;
    n.el.style.transform = `translateY(${(1 - appear) * 18}px)`;
    if (n.kind !== "group") {
      n.el.style.borderColor = w > 0.5 && b.hl && b.hl !== "all" ? T.acc : "";
      n.el.style.boxShadow = w > 0.5 && b.hl && b.hl !== "all" ? `0 0 0 1px ${T.acc}55, 0 0 34px ${T.acc}40` : "none";
    }
  }
  for (const e of T.edges) {
    const A = byId[e.a], B = byId[e.b];
    const draw = out((t - e.at) / 0.8);
    const w = Math.min(lerp(prev ? lit(A, prev) : 1, lit(A, b), hk), lerp(prev ? lit(B, prev) : 1, lit(B, b), hk));
    const strong = w > 0.5 && b.hl;
    const col = strong ? T.acc : "#3a403a";
    const base = (1 - dim * 0.6) * (1 - termOn * 0.4);
    e.p.style.stroke = col;
    if (e.dash) { e.p.style.opacity = draw * lerp(0.3, 1, w) * base; }
    else { e.p.style.strokeDasharray = `${e.len} ${e.len}`; e.p.style.strokeDashoffset = e.len * (1 - draw); e.p.style.opacity = lerp(0.35, 1, w) * base; }
    e.tip.setAttribute("cx", e.end[0]); e.tip.setAttribute("cy", e.end[1]);
    e.tip.style.fill = col; e.tip.style.opacity = draw >= 0.98 ? base * lerp(0.35, 1, w) : 0;
    if (e.lab) { e.lab.style.opacity = out((t - e.at - 0.5) / 0.5) * lerp(0.35, 1, w) * base; e.lab.style.borderColor = strong ? T.acc + "99" : ""; e.lab.style.color = strong ? "#fff" : ""; }
    // packets flow along lit edges
    const period = Math.max(1.1, e.len / 260);
    e.dots.forEach((c, j) => {
      const ph = ((t - e.at) / period + j / 2) % 1;
      const pt = e.p.getPointAtLength(e.len * ph);
      c.setAttribute("cx", pt.x); c.setAttribute("cy", pt.y);
      c.style.fill = T.acc2;
      c.style.opacity = draw >= 1 && strong ? base * Math.sin(Math.PI * ph) : 0;
    });
  }

  // title + caption: out with the old, in with the new
  const titleIn = out(since / 0.6), capIn = out((since - 0.25) / 0.6);
  $("#title").innerHTML = b.title;
  $("#title").style.opacity = titleIn;
  $("#title").style.transform = `translateY(${(1 - titleIn) * 22}px)`;
  let cap = b.cap;
  if (b.term && RUN) cap = `Captured from our terminal on ${RUN.captured}: the CRE CLI compiles each workflow to WASM, fetches API-Football and Monad state, and reports${RUN.broadcast ? " on chain" : " (dry run)"}.`;
  $("#cap").innerHTML = cap;
  $("#cap").style.opacity = cap ? capIn : 0;
  $("#cap").style.transform = `translateX(-50%) translateY(${(1 - capIn) * 16}px)`;
  const nb = beats.length;
  $("#step").innerHTML = `<b>${String(i + 1).padStart(2, "0")}</b> / ${String(nb).padStart(2, "0")}`;
  $("#bar i").style.width = `${clamp(t / T.dur) * 100}%`;

  // terminal
  const term = $("#term");
  term.style.display = termOn > 0 ? "block" : "none";
  if (termOn > 0 && RUN) {
    term.style.opacity = termOn;
    term.style.transform = `scale(${0.96 + 0.04 * termOn})`;
    const tt = since - 0.6;
    const rows = RUN.rows;
    let html = "";
    let cursor = true;
    for (const r of rows) {
      if (tt < r.at) break;
      if (r.type === "cmd") {
        const n = Math.floor((tt - r.at) * 70);
        const full = r.text;
        const typed = full.slice(0, n);
        html += `<div class="t-cmd"><span class="t-dim"># ${r.why}</span></div><div class="t-cmd"><b>$</b> ${typed}${n < full.length ? '<span class="cursor"></span>' : ""}</div>`;
        cursor = n >= full.length;
      } else html += lineHtml(r.text);
    }
    const body = $("#tbody");
    body.innerHTML = html + (cursor ? `<div class="t-cmd"><b>$</b> <span class="cursor" style="opacity:${Math.floor(tt * 2) % 2 ? 0 : 1}"></span></div>` : "");
    // keep the newest lines in view
    const lines = body.children.length, max = 15;
    for (let j = 0; j < lines - max; j++) body.children[j].style.display = "none";
  }

  // intro / outro cards
  const iv = 1 - out((t - (INTRO - 0.7)) / 0.7);
  const ic = $("#intro");
  ic.style.opacity = iv; ic.style.display = iv > 0 ? "flex" : "none";
  const inK = out(t / 0.9);
  ic.querySelector(".logos").style.transform = `translateY(${(1 - inK) * 30}px)`;
  ic.querySelector("h1").style.opacity = out((t - 0.35) / 0.7);
  ic.querySelector("p").style.opacity = out((t - 0.8) / 0.7);
  ic.querySelector(".meta").style.opacity = out((t - 1.2) / 0.7);
  const ov = out((t - (T.dur - OUTRO)) / 0.8);
  const oc = $("#outro");
  oc.style.opacity = ov; oc.style.display = ov > 0 ? "flex" : "none";
  oc.querySelector("h1").style.transform = `translateY(${(1 - out((t - (T.dur - OUTRO) - 0.2) / 0.8)) * 26}px)`;
};

/* ---------------------------------------------------------------- run */
function fit() {
  if (params.get("render")) return;
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $("#frame").style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
}
addEventListener("resize", fit);
(async () => {
  if (KEY === "chainlink") {
    RUN = await fetch("cre-run.json").then((r) => r.json());
    RUN.rows = termScript(RUN);
    const end = 0.6 + RUN.rows.at(-1).at + 3;
    // the terminal beat lasts as long as the run takes to replay
    T.dur = Math.max(T.dur, beats.at(-1).t + end + OUTRO);
  }
  window.DUR = T.dur;
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => i.complete ? 0 : new Promise((r) => (i.onload = i.onerror = r))));
  fit();
  let t = parseFloat(params.get("t") || "0");
  window.seek(t);
  window.ready = true;
  if (params.get("render")) return;
  let playing = true, last = performance.now();
  const loop = (now) => { if (playing) { t += (now - last) / 1000; if (t > window.DUR) t = 0; window.seek(t); } last = now; requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  addEventListener("keydown", (e) => {
    if (e.key === " ") playing = !playing;
    if (e.key === "ArrowRight") { t += e.shiftKey ? 5 : 1; window.seek(t); }
    if (e.key === "ArrowLeft") { t = Math.max(0, t - (e.shiftKey ? 5 : 1)); window.seek(t); }
  });
})();
</script>
</body>
