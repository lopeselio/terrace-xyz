<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Terrace pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;700;800&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #0B0E0C; overflow: hidden; }
  body { width: 1920px; height: 1080px; position: relative; font-family: 'Barlow', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  p { line-height: 1.4; } h1 { line-height: 1.1; } h2 { line-height: 1.15; } h3 { line-height: 1.2; }
  a { color: inherit; text-decoration: none; }
  img, svg { display: block; }
  .slide { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; visibility: hidden; transform-origin: 50% 50%; }
  #cap { position: absolute; left: 210px; bottom: 36px; width: 1500px; padding: 14px 36px; border-radius: 18px;
         background: rgba(11,14,12,0.88); border: 1px solid #26302A; text-align: center; font-size: 34px; font-weight: 600;
         line-height: 1.4; color: #F3F4EF; opacity: 0; z-index: 10; }
  #cap .w { display: inline-block; padding: 0 5px; border-radius: 8px; color: #66706A; }
  #cap .w.done { color: #F3F4EF; }
  #cap .w.now { color: #0B0E0C; background: #2BD46B; }
  #prog { position: absolute; left: 128px; top: 52px; width: 1664px; height: 4px; display: flex; gap: 8px; z-index: 10; opacity: 0.9; }
  #prog i { flex: 1; height: 4px; border-radius: 2px; background: rgba(243,244,239,0.12); overflow: hidden; }
  #prog i b { display: block; height: 100%; width: 0; background: #2BD46B; }
</style>
</head>
<body>
<!--SLIDES-->
<div id="prog"></div>
<div id="cap"></div>
<script>
const TL = /*TIMELINE*/;
const clamp = (x) => Math.max(0, Math.min(1, x));
const outCubic = (p) => 1 - Math.pow(1 - p, 3);
const inOut = (p) => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const outBack = (p) => { const c = 1.4; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

const slides = [...document.querySelectorAll('.slide')].map((el, i) => {
  const s = TL.slides[i];
  const builds = [...el.querySelectorAll('[data-build-in],[data-build-out]')].map((node) => {
    const parse = (a) => { if (!a) return null; const [effect, order] = a.split(' '); return { effect, t: s.steps[order] }; };
    return { node, inn: parse(node.getAttribute('data-build-in')), out: parse(node.getAttribute('data-build-out')) };
  });
  return { el, s, builds };
});

const prog = document.getElementById('prog');
TL.slides.forEach(() => prog.appendChild(Object.assign(document.createElement('i'), { innerHTML: '<b></b>' })));
const bars = [...prog.querySelectorAll('b')];

const cap = document.getElementById('cap');
const lines = [];
TL.slides.forEach((s, si) => s.lines.forEach((l, li) => {
  const next = s.lines[li + 1];
  const end = next ? next.t0 - 0.12 : Math.min(l.t1 + 0.9, s.t1 + 0.05);
  lines.push({ ...l, show: l.t0 - 0.22, hide: end });
}));
let shown = -1, spans = [];

function setCaption(t) {
  const idx = lines.findIndex((l) => t >= l.show && t < l.hide);
  if (idx !== shown) {
    shown = idx;
    cap.innerHTML = '';
    spans = [];
    if (idx >= 0) for (const w of lines[idx].words) {
      const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = w.w;
      cap.appendChild(sp); cap.appendChild(document.createTextNode(' ')); spans.push(sp);
    }
  }
  if (idx < 0) { cap.style.opacity = 0; return; }
  const l = lines[idx];
  cap.style.opacity = Math.min(clamp((t - l.show) / 0.2), clamp((l.hide - t) / 0.15));
  l.words.forEach((w, i) => {
    const until = i + 1 < l.words.length ? l.words[i + 1].t0 : w.t1 + 0.25;
    spans[i].className = 'w' + (t >= until ? ' done' : t >= w.t0 ? ' now' : '');
  });
}

function buildStyle(b, t) {
  let op = 1, tf = '';
  if (b.inn) {
    const p = clamp((t - b.inn.t) / 0.6), e = outCubic(p);
    op = e;
    if (b.inn.effect === 'rise') tf = `translateY(${44 * (1 - e)}px)`;
    else if (b.inn.effect === 'drop') tf = `translateY(${-44 * (1 - e)}px)`;
    else if (b.inn.effect === 'left') tf = `translateX(${-70 * (1 - e)}px)`;
    else if (b.inn.effect === 'pop') tf = `scale(${0.86 + 0.14 * (p >= 1 ? 1 : outBack(p))})`;
  }
  if (b.out) op *= 1 - clamp((t - b.out.t) / 0.35);
  b.node.style.opacity = op;
  b.node.style.transform = tf;
}

window.seek = (t) => {
  slides.forEach(({ el, s, builds }, i) => {
    const last = i === slides.length - 1;
    const visible = t >= s.t0 && (last || t < s.t1 + TL.xfade);
    el.style.visibility = visible ? 'visible' : 'hidden';
    if (!visible) return;
    const drift = 1 + 0.014 * clamp((t - s.t0) / (s.t1 - s.t0 + TL.xfade));
    const p = i === 0 ? clamp(t / 0.5) : clamp((t - s.t0) / TL.xfade);
    const prev = i > 0 ? TL.slides[i - 1] : null;
    let tx = 0, op = 1;
    if (prev && prev.transition === 'push') tx = 1920 * (1 - inOut(p)); else op = inOut(p);
    const next = TL.slides[i + 1];
    if (s.transition === 'push' && next && t >= s.t1) tx = -1920 * inOut(clamp((t - s.t1) / TL.xfade));
    if (last) op *= 1 - clamp((t - (TL.dur - 0.5)) / 0.5);
    el.style.opacity = op;
    el.style.transform = `translateX(${tx}px) scale(${drift})`;
    builds.forEach((b) => buildStyle(b, t));
  });
  TL.slides.forEach((s, i) => { bars[i].style.width = `${100 * clamp((t - s.t0) / (s.t1 - s.t0))}%`; });
  prog.style.opacity = 0.9 * clamp(t / 0.5) * (1 - clamp((t - (TL.dur - 0.5)) / 0.5));
  setCaption(t);
};

(async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; })));
  window.seek(0);
  window.ready = true;
  if (new URLSearchParams(location.search).has('render')) return;
  let t = 0, last = performance.now(), playing = true;
  const loop = (now) => { if (playing) { t += (now - last) / 1000; if (t > TL.dur) t = 0; window.seek(t); } last = now; requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  addEventListener('keydown', (e) => {
    if (e.key === ' ') playing = !playing;
    if (e.key === 'ArrowRight') { t += e.shiftKey ? 5 : 1; window.seek(t); }
    if (e.key === 'ArrowLeft') { t = Math.max(0, t - (e.shiftKey ? 5 : 1)); window.seek(t); }
  });
})();
</script>
</body>
</html>
