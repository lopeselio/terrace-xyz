<style>

  .o-3 { grid-template-columns: repeat(3, 1fr); }

  .toast { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 11px 18px; border-radius: 999px; background: #0c1f14; border: 1px solid #1f6b3a; color: var(--green-ink); font-weight: 700; font-size: 15px; white-space: nowrap; box-shadow: 0 12px 30px rgba(0,0,0,0.6); z-index: 6; }

  /* narration beside the phone */

  body.v .beat { font-size: 96px; margin-top: 18px; }

  .steps { margin-top: 34px; display: flex; gap: 10px; }

  .roll { display: inline-block; overflow: hidden; height: 1.08em; vertical-align: -0.12em; line-height: 1.08; }

<div id="frame">
  <div id="glow"></div>
  <div id="grid"></div>
  <div id="stage" class="layer"></div>
  <div id="phonewrap"><div id="phone"><div id="screen"><div id="island"></div><div id="status"><span>9:41</span><span>●●● ▮</span></div><div id="view"></div></div></div></div>
  <div id="cap"></div>
  <div id="fx" style="position:absolute;inset:0;z-index:24;pointer-events:none"></div>
  <div id="tap"></div><div id="ripple"></div>
  <div id="vig"></div>

<script>
const $ = (id) => document.getElementById(id);
const VERT = new URLSearchParams(location.search).get("f") === "9x16";
if (VERT) document.body.classList.add("v");
const W = VERT ? 1080 : 1920, H = VERT ? 1920 : 1080;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => cl((t - a) / d);           // a start and a duration
const span = (t, [a, b]) => prog(t, a, b - a);       // a start and an end
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const spring = (x) => (x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(9 * x));
const lerp = (a, b, x) => a + (b - a) * x;
function life(t, a, b, { d = 0.5, dy = 26, out = 0.35 } = {}) {
  const i = spring(prog(t, a, d)), o = eo(prog(t, b - out, out));
  return { o: cl(prog(t, a, d * 0.6)) * (1 - o), y: (1 - i) * dy - o * 14, s: lerp(0.96, 1, i) };
}
const st = ({ o, y = 0, s = 1 }) => `opacity:${o.toFixed(3)};transform:translateY(${y.toFixed(1)}px) scale(${s.toFixed(4)})`;
const icon = (n, s = 24, sw = 1.75) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const usd = (n) => `$${Math.abs(n).toFixed(2)}`;
const signed = (n) => `${n >= 0 ? "+" : "−"}${usd(n)}`;

/** Words rise out of a mask one after another, and drop away together at `b`. *word* is green, _word_ red. */
function words(t, a, b, html, { stag = 0.07, d = 0.55 } = {}) {
  return html.split(/(<br\/>)/).map((chunk) => chunk === "<br/>" ? "<br/>" : chunk.split(" ").filter(Boolean).map((w, i) => {
    const p = spring(prog(t, a + i * stag, d)), o = eo(prog(t, b - 0.3, 0.3));
    const txt = /^\*.*\*$/.test(w) ? `<span class="green">${w.slice(1, -1)}</span>` : /^_.*_$/.test(w) ? `<span class="redt">${w.slice(1, -1)}</span>` : w;
    return `<span class="m"><span class="w" style="transform:translateY(${((1 - p) * 110 + o * -110).toFixed(1)}%)">${txt}</span></span>`;
  }).join(" ")).join("");
}

/** Old text rolls up and out, new text rolls in from below, character by character (RollingNumber). */
function roll(prev, next, k) {
  if (k >= 1 || prev === next) return next;
  const n = Math.max(prev.length, next.length), a = prev.padStart(n, " "), b = next.padStart(n, " ");
  return [...b].map((c, i) => {
    if (c === a[i]) return c === " " ? "" : c;
    const ki = eio(cl(k * 1.25 - (n - 1 - i) * 0.06));
    return `<span class="roll"><span style="transform:translateY(${(-ki * 100).toFixed(1)}%)"><span style="display:block">${a[i] === " " ? "&nbsp;" : a[i]}</span><span style="display:block">${c === " " ? "&nbsp;" : c}</span></span></span>`;
  }).join("");
}

/* ---------------- one fan's Saturday (55 s) ---------------- */
const T = {
  cover: [0, 3.6],
  story: [3.6, 46.4],
  gBruno: 12.6,   // Man Utd 1-0, Bruno Fernandes 41'
  gArs: 18.9,     // Arsenal 1-0, 63'
  gChe: 24.4,     // Chelsea level, 84'
  gWin: 28.9,     // Man Utd 2-1, 90+2'
  ft: 32.8,
  taps: [35.2, 36.7, 37.4], scrollA: [35.7, 36.3],
  next: [40.2, 41.5],
  end: 46.4, dur: 55,
};
const BEATS = [
  [3.9, "Saturday. *3pm.*", "Three bets, two games."],
  [8.2, "Losing as it _stands._", "All three in the red."],
  [12.4, "*Bruno.* 41'.", "Two bets flip to winning."],
  [18.7, "*Arsenal.* 63'.", "All three winning."],
  [24.2, "84'. Chelsea _level._", "One slips back."],
  [28.7, "90+2'. *Back* *in* *front.*", "Three winning again."],
  [32.7, "*Full* *time.*", "Three from three. Collect."],
  [40.0, "What's *next?*", "Your teams meet on Saturday."],
];
// match clock, shared by both 3pm kick-offs
const CLOCK = [[T.story[0], 9], [T.gBruno, 41], [T.gArs, 63], [T.gChe, 84], [T.gWin, 92], [T.ft - 0.2, 95]];
function clock(t) {
  if (t >= T.ft) return "FT";
  let m = CLOCK[0][1];
  for (let i = 1; i < CLOCK.length; i++) if (t >= CLOCK[i - 1][0]) m = lerp(CLOCK[i - 1][1], CLOCK[i][1], span(t, [CLOCK[i - 1][0], CLOCK[i][0]]));
  m = Math.floor(m);
  return m > 90 ? `90+${m - 90}'` : `${m}'`;
}

/* every position as a timeline of states: lose / win / won */
const RET = 19.7; // a $10 bet pays back $19.70 at these prices
const POS = {
  ars: { title: "Arsenal win", pick: "Yes", tl: [[-1, "lose"], [T.gArs, "win"], [T.ft, "won"]] },
  utd: { title: "Man Utd win", pick: "Yes", tl: [[-1, "lose"], [T.gBruno, "win"], [T.gChe, "lose"], [T.gWin, "win"], [T.ft, "won"]] },
  bruno: { title: "Bruno Fernandes scores before half-time", pick: "Yes", take: true, tl: [[-1, "lose"], [T.gBruno, "win"], [T.ft, "won"]] },
};
const SCORE = { A: [[-1, "0–0"], [T.gArs, "1–0"]], B: [[-1, "0–0"], [T.gBruno, "1–0"], [T.gChe, "1–1"], [T.gWin, "2–1"]] };
function at(tl, t) {
  let i = 0;
  while (i + 1 < tl.length && t >= tl[i + 1][0]) i++;
  return { s: tl[i][1], prev: i ? tl[i - 1][1] : tl[i][1], since: tl[i][0] };
}
const gain = (s) => (s === "win" || s === "won" ? RET - 10 : -10);
const netNow = (t) => Object.values(POS).reduce((n, p) => n + gain(at(p.tl, t).s), 0);
/** The net figure counts between values instead of jumping. */
function netCount(t) {
  const flips = [T.gBruno, T.gArs, T.gChe, T.gWin].filter((e) => e <= t);
  const e = flips[flips.length - 1];
  if (e === undefined) return netNow(t);
  return lerp(netNow(e - 0.01), netNow(e), eio(prog(t, e, 1.0)));
}
const collectedAt = (i) => T.taps[i] + 0.15;

/* ---------------- cover ---------------- */
function cover(t) {
  if (t >= T.cover[1]) return "";
  const out = eo(prog(t, T.cover[1] - 0.5, 0.5));
  const s = (k) => `opacity:${1 - out};transform:translateY(${-out * 30 * k}px)`;
  const cy = VERT ? 560 : 150, R = VERT ? 105 : 82;
  return `<div class="ctr" style="top:${cy}px;${s(1)}">
      <span style="display:inline-flex;align-items:center;gap:16px;font-family:var(--cond);font-weight:800;font-size:${VERT ? 44 : 40}px;letter-spacing:2px"><img src="assets/terrace.png" style="width:${VERT ? 64 : 56}px;height:${VERT ? 64 : 56}px;border-radius:14px" />TERRACE</span>
    </div>
    <div class="ring" style="left:${W / 2 - R}px;top:${cy + (VERT ? 110 : 92)}px;width:${2 * R}px;height:${2 * R}px;${s(1.4)};box-shadow:0 0 ${80 + 24 * Math.sin(t * 4)}px rgba(239,68,68,0.45)">${icon("whistle", VERT ? 96 : 84, 1.9)}</div>
    <div class="ctr" style="top:${cy + (VERT ? 340 : 296)}px;${s(1.8)}">
      <div><span class="kicker" style="height:50px"><span class="dot" style="opacity:${0.55 + 0.45 * Math.sin(t * 6)}"></span>Live</span></div>
      <span class="big" style="display:block;font-size:${VERT ? 190 : 200}px;margin-top:26px">Game <span class="green">day</span></span>
      <span class="lead" style="display:block;font-size:${VERT ? 40 : 42}px;margin-top:26px;color:var(--ink)">${VERT ? "Every bet you've got on,<br/>beside the live score." : "Every bet you've got on, beside the live score."}</span>
      <div style="margin-top:${VERT ? 54 : 40}px"><span class="brandrow">On <img src="assets/monad.png" /><b>MONAD</b> &nbsp;· settled by <img class="cl" src="assets/chainlink.png" /><b>CHAINLINK</b></span></div>
    </div>`;
}

/* ---------------- the Game day screen ---------------- */
const tabs = (on) => `<div class="tabbar">${[["home", "Home"], ["pitch", "Markets"], ["plus", "Create"], ["users", "Social"], ["shield", "Profile"]].map(([ic, l]) =>
  `<div class="tab${l === "Create" ? " tab-create" : ""}${l === on ? " on" : ""}" id="tab-${l}"><span class="pill">${icon(ic, 22)}</span><span class="tl">${l}</span></div>`).join("")}</div>`;
const CREST = (id) => `<span class="crest"><img src="assets/crest-${id}.png" /></span>`;
const BADGE = { lose: ["b-lost", "Losing"], win: ["b-won", "Winning"], won: ["b-won", "Won"] };
const COLOR = { lose: "var(--red)", win: "var(--green)", won: "var(--green)" };

function posLine(key, t, tapIdx) {
  const p = POS[key], { s, prev, since } = at(p.tl, t);
  const k = prog(t, since, 0.9);
  const [cls, label] = BADGE[s];
  const amtOf = (x) => (x === "lose" ? `−${usd(10)}` : `+${usd(RET - 10)}`);
  const amt = roll(amtOf(prev), amtOf(s), prog(t, since, 0.7));
  // the bar sweeps down from the new colour; a soft wash crosses the row
  const sw = eio(prog(t, since, 0.6));
  const bar = prev === s || k >= 1 ? COLOR[s] : `linear-gradient(180deg, ${COLOR[s]} ${(sw * 100).toFixed(1)}%, ${COLOR[prev]} ${(sw * 100).toFixed(1)}%)`;
  const good = s !== "lose";
  const wash = k > 0 && k < 1 && prev !== s ? `background:rgba(${good ? "34,197,94" : "239,68,68"},${(0.26 * (1 - k)).toFixed(3)});` : "";
  const pop = k > 0 && k < 1 && prev !== s ? `transform:scale(${(1 + 0.14 * Math.sin(Math.min(1, k * 2.2) * Math.PI)).toFixed(3)})` : "";
  const ft = t >= T.ft, done = ft && t >= collectedAt(tapIdx);
  const btn = ft && t < collectedAt(tapIdx) + 2.0
    ? `<div class="cta gd-pos-cta" id="c${tapIdx}" style="opacity:${eo(prog(t, T.ft + 0.3 + tapIdx * 0.15, 0.4))};${done ? "background:var(--raised);color:var(--green-ink);border:1px solid var(--green-mid)" : ""}">${done ? `${icon("check", 18, 2.4)} Collected` : `Collect ${usd(RET)}`}</div>` : "";
  return `<div class="gd-pos" style="${wash}"><i class="bar" style="background:${bar}"></i>
    <div style="min-width:0"><div class="uname">${p.title}</div><div class="umeta">${p.pick} · ${usd(10)}${p.take ? ` · <span class="badge b-chainlink" style="padding:1px 6px;font-size:10px"><img src="assets/chainlink.png" style="width:11px;height:11px;border-radius:50%;background:#fff" />read live</span>` : ""}</div></div>
    <div class="gd-pos-side"><span class="badge ${cls}" style="${pop}">${label}</span><div class="gd-amt ${good ? "amt-won" : "amt-lost"}">${amt}</div></div>${btn}
  </div>`;
}

function board(id, game, home, away, keys, taps, goals, t) {
  const ft = t >= T.ft;
  const sc = at(SCORE[game], t), sk = prog(t, sc.since, 0.6);
  let banner = "", pop = 1;
  for (const [g, txt] of goals) {
    const k = prog(t, g, 1.7);
    if (k <= 0 || k >= 1) continue;
    const i = eo(prog(t, g, 0.25)), o = eo(prog(t, g + 1.35, 0.35));
    banner = `<div class="gd-goal" style="opacity:${(cl(prog(t, g, 0.12)) * (1 - o)).toFixed(3)};clip-path:inset(0 ${((1 - i) * 50).toFixed(1)}% 0 ${((1 - i) * 50).toFixed(1)}%)">${icon("ball", 20, 2)}${txt}</div>`;
    pop = 1 + 0.2 * Math.sin(Math.min(1, prog(t, g, 0.7)) * Math.PI);
  }
  const n = keys.reduce((s, k) => s + gain(at(POS[k].tl, t).s), 0);
  const pulse = 0.5 + 0.5 * Math.sin(t * 6.2);
  const clk = clock(t);
  return `<div class="card gd-match${ft ? "" : " gd-live"}" id="${id}">
    ${banner}<div class="gd-head">${ft ? `<span class="badge b-settled">FT</span>` : `<span class="badge b-live" style="box-shadow:0 0 ${(4 + 10 * pulse).toFixed(1)}px rgba(239,68,68,${(0.35 + 0.4 * pulse).toFixed(2)})"><i class="livedot" style="opacity:${(0.45 + 0.55 * pulse).toFixed(2)}"></i>${clk}</span>`}Premier League<span style="margin-left:auto;color:var(--ink-4)">${icon("chevronRight", 16)}</span></div>
    <div class="gd-score"><span class="t">${CREST(home[0])}${home[1]}</span><span class="sc" style="display:inline-block;transform:scale(${pop.toFixed(3)});${pop > 1.01 ? "color:var(--green-ink)" : ""}">${roll(sc.prev, sc.s, sk)}</span><span class="t away">${away[1]}${CREST(away[0])}</span></div>
    <div class="gd-positions">${keys.map((k, i) => posLine(k, t, taps[i])).join("")}</div>
    <div class="gd-foot">${ft ? "<span>Settled</span>" : `<span>${usd(10 * keys.length)} riding</span>`}<span class="${n >= 0 ? "amt-won" : "amt-lost"}">${ft ? "As it finished" : "If it ends now"} ${signed(n)}</span></div>
  </div>`;
}

function hero(t) {
  const ft = t >= T.ft;
  const n = netCount(t);
  const states = Object.values(POS).map((p) => at(p.tl, t).s);
  const w = states.filter((s) => s === "win").length, l = states.filter((s) => s === "lose").length;
  const left = T.taps.filter((x, i) => t < collectedAt(i)).length;
  const rid = ft ? 0 : 30;
  const tint = n >= 0 ? "var(--green-mid)" : "var(--red-mid)";
  const bg = n >= 0 ? "var(--green-tint)" : "#1a0c0c";
  return `<div class="card gd-hero" id="hero" style="border-color:${tint};background:linear-gradient(180deg, ${bg}, var(--surface) 80%)"><div class="gd-hero-row">
      <div><div class="gd-k">On the line</div><div class="gd-v">${usd(rid)}</div><div class="umeta">${ft ? "0 games" : "2 games"}</div></div>
      <div style="text-align:right"><div class="gd-k">If it all ends now</div><div class="gd-v ${n >= 0 ? "amt-won" : "amt-lost"}">${signed(n)}</div><div class="umeta">${ft ? "3 won" : `${w} winning · ${l} losing`}</div></div>
    </div>${ft && left ? `<div class="gd-collect">${icon("dollar", 16)} ${usd(RET * left)} ready to collect below</div>` : ""}</div>`;
}

function gameDayScreen(t) {
  const ft = t >= T.ft;
  const enter = (i) => { const p = spring(prog(t, T.story[0] + 0.5 + i * 0.18, 0.6)); return `opacity:${cl(prog(t, T.story[0] + 0.5 + i * 0.18, 0.25))};transform:translateY(${((1 - p) * 40).toFixed(1)}px)`; };
  const A = board("cardA", "A", ["42", "Arsenal"], ["47", "Spurs"], ["ars"], [0], [[T.gArs, "GOAL · ARSENAL 63'"]], t);
  const B = board("cardB", "B", ["33", "Man Utd"], ["49", "Chelsea"], ["utd", "bruno"], [1, 2], [[T.gBruno, "GOAL · BRUNO FERNANDES 41'"], [T.gChe, "GOAL · CHELSEA 84'"], [T.gWin, "GOAL · MAN UTD 90+2'"]], t);
  let h = `<div style="${enter(0)}">${hero(t)}</div>`;
  h += `<div class="sec-hd" style="${enter(1)}">${ft ? "<h3>Full time</h3>" : `<h3 style="color:var(--red-ink)">In play</h3><span class="badge b-live">2 games</span>`}</div>`;
  h += `<div style="${enter(1)}">${A}</div><div style="margin-top:10px;${enter(2)}">${B}</div>`;
  h += `<div class="sec-hd" id="nextHd"><h3>Your teams play next</h3><span class="more">Fixtures ›</span></div>
    <div class="card"><div class="gd-head"><span class="badge b-open">Sat 17:30</span>Premier League</div>
      <div class="gd-score"><span class="t">${CREST("42")}Arsenal</span><span class="sc" style="color:var(--ink-3);font-size:22px">v</span><span class="t away">Man Utd${CREST("33")}</span></div>
      <div class="mk-odds o-3"><div class="o-n"><span class="lbl">Home</span><span class="val">4/5</span></div><div class="o-n"><span class="lbl">Draw</span><span class="val">13/5</span></div><div class="o-n"><span class="lbl">Away</span><span class="val">3/1</span></div></div></div>
    <div class="sec-hd"><h3>Takes on it</h3><span class="more">Markets ›</span></div>
    <div class="card"><div class="gd-head">Arsenal v Man Utd · 214 fans</div>
      <div class="uname" style="font-size:17px;margin-top:8px">Bruno scores at the Emirates</div>
      <div class="mk-odds"><div class="o-yes"><span class="lbl">Yes</span><span class="val">9/4</span></div><div class="o-no"><span class="lbl">No</span><span class="val">1/3</span></div></div></div>`;
  const sy = -eio(span(t, T.scrollA)) * 150 - eio(span(t, T.next)) * 470;
  let out = `<div class="hdr"><div style="flex:1;min-width:0"><div class="hdr-title">Game day</div><div class="hdr-sub">Everything you've got on, as it happens</div></div><span class="balpill">$${(70 + RET * T.taps.filter((x, i) => t >= collectedAt(i) + 0.3).length).toFixed(2)}</span></div>
    <div class="body"><div class="scroll" style="transform:translateY(${sy.toFixed(1)}px)">${h}</div></div>${tabs("Profile")}`;
  const tp = prog(t, T.taps[2] + 0.4, 0.35) * (1 - prog(t, T.taps[2] + 2.6, 0.3));
  if (tp > 0) out += `<div class="toast" style="opacity:${tp};transform:translate(-50%,${(1 - eo(prog(t, T.taps[2] + 0.4, 0.35))) * 14}px)">${icon("check", 18, 2.4)} <b>${usd(RET * 3)}</b> collected</div>`;
  return out;
}

/* ---------------- camera: a slow push into the card that just changed ---------------- */
const SHOTS = [[8.0, 11.6, "hero", 1.16], [12.3, 15.9, "cardB", 1.14], [18.6, 21.9, "cardA", 1.15], [24.1, 27.6, "cardB", 1.14], [28.6, 31.7, "cardB", 1.12]];
function camera(t) {
  const ph = $("phone");
  let s = 1, oy = 450;
  for (const [a, b, id, z] of SHOTS) {
    const k = eio(prog(t, a, 0.9)) * (1 - eio(prog(t, b - 0.9, 0.9)));
    if (k <= 0) continue;
    const el = $(id);
    if (!el) continue;
    // where the card sits on the phone, from layout (not affected by transforms)
    let y = el.offsetHeight / 2, n = el;
    while (n && n.id !== "screen") { y += n.offsetTop; n = n.offsetParent; }
    y += 12;
    const zz = VERT ? 1 + (z - 1) * 0.55 : z; // gentler in 9:16 so the phone stays inside the safe area
    s = lerp(1, zz, k);
    oy = lerp(450, cl(y, 200, 760), k);
  }
  return { s, oy };
}

/* ---------------- collect: coins burst out of each button ---------------- */
function coins(t) {
  let h = "";
  T.taps.forEach((tp, i) => {
    const kc = prog(t, tp + 0.1, 1.1), el = $(`c${i}`);
    if (kc <= 0 || kc >= 1 || !el) return;
    const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    h += [0, 1, 2, 3, 4, 5].map((j) => {
      const ang = -Math.PI / 2 + (j - 2.5) * 0.4, d = eo(kc) * (140 + (j % 3) * 28);
      return `<div class="coinpop" style="left:${x + Math.cos(ang) * d}px;top:${y + Math.sin(ang) * d - 60 * kc}px;opacity:${1 - eo(kc)};transform:scale(${lerp(0.4, 1, spring(kc))})">$</div>`;
    }).join("");
  });
  $("fx").innerHTML = h;
}

const TAPS = T.taps.map((x, i) => [x, `c${i}`]);
function tap(t) {
  const dot = $("tap"), rip = $("ripple");
  dot.style.opacity = 0; rip.style.opacity = 0;
  for (const [a, id] of TAPS) {
    if (t < a - 0.45 || t > a + 0.5) continue;
    const el = $(id);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2, k = t - a;
    const o = k < -0.3 ? prog(t, a - 0.45, 0.15) : k > 0.3 ? 1 - prog(t, a + 0.3, 0.2) : 1;
    dot.style.cssText = `left:${x}px;top:${y + (k < -0.1 ? (1 - eo(prog(t, a - 0.45, 0.35))) * 40 : 0)}px;opacity:${o};transform:scale(${k > -0.08 && k < 0.1 ? 0.8 : 1})`;
    if (k > 0) {
      const p = eo(prog(t, a, 0.45)), size = 30 + p * 70;
      rip.style.cssText = `left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;opacity:${(1 - p) * 0.9}`;
    }
  }
}

/* ---------------- narration ---------------- */
function narration(t) {
  const [a, b] = T.story;
  if (t < a || t >= b) return "";
  const idx = BEATS.reduce((n, [x], i) => (t >= x ? i : n), -1);
  let h = `<div style="${st(life(t, a + 0.1, b))}"><span class="kicker"><span class="dot" style="opacity:${0.55 + 0.45 * Math.sin(t * 6)}"></span>One fan · Game day</span></div>`;
  if (idx >= 0) {
    const [x, line, sub] = BEATS[idx], next = BEATS[idx + 1] ? BEATS[idx + 1][0] : b;
    const long = line.replace(/[*_]/g, "").length > 15; // long lines step down a size so they stay inside the frame
    h += `<div class="beat" style="${long ? `font-size:${VERT ? 80 : 98}px` : ""}">${words(t, x + 0.05, next, line)}</div>`;
    h += `<div class="bsub" style="${st(life(t, x + 0.45, next, { dy: 20, out: 0.3 }))}">${sub}</div>`;
    h += `<div class="cextra" style="${st(life(t, x + 0.7, next, { dy: 16, out: 0.3 }))}">${idx === 2 ? `<span class="chip-cl"><img src="assets/chainlink.png" />Read live with the rules Chainlink settles by</span>` : ""}</div>`;
  }
  h += `<div class="steps" style="${st(life(t, a + 0.6, b))}">${BEATS.map((_, i) => `<i class="${i < idx ? "on" : i === idx ? "now" : ""}"></i>`).join("")}</div>`;
  return h;
}

function endCard(t) {
  if (t < T.end) return "";
  const e = (k, dy = 30) => st(life(t, T.end + 0.25 + k * 0.3, 99, { d: 0.7, dy }));
  const top = VERT ? 560 : 150;
  return `<div class="ctr" style="top:${top}px;opacity:${1 - prog(t, T.dur - 0.6, 0.6)}">
    <div class="ring" style="position:relative;display:inline-flex;width:150px;height:150px;${e(0)}">${icon("whistle", 80, 1.9)}</div>
    <span class="big" style="display:block;font-size:150px;margin-top:40px;${e(1)}">Game <span class="green">day</span></span>
    <span class="lead" style="display:block;font-size:${VERT ? 42 : 44}px;margin-top:24px;color:var(--ink);${e(2, 16)}">Every bet, beside the live score.</span>
    <div style="margin-top:40px;${e(3, 16)}"><span class="pillurl">play.terrace.social</span></div>
    <div style="margin-top:38px;${e(4, 12)}"><span class="brandrow"><img src="assets/terrace.png" /><b>TERRACE</b> &nbsp;on <img src="assets/monad.png" /><b>MONAD</b></span></div>
    <div style="margin-top:22px;${e(5, 12)}"><span class="brandrow">Settled by <img class="cl" src="assets/chainlink.png" /><b>CHAINLINK</b></span></div>
  </div>`;
}

/* ---------------- seek ---------------- */
window.seek = (t) => {
  // the room's light follows the fan's mood: red while losing, green once in front
  const n = t >= T.story[0] && t < T.end ? netCount(t) : 0;
  const g = cl((n + 30) / 60), red = 0.13 * (1 - g), grn = 0.05 + 0.1 * g;
  $("glow").style.background = `radial-gradient(900px 760px at ${VERT ? 50 : 30}% ${VERT ? 55 : 48}%, rgba(239,68,68,${red.toFixed(3)}), transparent 70%), radial-gradient(1000px 760px at ${VERT ? 50 : 62}% ${VERT ? 30 : 40}%, rgba(34,197,94,${grn.toFixed(3)}), transparent 70%)`;
  $("stage").innerHTML = cover(t) + endCard(t);

  const inPhone = t >= T.story[0] - 0.2 && t < T.end;
  $("phonewrap").style.display = inPhone ? "" : "none";
  if (inPhone) {
    $("view").innerHTML = gameDayScreen(t);
    $("view").style.cssText = "";
    const ph = life(t, T.story[0], T.end, { d: 0.8, dy: 120, out: 0.5 });
    const cam = camera(t);
    $("phone").style.cssText = `opacity:${ph.o.toFixed(3)};transform-origin:220px ${cam.oy.toFixed(1)}px;transform:translateY(${ph.y.toFixed(1)}px) scale(${(ph.s * cam.s).toFixed(4)})`;
  }
  $("cap").innerHTML = narration(t);
  coins(t);
  tap(t);
};

const IMGS = ["assets/terrace.png", "assets/monad.png", "assets/chainlink.png", ...["42", "47", "33", "49"].map((id) => `assets/crest-${id}.png`)];
document.fonts.ready.then(() => Promise.all(IMGS.map((s) => { const i = new Image(); i.src = s; return i.decode().catch(() => {}); }))).then(() => {
  window.seek(Number(new URLSearchParams(location.search).get("t") || 0));
  window.ready = true;
});
</script>
</body>
</html>
