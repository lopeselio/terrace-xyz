<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Terrace Game Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=block" rel="stylesheet" />
<script src="assets/icons.js"></script>
<style>
  /* tokens from monad/app/src/app/globals.css (dark) */
  :root {
    --canvas: #0a0a0a; --surface: #111111; --raised: #1a1a1a; --deep: #0d0d0d;
    --line: #262626; --line-soft: #1e1e1e; --line-hair: #171717;
    --green: #22c55e; --green-ink: #4ade80; --green-deep: #052e16; --green-mid: #14532d; --on-green: #04180c; --green-glow: rgba(34,197,94,0.14); --green-tint: #0c1710;
    --red: #ef4444; --red-ink: #f87171; --red-deep: #3b0a0a; --red-mid: #450a0a;
    --amber: #f59e0b; --amber-ink: #fbbf24; --amber-deep: #2a1605;
    --blue: #60a5fa; --blue-deep: #12263f;
    --ink: #f9fafb; --ink-2: #9ca3af; --ink-3: #6b7280; --ink-4: #4b5563;
    --sans: "Barlow", system-ui, sans-serif; --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }
  #frame { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--canvas); font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  body.v #frame { width: 1080px; height: 1920px; }
  #glow { position: absolute; inset: 0; z-index: 0; }
  #grid { position: absolute; inset: 0; z-index: 0; background-image: radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1.2px); background-size: 28px 28px; }
  #vig { position: absolute; inset: 0; z-index: 30; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%); }
  .layer { position: absolute; inset: 0; z-index: 4; }
  .abs { position: absolute; }
  .i { display: inline-block; flex: none; }
  .big { font-family: var(--cond); font-weight: 800; text-transform: uppercase; line-height: 0.92; letter-spacing: -1px; white-space: nowrap; }
  .green { color: var(--green); }
  .redt { color: var(--red-ink); }
  .lead { font-weight: 600; color: var(--ink-2); }
  .ctr { position: absolute; left: 0; right: 0; text-align: center; }
  .m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.06em 0.05em 0.1em; margin: -0.06em -0.05em -0.1em; }
  .w { display: inline-block; }
  .kicker { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 18px; border-radius: 999px; background: var(--red-deep); border: 1.5px solid #6b1d1d; color: var(--red-ink); font-weight: 800; font-size: 19px; letter-spacing: 1.6px; text-transform: uppercase; }
  .kicker .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); box-shadow: 0 0 12px var(--red); }
  .chip-cl { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 18px 0 8px; border-radius: 999px; background: var(--blue-deep); color: var(--blue); font-weight: 700; font-size: 20px; }
  .chip-cl img { width: 32px; height: 32px; border-radius: 50%; background: #fff; }
  .pillurl { display: inline-flex; align-items: center; height: 72px; border-radius: 36px; border: 1.5px solid var(--green-mid); background: #0b1a10; color: var(--green-ink); padding: 0 34px; font-weight: 700; font-size: 34px; }
  .brandrow { display: inline-flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 600; color: var(--ink-2); }
  .brandrow img { height: 42px; border-radius: 10px; }
  .brandrow img.cl { border-radius: 50%; background: #fff; height: 38px; }
  .brandrow b { color: var(--ink); font-family: var(--cond); font-size: 32px; letter-spacing: 1px; }
  .ring { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 30%, #3a0d0d, var(--red-deep) 70%); border: 4px solid var(--red); color: #fff; box-shadow: 0 0 80px rgba(239,68,68,0.35), inset 0 0 40px rgba(0,0,0,0.5); }

  /* problem: five scoreboards, five tabs */
  .tabwin { position: absolute; width: 460px; border-radius: 18px; background: #121212; border: 1.5px solid #2a2a2a; box-shadow: 0 28px 60px rgba(0,0,0,0.65); overflow: hidden; }
  .tabwin .bar { height: 34px; background: #1b1b1b; display: flex; align-items: center; gap: 7px; padding: 0 14px; }
  .tabwin .bar i { width: 10px; height: 10px; border-radius: 50%; background: #3a3a3a; display: block; }
  .tabwin .bar span { margin-left: 8px; font-size: 14px; color: var(--ink-3); font-weight: 600; }
  .tabwin .sb { display: flex; align-items: center; justify-content: space-between; padding: 22px 30px 22px 26px; font-family: var(--cond); font-weight: 800; font-size: 36px; }
  .tabwin .sb img { width: 40px; height: 40px; object-fit: contain; }
  .tabwin .sb .tm { display: flex; align-items: center; gap: 10px; }
  .tabwin .sb .sc { font-size: 42px; }
  .tabwin .mn { position: absolute; right: 60px; top: 6px; font-size: 13px; font-weight: 800; color: #fff; background: var(--red); border-radius: 6px; padding: 2px 7px; }
  .qmark { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--amber-deep); border: 2px solid var(--amber); color: var(--amber-ink); font-family: var(--cond); font-weight: 800; font-size: 42px; display: grid; place-items: center; }

  /* phone */
  #phonewrap { position: absolute; left: 240px; top: 92px; width: 440px; height: 900px; z-index: 5; transform-origin: 0 0; }

  #screen { position: absolute; inset: 12px; border-radius: 52px; overflow: hidden; background: var(--canvas); }
  #island { position: absolute; left: 50%; top: 12px; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; z-index: 9; }
  #status { position: absolute; left: 0; right: 0; top: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 6px 36px 0; font-weight: 700; font-size: 17px; z-index: 8; }
  #view { position: absolute; inset: 0; }
  .hdr { position: absolute; left: 0; right: 0; top: 56px; height: 62px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--line-hair); z-index: 3; background: var(--canvas); }
  .hdr .logo { display: flex; align-items: center; gap: 9px; font-family: var(--cond); font-weight: 800; font-size: 22px; letter-spacing: 1px; flex: 1; }
  .hdr .logo img { width: 30px; height: 30px; border-radius: 8px; }
  .hdr-title { font-family: var(--cond); font-size: 24px; font-weight: 700; text-transform: uppercase; line-height: 1.05; }
  .hdr-sub { font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
  .balpill { display: flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 999px; background: var(--green-deep); border: 1px solid var(--green-mid); color: var(--green-ink); font-weight: 700; font-size: 14.5px; margin-left: auto; }
  .body { position: absolute; left: 0; right: 0; top: 118px; bottom: 84px; overflow: hidden; }

  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink-4); padding-top: 8px; }
  .tab .pill { width: 46px; height: 28px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
  .tab .tl { font-size: 11px; font-weight: 600; }
  .tab.on { color: var(--green); }
  .tab.on .pill { background: var(--green-glow); }
  .tab-create .pill { width: 48px; height: 48px; border-radius: 50%; background: var(--green); color: var(--on-green); margin-top: -18px; box-shadow: 0 8px 20px rgba(34,197,94,0.28); }

  .card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 18px; padding: 14px; }
  .card + .card { margin-top: 10px; }
  .uname { font-weight: 700; font-size: 15.5px; }
  .umeta { font-size: 12.5px; color: var(--ink-3); font-weight: 500; margin-top: 2px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.3px; white-space: nowrap; line-height: 1.3; }
  .b-live { background: var(--red); color: #fff; }
  .b-open { background: var(--green-deep); color: var(--green-ink); }
  .b-flash { background: var(--amber-deep); color: var(--amber-ink); }
  .b-settled { background: var(--raised); color: var(--ink-3); border: 1px solid var(--line); }
  .b-won { background: var(--green-deep); color: var(--green-ink); }
  .b-lost { background: var(--red-mid); color: var(--red-ink); }
  .b-chainlink { background: var(--blue-deep); color: var(--blue); }
  .livedot { width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  .sec-hd { display: flex; align-items: center; gap: 8px; margin: 16px 0 10px; }
  .sec-hd h3 { font-family: var(--cond); font-size: 18px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; }
  .sec-hd .more { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
  .crest { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: #161616; overflow: hidden; flex: none; }
  .crest img { width: 78%; height: 78%; object-fit: contain; }
  .amt-won { color: var(--green); }
  .amt-lost { color: var(--red-ink); }
  .cta { height: 46px; border-radius: 12px; background: var(--green); color: var(--on-green); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 15.5px; }

  /* gameday.css */
  .gd-hero { border-color: var(--green-mid); background: linear-gradient(180deg, var(--green-tint), var(--surface) 80%); }
  .gd-hero-row { display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; }
  .gd-k { font-size: 11.5px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--ink-3); }
  .gd-v { font-family: var(--cond); font-size: 36px; font-weight: 700; line-height: 1.05; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .gd-collect { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-soft); display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--green-ink); font-size: 13.5px; }
  .gd-match { padding-bottom: 6px; }
  .gd-match.gd-live { border-color: var(--red-mid); }
  .gd-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); font-weight: 600; }
  .gd-score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin: 10px 0 4px; }
  .gd-score .t { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 700; font-size: 15.5px; }
  .gd-score .t.away { justify-content: flex-end; text-align: right; }
  .gd-score .sc { font-family: var(--cond); font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
  .gd-positions { margin: 4px -14px 0; }
  .gd-pos { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line-hair); box-shadow: inset 3px 0 0 transparent; }
  .gd-pos.win { box-shadow: inset 4px 0 0 var(--green); }
  .gd-pos.lose { box-shadow: inset 4px 0 0 var(--red); }
  .gd-pos-side { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .gd-amt { font-family: var(--cond); font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .gd-pos-cta { grid-column: 1 / -1; margin-top: 6px; }
  .gd-foot { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0 5px; margin-top: 2px; border-top: 1px solid var(--line-soft); font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .flip { animation: none; }
  .gd-strip { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 18px; border: 1px solid var(--red-mid); background: var(--surface); }
  .mk-odds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .mk-odds div { height: 46px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid; }
  .mk-odds .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
  .mk-odds .val { font-family: var(--cond); font-size: 19px; font-weight: 700; }
  .o-yes { background: #0c1f14; border-color: #17422a !important; color: var(--green-ink); }
  .o-no { background: #1d0d0d; border-color: #452020 !important; color: var(--red-ink); }
  .o-3 { grid-template-columns: repeat(3, 1fr); }
  .o-n { background: var(--raised); border-color: var(--line) !important; color: var(--ink); }
  .o-n .lbl { color: var(--ink-3); }
  .toast { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 11px 18px; border-radius: 999px; background: #0c1f14; border: 1px solid #1f6b3a; color: var(--green-ink); font-weight: 700; font-size: 15px; white-space: nowrap; box-shadow: 0 12px 30px rgba(0,0,0,0.6); z-index: 6; }
  .toast b { font-family: var(--cond); font-size: 21px; font-weight: 800; }
  /* a goal: a banner across the scoring match's header row, the score below stays in view */
  .gd-match { position: relative; }
  .gd-goal { position: absolute; left: -1px; right: -1px; top: -1px; height: 46px; border-radius: 18px 18px 0 0; background: linear-gradient(90deg, #991b1b, #ef4444 50%, #991b1b); color: #fff; display: flex; align-items: center; justify-content: center; gap: 9px; font-family: var(--cond); font-weight: 800; font-size: 23px; letter-spacing: 1.6px; white-space: nowrap; z-index: 2; box-shadow: 0 0 26px rgba(239,68,68,0.55); }
  .coinpop { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4ade80, #15803d 70%); border: 3px solid #bbf7d0; color: #04180c; display: grid; place-items: center; font-family: var(--cond); font-weight: 800; font-size: 36px; z-index: 8; box-shadow: 0 0 40px rgba(34,197,94,0.6); }

  /* tap */
  #tap { position: absolute; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; background: rgba(255,255,255,0.9); box-shadow: 0 6px 18px rgba(0,0,0,0.5); z-index: 25; opacity: 0; }
  #ripple { position: absolute; border-radius: 50%; border: 3px solid rgba(255,255,255,0.75); z-index: 25; opacity: 0; }

  /* captions beside the phone */
  #cap { position: absolute; left: 790px; top: 290px; width: 1040px; z-index: 6; }
  body.v #cap { left: 64px; top: 210px; width: 952px; }
  .ctitle { font-family: var(--cond); font-weight: 800; font-size: 104px; line-height: 0.95; text-transform: uppercase; margin-top: 22px; white-space: nowrap; }
  body.v .ctitle { font-size: 84px; margin-top: 16px; }
  .csub { font-size: 40px; font-weight: 700; color: var(--ink); margin-top: 26px; display: flex; align-items: center; gap: 16px; height: 50px; white-space: nowrap; }
  body.v .csub { font-size: 34px; margin-top: 18px; }
  .csub .n { width: 46px; height: 46px; border-radius: 50%; background: var(--green-deep); border: 1.5px solid var(--green); color: var(--green-ink); font-family: var(--cond); font-size: 26px; display: grid; place-items: center; flex: none; }
  .cextra { margin-top: 22px; height: 46px; }
  body.v .cextra { margin-top: 14px; }
  .steps { margin-top: 36px; display: flex; gap: 12px; }
  body.v .steps { margin-top: 20px; }
  .steps i { width: 56px; height: 6px; border-radius: 3px; background: #262626; display: block; }
  .steps i.on { background: var(--green); }
</style>

<body>
<div id="frame">
  <div id="glow"></div>
  <div id="grid"></div>
  <div id="stage" class="layer"></div>
  <div id="phonewrap"><div id="phone"><div id="screen"><div id="island"></div><div id="status"><span>9:41</span><span>●●● ▮</span></div><div id="view"></div></div></div></div>
  <div id="cap"></div>
  <div id="fx" style="position:absolute;inset:0;z-index:24;pointer-events:none"></div>
  <div id="tap"></div><div id="ripple"></div>
  <div id="vig"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const VERT = new URLSearchParams(location.search).get("f") === "9x16";
if (VERT) document.body.classList.add("v");
const W = VERT ? 1080 : 1920, H = VERT ? 1920 : 1080;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => cl((t - a) / d);           // a start and a duration
const span = (t, [a, b]) => prog(t, a, b - a);       // a start and an end
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const spring = (x) => (x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(9 * x));
const lerp = (a, b, x) => a + (b - a) * x;
function life(t, a, b, { d = 0.5, dy = 26, out = 0.35 } = {}) {
  const i = spring(prog(t, a, d)), o = eo(prog(t, b - out, out));
  return { o: cl(prog(t, a, d * 0.6)) * (1 - o), y: (1 - i) * dy - o * 14, s: lerp(0.96, 1, i) };
}
const st = ({ o, y = 0, s = 1 }) => `opacity:${o.toFixed(3)};transform:translateY(${y.toFixed(1)}px) scale(${s.toFixed(4)})`;
const icon = (n, s = 24, sw = 1.75) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const usd = (n) => `$${Math.abs(n).toFixed(2)}`;
const signed = (n) => `${n >= 0 ? "+" : "−"}${usd(n)}`;

/** Words rise out of a mask one after another, and drop away together at `b`. *word* is green. */
function words(t, a, b, html, { stag = 0.07, d = 0.55 } = {}) {
  return html.split(/(<br\/>)/).map((chunk) => chunk === "<br/>" ? "<br/>" : chunk.split(" ").filter(Boolean).map((w, i) => {
    const p = spring(prog(t, a + i * stag, d)), o = eo(prog(t, b - 0.3, 0.3));
    const hot = /^\*.*\*$/.test(w), txt = hot ? `<span class="green">${w.slice(1, -1)}</span>` : w;
    return `<span class="m"><span class="w" style="transform:translateY(${((1 - p) * 110 + o * -110).toFixed(1)}%)">${txt}</span></span>`;
  }).join(" ")).join("");
}

/* ---------------- timeline (45 s) ---------------- */
const T = {
  cover: [0, 3.8],
  problem: [3.8, 8.6],
  phone: [8.6, 38.4],
  goalA: 13.8,            // Arsenal 1-0, 63'
  goalB: 19.6,            // Salah, 41'
  goalC: 22.2,            // City level, 44'
  ht: 24.0,               // Liverpool v City at half time
  ftA: 25.4,              // Arsenal v Spurs full time
  tapCollect: 27.3,
  scroll: [29.4, 30.6],
  tapHome: 33.9, home: 34.2,
  end: 38.4, dur: 45,
};
const CAPS = [
  [T.phone[0] + 0.4, "All your bets, one screen"],
  [T.goalA - 0.6, "The score moves, your bets move"],
  [T.goalB - 0.8, "Your takes read live too"],
  [T.ftA - 0.2, "Full time? Collect in a tap"],
  [T.scroll[0], "More on the games you follow"],
  [T.tapHome - 0.2, "Always one tap from Home"],
];

/* ---------------- the fan's positions, as the app reads them ---------------- */
const RET = 19.7; // what a $10 pool bet pays back at these prices
const CREST = (id) => `<span class="crest"><img src="assets/crest-${id}.png" /></span>`;
/** standing at time t: "lose" | "win" | "live" | "up" | "won" | "lost" */
function positions(t) {
  const ft = t >= T.ftA, collected = t >= T.tapCollect + 0.15;
  return {
    A: [
      { title: "Arsenal win", pick: "Yes", stake: 10, ret: RET, s: ft ? "won" : t >= T.goalA ? "win" : "lose", collect: ft && t < T.tapCollect + 1.4, collected },
      { title: "Over 2.5 goals in Arsenal v Spurs", pick: "Yes", stake: 10, ret: RET, s: ft ? "lost" : "lose" },
      { title: "Spurs win", pick: "No · 1v1", stake: 5, ret: 10, s: ft ? "won" : "win" },
    ],
    B: [
      { title: "Salah scores before half-time", pick: "Yes", stake: 10, ret: RET, s: t >= T.goalB ? "win" : "lose", take: true },
      { title: "Both teams score in Liverpool v Man City", pick: "Yes", stake: 10, ret: RET, s: t >= T.goalC ? "win" : "lose" },
    ],
    C: [{ title: "Chelsea win", pick: "Yes", stake: 10, ret: RET, s: "up" }],
  };
}
const net = (ps) => ps.reduce((s, p) => s + (p.s === "win" || p.s === "won" ? p.ret - p.stake : p.s === "lose" || p.s === "lost" ? -p.stake : 0), 0);
const riding = (ps) => ps.filter((p) => !["won", "lost"].includes(p.s)).reduce((s, p) => s + p.stake, 0);

function minuteA(t) {
  if (t >= T.ftA) return "FT";
  return `${Math.floor(t < T.goalA ? lerp(58, 63, span(t, [T.phone[0], T.goalA])) : lerp(63, 90, span(t, [T.goalA, T.ftA - 0.4])))}'`;
}
function minuteB(t) {
  if (t >= T.ht) return "HT";
  return `${Math.floor(t < T.goalB ? lerp(35, 41, span(t, [T.phone[0], T.goalB])) : lerp(41, 45, span(t, [T.goalB, T.ht - 0.2])))}'`;
}

/* ---------------- scenes ---------------- */
function cover(t) {
  if (t >= T.cover[1]) return "";
  const out = eo(prog(t, T.cover[1] - 0.5, 0.5));
  const s = (k) => `opacity:${1 - out};transform:translateY(${-out * 30 * k}px)`;
  const cy = VERT ? 560 : 150;
  const R = VERT ? 105 : 82;
  return `<div class="ctr" style="top:${cy}px;${s(1)}">
      <span style="display:inline-flex;align-items:center;gap:16px;font-family:var(--cond);font-weight:800;font-size:${VERT ? 44 : 40}px;letter-spacing:2px"><img src="assets/terrace.png" style="width:${VERT ? 64 : 56}px;height:${VERT ? 64 : 56}px;border-radius:14px" />TERRACE</span>
    </div>
    <div class="ring" style="left:${W / 2 - R}px;top:${cy + (VERT ? 110 : 92)}px;width:${2 * R}px;height:${2 * R}px;${s(1.4)};box-shadow:0 0 ${80 + 24 * Math.sin(t * 4)}px rgba(239,68,68,0.45)">${icon("whistle", VERT ? 96 : 84, 1.9)}</div>
    <div class="ctr" style="top:${cy + (VERT ? 340 : 296)}px;${s(1.8)}">
      <div><span class="kicker" style="height:50px"><span class="dot" style="opacity:${0.55 + 0.45 * Math.sin(t * 6)}"></span>Live</span></div>
      <span class="big" style="display:block;font-size:${VERT ? 190 : 200}px;margin-top:26px">Game <span class="green">day</span></span>
      <span class="lead" style="display:block;font-size:${VERT ? 40 : 42}px;margin-top:26px;color:var(--ink)">${VERT ? "Every bet you've got on,<br/>beside the live score." : "Every bet you've got on, beside the live score."}</span>
      <div style="margin-top:${VERT ? 54 : 40}px"><span class="brandrow">On <img src="assets/monad.png" /><b>MONAD</b> &nbsp;· settled by <img class="cl" src="assets/chainlink.png" /><b>CHAINLINK</b></span></div>
    </div>`;
}

const TABS = [
  ["42", "ARS", "47", "TOT", "0–0", "58'"],
  ["40", "LIV", "50", "MCI", "0–0", "35'"],
  ["49", "CHE", "34", "NEW", "v", "20:00"],
  [null, "RMA", null, "BAR", "2–1", "71'"],
  [null, "BAY", null, "BVB", "1–1", "HT"],
];
function problem(t) {
  const [a, b] = T.problem;
  if (t < a || t >= b) return "";
  const fade = 1 - eo(prog(t, b - 0.4, 0.4));
  const spots = VERT
    ? [[50, 270, -6], [570, 240, 5], [300, 480, -2], [60, 1330, 4], [560, 1360, -4]]
    : [[110, 120, -6], [1350, 110, 5], [730, 70, 2], [140, 780, 4], [1320, 790, -5]];
  const wins = TABS.map(([h, hn, aw, an, sc, mn], i) => {
    const at = a + 0.1 + i * 0.22, p = spring(prog(t, at, 0.5));
    const [x, y, r] = spots[i];
    const jitter = Math.sin(t * 7 + i) * 3 * prog(t, a + 2.2, 0.5);
    const crest = (id, n) => id ? `<img src="assets/crest-${id}.png" />${n}` : n;
    return `<div class="tabwin" style="left:${x}px;top:${y + jitter}px;opacity:${cl(prog(t, at, 0.2))};transform:scale(${lerp(0.6, 1, p)}) rotate(${r + (1 - p) * 8}deg)">
      <div class="bar"><i></i><i></i><i></i><span>Tab ${i + 1}</span></div>
      ${mn.includes("'") || mn === "HT" ? `<span class="mn">${mn}</span>` : ""}
      <div class="sb"><span class="tm">${crest(h, hn)}</span><span class="sc">${sc}</span><span class="tm">${crest(aw, an)}</span></div>
      <div class="qmark" style="left:428px;top:17px;width:52px;height:52px;margin:-26px 0 0 -26px;font-size:34px;opacity:${cl(prog(t, a + 2.0 + i * 0.12, 0.2))};transform:scale(${spring(prog(t, a + 2.0 + i * 0.12, 0.4))})">?</div></div>`;
  }).join("");
  const ty = VERT ? 790 : 400;
  return `<div style="opacity:${fade}">${wins}
    <div class="ctr" style="top:${ty}px">
      <span class="big" style="display:block;font-size:${VERT ? 120 : 128}px">${words(t, a + 0.6, b, VERT ? "Five games.<br/>Five tabs." : "Five games. Five tabs.")}</span>
      <span class="big" style="display:block;font-size:${VERT ? 84 : 84}px;margin-top:22px">${words(t, a + 2.1, b, VERT ? "Which bets are<br/>you *winning?*" : "Which bets are you *winning?*")}</span>
    </div></div>`;
}

/* ---------------- phone: the Game day screen ---------------- */
const tabs = (on) => `<div class="tabbar">${[["home", "Home"], ["pitch", "Markets"], ["plus", "Create"], ["users", "Social"], ["shield", "Profile"]].map(([ic, l]) =>
  `<div class="tab${l === "Create" ? " tab-create" : ""}${l === on ? " on" : ""}" id="tab-${l}"><span class="pill">${icon(ic, 22)}</span><span class="tl">${l}</span></div>`).join("")}</div>`;

const BADGE = { lose: ["b-lost", "Losing"], win: ["b-won", "Winning"], live: ["b-live", "In play"], up: ["b-open", "Not started"], won: ["b-won", "Won"], lost: ["b-lost", "Lost"] };
function posLine(p, t, flipAt) {
  const [cls, label] = BADGE[p.s];
  const amt = p.s === "win" || p.s === "won" ? `+${usd(p.ret - p.stake)}` : p.s === "lose" || p.s === "lost" ? `−${usd(p.stake)}` : `pays ${usd(p.ret)}`;
  const tone = p.s === "win" || p.s === "won" ? " amt-won" : p.s === "lose" || p.s === "lost" ? " amt-lost" : "";
  const bar = p.s === "win" || p.s === "won" ? " win" : p.s === "lose" || p.s === "lost" ? " lose" : "";
  // a flash of green across the row when it flips
  const k = flipAt ? prog(t, flipAt, 0.9) : 1;
  const flash = k > 0 && k < 1 ? `background:rgba(34,197,94,${(0.28 * (1 - k)).toFixed(3)});` : "";
  const pop = k > 0 && k < 1 ? `transform:scale(${(1 + 0.14 * Math.sin(Math.min(1, k * 2.2) * Math.PI)).toFixed(3)})` : "";
  return `<div class="gd-pos${bar}" style="${flash}">
    <div style="min-width:0"><div class="uname">${p.title}</div><div class="umeta">${p.pick} · ${usd(p.stake)}${p.take ? ` · <span class="badge b-chainlink" style="padding:1px 6px;font-size:10px"><img src="assets/chainlink.png" style="width:11px;height:11px;border-radius:50%;background:#fff" />read live</span>` : ""}</div></div>
    <div class="gd-pos-side"><span class="badge ${cls}" style="${pop}">${p.s === "live" ? '<i class="livedot"></i>' : ""}${label}</span><div class="gd-amt${tone}">${amt}</div></div>
    ${p.collect ? `<div class="cta gd-pos-cta" id="collect" style="${p.collected ? "background:var(--raised);color:var(--green-ink);border:1px solid var(--green-mid)" : ""}">${p.collected ? `${icon("check", 18, 2.4)} Collected` : `Collect ${usd(p.ret)}`}</div>` : ""}
  </div>`;
}

function board({ phase, clock, league, home, away, score, ps, t, flips = [], goals = [] }) {
  const n = net(ps), rid = riding(ps);
  const read = phase !== "up";
  // the banner sweeps in over the header, holds, then lifts away; the new score pops underneath
  let banner = "", pop = 1;
  for (const [at, txt] of goals) {
    const k = prog(t, at, 1.6);
    if (k <= 0 || k >= 1) continue;
    const i = eo(prog(t, at, 0.25)), o = eo(prog(t, at + 1.25, 0.35));
    banner = `<div class="gd-goal" style="opacity:${(cl(prog(t, at, 0.12)) * (1 - o)).toFixed(3)};clip-path:inset(0 ${((1 - i) * 50).toFixed(1)}% 0 ${((1 - i) * 50).toFixed(1)}%)">${icon("ball", 20, 2)}${txt}</div>`;
    pop = 1 + 0.22 * Math.sin(Math.min(1, prog(t, at, 0.6)) * Math.PI);
  }
  return `<div class="card gd-match${phase === "live" ? " gd-live" : ""}">
    ${banner}<div class="gd-head">${phase === "live" ? `<span class="badge b-live"><i class="livedot"></i>${clock}</span>` : `<span class="badge ${phase === "ft" ? "b-settled" : "b-open"}">${clock}</span>`}${league}<span style="margin-left:auto;color:var(--ink-4)">${icon("chevronRight", 16)}</span></div>
    <div class="gd-score"><span class="t">${CREST(home[0])}${home[1]}</span><span class="sc" style="display:inline-block;transform:scale(${pop.toFixed(3)});${pop > 1.01 ? "color:var(--green-ink)" : ""}">${score}</span><span class="t away">${away[1]}${CREST(away[0])}</span></div>
    <div class="gd-positions">${ps.map((p, i) => posLine(p, t, flips[i])).join("")}</div>
    <div class="gd-foot">${rid ? `<span>${usd(rid)} riding</span>` : "<span></span>"}${read ? `<span class="${n >= 0 ? "amt-won" : "amt-lost"}">${phase === "live" ? "If it ends now" : "As it finished"} ${signed(n)}</span>` : ""}</div>
  </div>`;
}

function hero(t, P) {
  const all = [...P.A, ...P.B, ...P.C];
  const rid = riding(all);
  const games = [P.A, P.B, P.C].filter((g) => riding(g) > 0).length;
  const n = net(P.A) + net(P.B);
  const w = all.filter((p) => p.s === "win").length, l = all.filter((p) => p.s === "lose").length;
  const coll = P.A.filter((p) => p.collect && !p.collected).reduce((s, p) => s + p.ret, 0);
  return `<div class="card gd-hero"><div class="gd-hero-row">
      <div><div class="gd-k">On the line</div><div class="gd-v">${usd(rid)}</div><div class="umeta">${games} games</div></div>
      <div style="text-align:right"><div class="gd-k">If it all ends now</div><div class="gd-v ${n >= 0 ? "amt-won" : "amt-lost"}">${signed(n)}</div><div class="umeta">${w} winning · ${l} losing</div></div>
    </div>${coll ? `<div class="gd-collect">${icon("dollar", 16)} ${usd(coll)} ready to collect below</div>` : ""}</div>`;
}

function gameDayScreen(t) {
  const P = positions(t);
  const ft = t >= T.ftA;
  const A = board({ phase: ft ? "ft" : "live", clock: minuteA(t), league: "Premier League", home: ["42", "Arsenal"], away: ["47", "Spurs"], score: t >= T.goalA ? "1–0" : "0–0", ps: P.A, t, flips: [T.goalA, null, null], goals: [[T.goalA, "GOAL · ARSENAL 63'"]] });
  const B = board({ phase: "live", clock: minuteB(t), league: "Premier League", home: ["40", "Liverpool"], away: ["50", "Man City"], score: t >= T.goalC ? "1–1" : t >= T.goalB ? "1–0" : "0–0", ps: P.B, t, flips: [T.goalB, T.goalC], goals: [[T.goalB, "GOAL · SALAH 41'"], [T.goalC, "GOAL · MAN CITY 44'"]] });
  const C = board({ phase: "up", clock: "Today 20:00", league: "Premier League", home: ["49", "Chelsea"], away: ["34", "Newcastle"], score: "v", ps: P.C, t });
  const live = ft ? [B] : [A, B];
  let h = hero(t, P);
  h += `<div class="sec-hd"><h3 style="color:var(--red-ink)">In play</h3><span class="badge b-live">${live.length} ${live.length === 1 ? "game" : "games"}</span></div>` + live.join("");
  if (ft) h += `<div class="sec-hd"><h3>Full time</h3></div>` + A;
  h += `<div class="sec-hd"><h3>Coming up</h3></div>` + C;
  h += `<div class="sec-hd"><h3>More on your games</h3><span class="more">Markets ›</span></div>
    <div class="card"><div class="gd-head"><span class="badge b-flash">${icon("bolt", 11, 2.2)}Flash</span>Arsenal v Spurs</div>
      <div class="uname" style="font-size:17px;margin-top:8px">Saka scores before full time</div>
      <div class="mk-odds"><div class="o-yes"><span class="lbl">Yes</span><span class="val">6/4</span></div><div class="o-no"><span class="lbl">No</span><span class="val">1/2</span></div></div></div>
    <div class="card"><div class="gd-head">Liverpool v Man City</div>
      <div class="uname" style="font-size:17px;margin-top:8px">Haaland scores in the second half</div>
      <div class="mk-odds"><div class="o-yes"><span class="lbl">Yes</span><span class="val">11/10</span></div><div class="o-no"><span class="lbl">No</span><span class="val">8/11</span></div></div></div>
    <div class="sec-hd"><h3>Your teams play next</h3></div>
    <div class="card"><div class="gd-head"><span class="badge b-open">Sat 15:00</span>Premier League</div>
      <div class="gd-score"><span class="t">${CREST("42")}Arsenal</span><span class="sc" style="color:var(--ink-3);font-size:22px">v</span><span class="t away">Man City${CREST("50")}</span></div>
      <div class="mk-odds o-3"><div class="o-n"><span class="lbl">Home</span><span class="val">13/10</span></div><div class="o-n"><span class="lbl">Draw</span><span class="val">12/5</span></div><div class="o-n"><span class="lbl">Away</span><span class="val">2/1</span></div></div></div>`;
  const sy = -eio(span(t, T.scroll)) * 640;
  let out = `<div class="hdr"><div style="flex:1;min-width:0"><div class="hdr-title">Game day</div><div class="hdr-sub">Everything you've got on, as it happens</div></div><span class="balpill">$84.30</span></div>
    <div class="body"><div class="scroll" style="transform:translateY(${sy.toFixed(1)}px)">${h}</div></div>${tabs("Profile")}`;
  const tp = prog(t, T.tapCollect + 0.2, 0.35) * (1 - prog(t, T.tapCollect + 2.4, 0.3));
  if (tp > 0) out += `<div class="toast" style="opacity:${tp};transform:translate(-50%,${(1 - eo(prog(t, T.tapCollect + 0.2, 0.35))) * 14}px)">${icon("check", 18, 2.4)} <b>${usd(RET)}</b> collected</div>`;
  return out;
}

function homeScreen(t) {
  const P = positions(t);
  const n = net(P.B);
  const w = P.B.filter((p) => p.s === "win").length, l = P.B.filter((p) => p.s === "lose").length;
  const ps = spring(prog(t, T.home + 0.35, 0.6));
  return `<div class="hdr"><div class="logo"><img src="assets/terrace.png" />TERRACE</div><span class="balpill">$104.00</span></div>
    <div class="body"><div class="scroll">
      <div class="gd-strip" id="strip" style="opacity:${cl(prog(t, T.home + 0.35, 0.25))};transform:translateY(${(1 - ps) * -20}px) scale(${lerp(0.94, 1, ps)});box-shadow:0 0 ${20 + 14 * Math.sin(t * 5)}px rgba(239,68,68,0.25)">
        <span class="badge b-live"><i class="livedot"></i>LIVE</span>
        <span style="flex:1;min-width:0"><span class="uname" style="display:block">Game day · you're on 2 games</span><span class="umeta">${w} winning · ${l} losing · ${signed(n)} if it ends now</span></span>
        <span style="color:var(--ink-4)">${icon("chevronRight", 16)}</span></div>
      <div class="card" style="margin-top:12px;border-color:#1f3a2a;background:linear-gradient(180deg,#0d1a12,#0f0f0f)"><div class="gd-k" style="color:var(--green-ink)">Your club</div><div class="uname" style="font-size:18px;margin-top:6px">Arsenal v Man City · Sat 15:00</div><div class="umeta">Back them before kick-off</div></div>
      <div class="sec-hd"><h3 style="color:var(--red-ink)">In-play now</h3><span class="badge b-live">1 match</span></div>
      <div class="card gd-live" style="border-color:var(--red-mid)"><div class="gd-head"><span class="badge b-live"><i class="livedot"></i>HT</span>Premier League</div>
        <div class="gd-score"><span class="t">${CREST("40")}Liverpool</span><span class="sc">1–1</span><span class="t away">Man City${CREST("50")}</span></div></div>
    </div></div>${tabs("Home")}`;
}

function phoneView(t) {
  if (t < T.home) return [gameDayScreen(t), T.phone[0]];
  return [homeScreen(t), T.home];
}

/** Collect: coins burst out of the button. */
function coins(t) {
  const kc = prog(t, T.tapCollect + 0.1, 1.1), el = $("collect");
  if (kc <= 0 || kc >= 1 || !el) return void ($("fx").innerHTML = "");
  const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  $("fx").innerHTML = [0, 1, 2, 3, 4, 5, 6].map((i) => {
    const ang = -Math.PI / 2 + (i - 3) * 0.38, d = eo(kc) * (150 + (i % 3) * 30);
    return `<div class="coinpop" style="left:${x + Math.cos(ang) * d}px;top:${y + Math.sin(ang) * d - 60 * kc}px;opacity:${1 - eo(kc)};transform:scale(${lerp(0.4, 1, spring(kc))})">$</div>`;
  }).join("");
}

const TAPS = [[T.tapCollect, "collect"], [T.tapHome, "tab-Home"]];
function tap(t) {
  const dot = $("tap"), rip = $("ripple");
  dot.style.opacity = 0; rip.style.opacity = 0;
  for (const [at, id] of TAPS) {
    if (t < at - 0.45 || t > at + 0.5) continue;
    const el = $(id);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2, k = t - at;
    const o = k < -0.3 ? prog(t, at - 0.45, 0.15) : k > 0.3 ? 1 - prog(t, at + 0.3, 0.2) : 1;
    dot.style.cssText = `left:${x}px;top:${y + (k < -0.1 ? (1 - eo(prog(t, at - 0.45, 0.35))) * 40 : 0)}px;opacity:${o};transform:scale(${k > -0.08 && k < 0.1 ? 0.8 : 1})`;
    if (k > 0) {
      const p = eo(prog(t, at, 0.45)), size = 30 + p * 70;
      rip.style.cssText = `left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;opacity:${(1 - p) * 0.9}`;
    }
  }
}

function captions(t) {
  const [a, b] = T.phone;
  if (t < a || t >= b) return "";
  const idx = CAPS.reduce((n, [at], i) => (t >= at ? i : n), -1);
  let h = `<div style="${st(life(t, a + 0.1, b))}"><span class="kicker"><span class="dot" style="opacity:${0.55 + 0.45 * Math.sin(t * 6)}"></span>Game day</span></div>
    <div class="ctitle">${words(t, a + 0.25, b, VERT ? "Watch it *as* *it* *happens.*" : "Watch it<br/>*as* *it* *happens.*")}</div>`;
  if (idx >= 0) {
    const [at, line] = CAPS[idx], next = CAPS[idx + 1] ? CAPS[idx + 1][0] : b;
    h += `<div class="csub" style="${st(life(t, at + 0.15, next, { dy: 30, out: 0.25 }))}"><span class="n">${idx + 1}</span>${line}</div>`;
    h += `<div class="cextra" style="${st(life(t, at + 0.5, next, { dy: 20, out: 0.25 }))}">${idx === 2 ? `<span class="chip-cl"><img src="assets/chainlink.png" />Same rules Chainlink settles with</span>` : ""}</div>`;
  }
  h += `<div class="steps" style="${st(life(t, a + 0.6, b))}">${CAPS.map((_, i) => `<i class="${i <= idx ? "on" : ""}"></i>`).join("")}</div>`;
  return h;
}

function endCard(t) {
  if (t < T.end) return "";
  const e = (k, dy = 30) => st(life(t, T.end + 0.25 + k * 0.3, 99, { d: 0.7, dy }));
  const top = VERT ? 560 : 150;
  return `<div class="ctr" style="top:${top}px;opacity:${1 - prog(t, T.dur - 0.6, 0.6)}">
    <div class="ring" style="position:relative;display:inline-flex;width:150px;height:150px;${e(0)}">${icon("whistle", 80, 1.9)}</div>
    <span class="big" style="display:block;font-size:${VERT ? 150 : 150}px;margin-top:40px;${e(1)}">Game <span class="green">day</span></span>
    <span class="lead" style="display:block;font-size:${VERT ? 42 : 44}px;margin-top:24px;color:var(--ink);${e(2, 16)}">Open Terrace on matchday.</span>
    <div style="margin-top:40px;${e(3, 16)}"><span class="pillurl">play.terrace.social</span></div>
    <div style="margin-top:38px;${e(4, 12)}"><span class="brandrow"><img src="assets/terrace.png" /><b>TERRACE</b> &nbsp;on <img src="assets/monad.png" /><b>MONAD</b></span></div>
    <div style="margin-top:22px;${e(5, 12)}"><span class="brandrow">Settled by <img class="cl" src="assets/chainlink.png" /><b>CHAINLINK</b></span></div>
  </div>`;
}

/* ---------------- seek ---------------- */
window.seek = (t) => {
  const red = 0.07 + 0.05 * Math.max(0, Math.sin(t * 0.9));
  $("glow").style.background = `radial-gradient(900px 760px at ${VERT ? 50 : lerp(44, 56, t / T.dur)}% ${VERT ? 38 : 44}%, rgba(239,68,68,${red.toFixed(3)}), transparent 70%), radial-gradient(800px 640px at 15% 85%, rgba(34,197,94,0.10), transparent 70%)`;
  $("stage").innerHTML = cover(t) + problem(t) + endCard(t);

  const inPhone = t >= T.phone[0] - 0.2 && t < T.end;
  const pw = $("phonewrap");
  pw.style.display = inPhone ? "" : "none";
  if (inPhone) {
    $("phone").style.cssText = st(life(t, T.phone[0], T.end, { d: 0.8, dy: 120, out: 0.5 }));
    const [html, since] = phoneView(t);
    $("view").innerHTML = html;
    const f = eo(prog(t, since, 0.3));
    $("view").style.cssText = since === T.phone[0] ? "" : `opacity:${f};transform:translateX(${(1 - f) * 24}px)`;
  }
  $("cap").innerHTML = captions(t);
  coins(t);
  tap(t);
};

const IMGS = ["assets/terrace.png", "assets/monad.png", "assets/chainlink.png", ...["42", "47", "50", "40", "49", "34"].map((id) => `assets/crest-${id}.png`)];
document.fonts.ready.then(() => Promise.all(IMGS.map((s) => { const i = new Image(); i.src = s; return i.decode().catch(() => {}); }))).then(() => {
  window.seek(Number(new URLSearchParams(location.search).get("t") || 0));
  window.ready = true;
});
</script>
