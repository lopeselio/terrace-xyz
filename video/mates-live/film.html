  <div id="cap"></div>

<script>
const $ = (id) => document.getElementById(id);
const VERT = new URLSearchParams(location.search).get("f") === "9x16";
if (VERT) document.body.classList.add("v");
const W = VERT ? 1080 : 1920, H = VERT ? 1920 : 1080;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => cl((t - a) / d);
const span = (t, [a, b]) => prog(t, a, b - a);
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const spring = (x) => (x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(9 * x));
const lerp = (a, b, x) => a + (b - a) * x;
function life(t, a, b, { d = 0.5, dy = 26, out = 0.35 } = {}) {
  const i = spring(prog(t, a, d)), o = eo(prog(t, b - out, out));
  return { o: cl(prog(t, a, d * 0.6)) * (1 - o), y: (1 - i) * dy - o * 14, s: lerp(0.96, 1, i) };
}
const st = ({ o, y = 0, s = 1 }) => `opacity:${o.toFixed(3)};transform:translateY(${y.toFixed(1)}px) scale(${s.toFixed(4)})`;
const icon = (n, s = 24, sw = 1.75) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const usd = (n) => `$${Math.abs(n).toFixed(2)}`;
const signed = (n) => `${n >= 0 ? "+" : "−"}${usd(n)}`;

/** Words rise out of a mask one after another, and drop away together at `b`. *word* is green, _word_ red. */
function words(t, a, b, html, { stag = 0.07, d = 0.55 } = {}) {
  return html.split(/(<br\/>)/).map((chunk) => chunk === "<br/>" ? "<br/>" : chunk.split(" ").filter(Boolean).map((w, i) => {
    const p = spring(prog(t, a + i * stag, d)), o = eo(prog(t, b - 0.3, 0.3));
    const txt = /^\*.*\*$/.test(w) ? `<span class="green">${w.slice(1, -1)}</span>` : /^_.*_$/.test(w) ? `<span class="redt">${w.slice(1, -1)}</span>` : w;
    return `<span class="m"><span class="w" style="transform:translateY(${((1 - p) * 110 + o * -110).toFixed(1)}%)">${txt}</span></span>`;
  }).join(" ")).join("");
}

/** Old text rolls up and out, new text rolls in from below, character by character (RollingNumber). */
function roll(prev, next, k) {
  if (k >= 1 || prev === next) return next;
  const n = Math.max(prev.length, next.length), a = prev.padStart(n, " "), b = next.padStart(n, " ");
  return [...b].map((c, i) => {
    if (c === a[i]) return c === " " ? "" : c;
    const ki = eio(cl(k * 1.25 - (n - 1 - i) * 0.06));
    return `<span class="roll"><span style="transform:translateY(${(-ki * 100).toFixed(1)}%)"><span style="display:block">${a[i] === " " ? "&nbsp;" : a[i]}</span><span style="display:block">${c === " " ? "&nbsp;" : c}</span></span></span>`;
  }).join("");
}

/* ---------------- your mate's afternoon (48 s; music m129 from 42.12 s, its drop lands on the goal at 22.0) ---------------- */
const T = {
  cover: [0, 4.0],
  story: [4.0, 40.0],
  tapMate: 15.3, toB: [15.45, 16.05],     // tap Cold Libero's row, their game day slides in
  goal: 22.0,                             // Arsenal 1-0, 79'
  scrollB: [25.2, 26.4], tapBack: 28.6,   // down to "Back the same games", back the same call
  tapHome: 31.2, toA: [31.35, 31.95],     // back to your own game day
  end: 40.0, dur: 48,
};
const BEATS = [
  [4.2, "You're *winning.*", "Man Utd 1–0 up. Bruno, 41'."],
  [8.0, "Your *mates,* in play.", "Everyone you follow with a bet on."],
  [12.0, "Cold Libero's _losing._", "Arsenal v Spurs, still 0–0."],
  [16.0, "Their game *day.*", "Their bets, as it stands."],
  [19.0, "Late on. Still _0–0._", ""],
  [22.0, "*Arsenal,* 79'!", "One goal flips it to winning."],
  [26.0, "Back the *same* *games.*", "Fancy a piece? Your stake, your call."],
  [32.0, "All of you, *winning.*", "The group chat's back on."],
];
// both 3pm kick-offs share one clock
const CLOCK = [[T.story[0], 70], [T.goal, 79], [T.end, 86]];
function clock(t) {
  let m = CLOCK[0][1];
  for (let i = 1; i < CLOCK.length; i++) if (t >= CLOCK[i - 1][0]) m = lerp(CLOCK[i - 1][1], CLOCK[i][1], span(t, [CLOCK[i - 1][0], CLOCK[i][0]]));
  return `${Math.floor(m)}'`;
}
function at(tl, t) {
  let i = 0;
  while (i + 1 < tl.length && t >= tl[i + 1][0]) i++;
  return { s: tl[i][1], prev: i ? tl[i - 1][1] : tl[i][1], since: tl[i][0] };
}

/* Cold Libero's two bets on Arsenal v Spurs; yours on Man Utd v Chelsea */
const POS = {
  ars: { title: "Arsenal win", pick: "Yes", stake: 10, gain: 11.0, tl: [[-1, "lose"], [T.goal, "win"]] },
  btts: { title: "Both teams score", pick: "No", stake: 10, gain: 6.5, tl: [[-1, "win"]] },
  utd: { title: "Man Utd win", pick: "Yes", stake: 10, gain: 9.7, tl: [[-1, "win"]] },
  bruno: { title: "Bruno Fernandes scores", pick: "Yes", stake: 10, gain: 12.5, take: true, tl: [[-1, "win"]] },
};
const gainOf = (p, s) => (s === "win" ? p.gain : -p.stake);
const net = (keys, t) => keys.reduce((n, k) => n + gainOf(POS[k], at(POS[k].tl, t).s), 0);
/** Libero's figure counts between values instead of jumping. */
const liberoNet = (t) => lerp(net(["ars", "btts"], T.goal - 0.01), net(["ars", "btts"], T.goal), eio(prog(t, T.goal, 1.0)));

/* ---------------- cover ---------------- */
function cover(t) {
  if (t >= T.cover[1]) return "";
  const out = eo(prog(t, T.cover[1] - 0.5, 0.5));
  const s = (k) => `opacity:${1 - out};transform:translateY(${-out * 30 * k}px)`;
  const cy = VERT ? 520 : 130;
  const av = (n, bg, i) => `<span class="avatar" style="width:${VERT ? 112 : 100}px;height:${VERT ? 112 : 100}px;font-size:${VERT ? 46 : 42}px;background:${bg};margin-left:${i ? -22 : 0}px;box-shadow:0 0 0 6px var(--canvas);transform:translateY(${(Math.sin(t * 2.4 + i * 1.3) * 5).toFixed(1)}px)">${n}</span>`;
  return `<div class="ctr" style="top:${cy}px;${s(1)}">
      <span style="display:inline-flex;align-items:center;gap:16px;font-family:var(--cond);font-weight:800;font-size:${VERT ? 44 : 40}px;letter-spacing:2px"><img src="assets/terrace.png" style="width:${VERT ? 64 : 56}px;height:${VERT ? 64 : 56}px;border-radius:14px" />TERRACE</span>
    </div>
    <div class="ctr" style="top:${cy + (VERT ? 110 : 96)}px;${s(1.4)}"><span style="display:inline-flex">${av("CL", "#1d4ed8", 0)}${av("FN", "#831843", 1)}${av("GR", "#a16207", 2)}</span></div>
    <div class="ctr" style="top:${cy + (VERT ? 270 : 240)}px;${s(1.8)}">
      <div><span class="kicker" style="height:50px"><span class="dot" style="opacity:${0.55 + 0.45 * Math.sin(t * 6)}"></span>Live</span></div>
      <span class="big" style="display:block;font-size:${VERT ? 150 : 180}px;margin-top:26px">${VERT ? `Your mates<br/><span class="green">in play</span>` : `Your mates <span class="green">in play</span>`}</span>
      <span class="lead" style="display:block;font-size:${VERT ? 40 : 42}px;margin-top:26px;color:var(--ink)">${VERT ? "The group chat's bets,<br/>beside the live score." : "The group chat's bets, beside the live score."}</span>
      <div style="margin-top:${VERT ? 54 : 40}px"><span class="brandrow">On <img src="assets/monad.png" /><b>MONAD</b> &nbsp;· settled by <img class="cl" src="assets/chainlink.png" /><b>CHAINLINK</b></span></div>
    </div>`;
}

/* ---------------- screens ---------------- */
const tabs = (on) => `<div class="tabbar">${[["home", "Home"], ["pitch", "Markets"], ["plus", "Create"], ["users", "Social"], ["shield", "Profile"]].map(([ic, l]) =>
  `<div class="tab${l === "Create" ? " tab-create" : ""}${l === on ? " on" : ""}"><span class="pill">${icon(ic, 22)}</span><span class="tl">${l}</span></div>`).join("")}</div>`;
const CREST = (id) => `<span class="crest"><img src="assets/crest-${id}.png" /></span>`;
const BADGE = { lose: ["b-lost", "Losing"], win: ["b-won", "Winning"] };
const COLOR = { lose: "var(--red)", win: "var(--green)" };
const AV = (mono, bg, size = 34) => `<span class="avatar" style="width:${size}px;height:${size}px;font-size:${(size * 0.42).toFixed(1)}px;background:${bg}">${mono}</span>`;
const liveBadge = (t, txt) => { const pulse = 0.5 + 0.5 * Math.sin(t * 6.2); return `<span class="badge b-live" style="box-shadow:0 0 ${(4 + 10 * pulse).toFixed(1)}px rgba(239,68,68,${(0.35 + 0.4 * pulse).toFixed(2)})"><i class="livedot" style="opacity:${(0.45 + 0.55 * pulse).toFixed(2)}"></i>${txt}</span>`; };

function posLine(key, t) {
  const p = POS[key], { s, prev, since } = at(p.tl, t);
  const k = prog(t, since, 0.9);
  const [cls, label] = BADGE[s];
  const amtOf = (x) => (x === "lose" ? `−${usd(p.stake)}` : `+${usd(p.gain)}`);
  const amt = roll(amtOf(prev), amtOf(s), prog(t, since, 0.7));
  const sw = eio(prog(t, since, 0.6));
  const bar = prev === s || k >= 1 ? COLOR[s] : `linear-gradient(180deg, ${COLOR[s]} ${(sw * 100).toFixed(1)}%, ${COLOR[prev]} ${(sw * 100).toFixed(1)}%)`;
  const good = s !== "lose";
  const wash = k > 0 && k < 1 && prev !== s ? `background:rgba(34,197,94,${(0.26 * (1 - k)).toFixed(3)});` : "";
  const pop = k > 0 && k < 1 && prev !== s ? `transform:scale(${(1 + 0.14 * Math.sin(Math.min(1, k * 2.2) * Math.PI)).toFixed(3)})` : "";
  return `<div class="gd-pos" style="${wash}"><i class="bar" style="background:${bar}"></i>
    <div style="min-width:0"><div class="uname">${p.title}</div><div class="umeta">${p.pick} · ${usd(p.stake)}${p.take ? ` · <span class="badge b-chainlink" style="padding:1px 6px;font-size:10px"><img src="assets/chainlink.png" style="width:11px;height:11px;border-radius:50%;background:#fff" />read live</span>` : ""}</div></div>
    <div class="gd-pos-side"><span class="badge ${cls}" style="${pop}">${label}</span><div class="gd-amt ${good ? "amt-won" : "amt-lost"}">${amt}</div></div>
  </div>`;
}

function board(id, home, away, score, keys, goal, t) {
  let banner = "", pop = 1;
  if (goal) {
    const [g, txt] = goal, k = prog(t, g, 1.7);
    if (k > 0 && k < 1) {
      const i = eo(prog(t, g, 0.25)), o = eo(prog(t, g + 1.35, 0.35));
      banner = `<div class="gd-goal" style="opacity:${(cl(prog(t, g, 0.12)) * (1 - o)).toFixed(3)};clip-path:inset(0 ${((1 - i) * 50).toFixed(1)}% 0 ${((1 - i) * 50).toFixed(1)}%)">${icon("ball", 20, 2)}${txt}</div>`;
      pop = 1 + 0.2 * Math.sin(Math.min(1, prog(t, g, 0.7)) * Math.PI);
    }
  }
  const n = net(keys, t);
  return `<div class="card gd-match gd-live" id="${id}">
    ${banner}<div class="gd-head">${liveBadge(t, clock(t))}Premier League<span style="margin-left:auto;color:var(--ink-4)">${icon("chevronRight", 16)}</span></div>
    <div class="gd-score"><span class="t">${CREST(home[0])}${home[1]}</span><span class="sc" style="display:inline-block;transform:scale(${pop.toFixed(3)});${pop > 1.01 ? "color:var(--green-ink)" : ""}">${score}</span><span class="t away">${away[1]}${CREST(away[0])}</span></div>
    <div class="gd-positions">${keys.map((k) => posLine(k, t)).join("")}</div>
    <div class="gd-foot"><span>${usd(10 * keys.length)} riding</span><span class="${n >= 0 ? "amt-won" : "amt-lost"}">If it ends now ${roll(signed(net(keys, T.goal - 0.01)), signed(n), goal ? prog(t, T.goal, 0.7) : 1)}</span></div>
  </div>`;
}

function hero(n, w, l, games) {
  const tint = n >= 0 ? "var(--green-mid)" : "var(--red-mid)", bg = n >= 0 ? "var(--green-tint)" : "#1a0c0c";
  return `<div class="card gd-hero" style="border-color:${tint};background:linear-gradient(180deg, ${bg}, var(--surface) 80%)"><div class="gd-hero-row">
      <div><div class="gd-k">On the line</div><div class="gd-v">$20.00</div><div class="umeta">${games}</div></div>
      <div style="text-align:right"><div class="gd-k">If it all ends now</div><div class="gd-v ${n >= 0 ? "amt-won" : "amt-lost"}">${signed(n)}</div><div class="umeta">${w} winning · ${l} losing</div></div>
    </div></div>`;
}

/* your mates in play: Cold Libero flips at the goal */
function mates(t) {
  const flip = prog(t, T.goal, 0.9);
  const lib = t >= T.goal
    ? `<span class="badge b-won" style="transform:scale(${(1 + 0.16 * Math.sin(Math.min(1, flip * 2.2) * Math.PI)).toFixed(3)})">2 winning</span>`
    : `<span class="badge b-won">1 winning</span><span class="badge b-lost">1 losing</span>`;
  const glow = t >= T.toA[0] ? `box-shadow:inset 4px 0 0 var(--green), 0 0 ${(18 * (0.5 + 0.5 * Math.sin(t * 4))).toFixed(1)}px rgba(34,197,94,0.25);border-color:var(--green-mid)` : "";
  const row = (id, mono, bg, name, sub, badges, style = "") => `<div class="card gd-mate" id="${id}" style="${style}">${AV(mono, bg)}<span class="gd-mate-t"><span class="uname">${name}</span><span class="umeta">${sub}</span></span><span class="gd-mate-s">${badges}</span></div>`;
  return `<div id="mates"><div class="sec-hd"><h3>Your mates in play</h3></div>
    ${row("mate-libero", "CL", "#1d4ed8", "Cold Libero", "On Arsenal v Spurs", lib, glow)}
    ${row("mate-nutmeg", "FN", "#831843", "Fierce Nutmeg", "On Man Utd v Chelsea", `<span class="badge b-lost">1 losing</span>`)}
    ${row("mate-rabona", "GR", "#a16207", "Golden Rabona", "On Man City v Newcastle", `<span class="badge b-won">1 winning</span>`)}</div>`;
}

function screenA(t) {
  const enter = (i) => { const a = T.story[0] + 0.5 + i * 0.18, p = spring(prog(t, a, 0.6)); return `opacity:${cl(prog(t, a, 0.25))};transform:translateY(${((1 - p) * 40).toFixed(1)}px)`; };
  let h = `<div style="${enter(0)}">${hero(net(["utd", "bruno"], t), 2, 0, "1 game")}</div>`;
  h += `<div style="${enter(1)}">${mates(t)}</div>`;
  h += `<div class="sec-hd" style="${enter(2)}"><h3 style="color:var(--red-ink)">In play</h3><span class="badge b-live"><i class="livedot"></i>1 game</span></div>`;
  h += `<div style="${enter(2)}">${board("cardA", ["33", "Man Utd"], ["49", "Chelsea"], "1–0", ["utd", "bruno"], null, t)}</div>`;
  return `<div class="hdr"><div style="flex:1;min-width:0"><div class="hdr-title">Game day</div><div class="hdr-sub">Everything you've got on, as it happens</div></div><span class="iconbtn">${icon("share", 17)}</span><span class="balpill" style="margin-left:0">$70.00</span></div>
    <div class="body"><div class="scroll">${h}</div></div>${tabs("Profile")}`;
}

const market = (id, flash, title, meta, yes, no, settle) => `<div class="card" style="margin-top:10px">
    <div class="match-top">${flash ? `<span class="badge b-flash">${icon("bolt", 12, 2)}Flash</span>` : `<span class="badge b-open">Terrace</span>`}<span class="umeta" style="margin:0">Premier League</span><span class="badge b-settled" style="margin-left:auto">${icon("clock", 12, 2)} ${flash ? "6m" : "Full time"}</span></div>
    <div class="mrow"><span class="crest-pair">${CREST("42")}${CREST("47")}</span><span style="flex:1;min-width:0"><span style="display:block;font-size:14.5px;font-weight:600">${title}</span><span class="umeta" style="display:block">${meta}</span></span></div>
    <div class="odds2"><div class="odd o-yes" id="${id}-yes"><span class="lbl">Yes</span><span class="val">${yes}</span></div><div class="odd o-no"><span class="lbl">No</span><span class="val">${no}</span></div></div>
    <div class="umeta" style="display:flex;align-items:center;gap:5px;margin-top:9px">${icon("shield", 12)} ${settle}</div></div>`;

function screenB(t) {
  const n = liberoNet(t), after = t >= T.goal;
  const score = roll("0–0", after ? "1–0" : "0–0", prog(t, T.goal, 0.6));
  let h = hero(n, after ? 2 : 1, after ? 0 : 1, "1 game");
  h += `<div class="sec-hd"><h3 style="color:var(--red-ink)">In play</h3><span class="badge b-live"><i class="livedot"></i>1 game</span></div>`;
  h += board("cardL", ["42", "Arsenal"], ["47", "Spurs"], score, ["ars", "btts"], [T.goal, "GOAL · ARSENAL 79'"], t);
  h += `<div class="sec-hd" id="sameHd"><h3>Back the same games</h3><span class="more">Markets ›</span></div>`;
  h += market("mk1", true, "Another goal before 85'", "Arsenal v Spurs · 41 fans in", "6/4", "1/2", "Settled by the official match feed");
  h += market("mk2", false, "Spurs score before full time", "Arsenal v Spurs · 212 fans in", "7/4", "2/5", "Settled by the official result");
  const backed = t >= T.tapBack + 0.1;
  const sy = -eio(span(t, T.scrollB)) * 290;
  let out = `<div class="hdr"><span class="iconbtn" id="backbtn">${icon("chevronLeft", 18, 2)}</span><div style="flex:1;min-width:0"><div class="hdr-title">Cold Libero's game day</div><div class="hdr-sub">Their bets, as it stands</div></div></div>
    <div class="body"><div class="scroll" style="transform:translateY(${sy.toFixed(1)}px)">${h}</div></div>${tabs("Profile")}`;
  const tp = prog(t, T.tapBack + 0.35, 0.3) * (1 - prog(t, T.tapHome - 0.3, 0.3));
  if (tp > 0) out += `<div class="toast" style="opacity:${tp};transform:translate(-50%,${(1 - eo(prog(t, T.tapBack + 0.35, 0.35))) * 14}px)">${icon("check", 18, 2.4)}<span>You're on: <b>Yes</b>, $5.00</span></div>`;
  if (backed) out = out.replace('id="mk1-yes"', `id="mk1-yes" style="box-shadow:0 0 0 2px var(--green);background:#0f2a19"`);
  return out;
}

/* ---------------- camera: a slow push into what just changed ---------------- */
const SHOTS = [[8.3, 15.0, "A", "mates", 1.14], [19.2, 25.0, "B", "cardL", 1.14], [32.2, 38.6, "A", "mates", 1.12]];
function camera(t) {
  let s = 1, oy = 450;
  for (const [a, b, scr, id, z] of SHOTS) {
    const k = eio(prog(t, a, 0.9)) * (1 - eio(prog(t, b - 0.9, 0.9)));
    if (k <= 0) continue;
    const el = $(id);
    if (!el) continue;
    let y = el.offsetHeight / 2, n = el;
    while (n && n.id !== "screen") { y += n.offsetTop; n = n.offsetParent; }
    y += 12;
    const zz = VERT ? 1 + (z - 1) * 0.3 : z;
    s = lerp(1, zz, k);
    oy = lerp(450, cl(y, 200, 760), k);
  }
  return { s, oy };
}

const TAPS = [[T.tapMate, "mate-libero"], [T.tapBack, "mk1-yes"], [T.tapHome, "backbtn"]];
function tap(t) {
  const dot = $("tap"), rip = $("ripple");
  dot.style.opacity = 0; rip.style.opacity = 0;
  for (const [a, id] of TAPS) {
    if (t < a - 0.45 || t > a + 0.5) continue;
    const el = $(id);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2, k = t - a;
    const o = k < -0.3 ? prog(t, a - 0.45, 0.15) : k > 0.3 ? 1 - prog(t, a + 0.3, 0.2) : 1;
    dot.style.cssText = `left:${x}px;top:${y + (k < -0.1 ? (1 - eo(prog(t, a - 0.45, 0.35))) * 40 : 0)}px;opacity:${o};transform:scale(${k > -0.08 && k < 0.1 ? 0.8 : 1})`;
    if (k > 0) {
      const p = eo(prog(t, a, 0.45)), size = 30 + p * 70;
      rip.style.cssText = `left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;opacity:${(1 - p) * 0.9}`;
    }
  }
}

/* ---------------- narration, with the group chat's banter under it ---------------- */
const CHAT = {
  2: ["CL", "#1d4ed8", "Cold Libero", "come on Arsenal, it's 0–0 at 70"],
  4: ["CL", "#1d4ed8", "Cold Libero", "I can't watch this"],
  5: ["CL", "#1d4ed8", "Cold Libero", "GET IN"],
  7: ["FN", "#831843", "Fierce Nutmeg", "fine. drinks are on me"],
};
function narration(t) {
  const [a, b] = T.story;
  if (t < a || t >= b) return "";
  const idx = BEATS.reduce((n, [x], i) => (t >= x ? i : n), -1);
  let h = `<div style="${st(life(t, a + 0.1, b))}"><span class="kicker"><span class="dot" style="opacity:${0.55 + 0.45 * Math.sin(t * 6)}"></span>Your mates · Game day</span></div>`;
  if (idx >= 0) {
    const [x, line, sub] = BEATS[idx], next = BEATS[idx + 1] ? BEATS[idx + 1][0] : b;
    const long = line.replace(/[*_]/g, "").length > 15;
    h += `<div class="beat" style="${long ? `font-size:${VERT ? 80 : 98}px` : ""}">${words(t, x + 0.05, next, line)}</div>`;
    h += `<div class="bsub" style="${st(life(t, x + 0.45, next, { dy: 20, out: 0.3 }))}">${sub}</div>`;
    const c = CHAT[idx];
    h += `<div class="cextra" style="height:58px;${st(life(t, x + 0.7, next, { dy: 16, out: 0.3 }))}">${c ? `<span class="bubble">${AV(c[0], c[1], 40)}<b>${c[2]}</b>${c[3]}</span>` : ""}</div>`;
  }
  h += `<div class="steps" style="${st(life(t, a + 0.6, b))}">${BEATS.map((_, i) => `<i class="${i < idx ? "on" : i === idx ? "now" : ""}"></i>`).join("")}</div>`;
  return h;
}

function endCard(t) {
  if (t < T.end) return "";
  const e = (k, dy = 30) => st(life(t, T.end + 0.25 + k * 0.3, 99, { d: 0.7, dy }));
  const top = VERT ? 520 : 130;
  return `<div class="ctr" style="top:${top}px;opacity:${1 - prog(t, T.dur - 0.6, 0.6)}">
    <div style="display:inline-flex;${e(0)}">${AV("CL", "#1d4ed8", 120).replace("avatar\"", "avatar\" ").replace("style=\"", "style=\"box-shadow:0 0 0 6px var(--canvas);")}${AV("FN", "#831843", 120).replace("style=\"", "style=\"margin-left:-24px;box-shadow:0 0 0 6px var(--canvas);")}${AV("GR", "#a16207", 120).replace("style=\"", "style=\"margin-left:-24px;box-shadow:0 0 0 6px var(--canvas);")}</div>
    <span class="big" style="display:block;font-size:${VERT ? 130 : 150}px;margin-top:40px;${e(1)}">${VERT ? `Your mates<br/><span class="green">in play</span>` : `Your mates <span class="green">in play</span>`}</span>
    <span class="lead" style="display:block;font-size:${VERT ? 40 : 44}px;margin-top:24px;color:var(--ink);${e(2, 16)}">See how their bets stand. Back the same games.</span>
    <div style="margin-top:40px;${e(3, 16)}"><span class="pillurl">play.terrace.social</span></div>
    <div style="margin-top:38px;${e(4, 12)}"><span class="brandrow"><img src="assets/terrace.png" /><b>TERRACE</b> &nbsp;on <img src="assets/monad.png" /><b>MONAD</b></span></div>
    <div style="margin-top:22px;${e(5, 12)}"><span class="brandrow">Settled by <img class="cl" src="assets/chainlink.png" /><b>CHAINLINK</b></span></div>
  </div>`;
}

/* ---------------- seek ---------------- */
window.seek = (t) => {
  // the room's light follows Cold Libero: red while he's losing, green once the goal goes in
  const inB = t >= T.toB[0] && t < T.toA[1];
  const g = t < T.story[0] || t >= T.end ? 0.5 : inB ? cl((liberoNet(t) + 10) / 25) : 0.8;
  const red = 0.13 * (1 - g), grn = 0.05 + 0.1 * g;
  $("glow").style.background = `radial-gradient(900px 760px at ${VERT ? 50 : 30}% ${VERT ? 55 : 48}%, rgba(239,68,68,${red.toFixed(3)}), transparent 70%), radial-gradient(1000px 760px at ${VERT ? 50 : 62}% ${VERT ? 30 : 40}%, rgba(34,197,94,${grn.toFixed(3)}), transparent 70%)`;
  $("stage").innerHTML = cover(t) + endCard(t);

  const inPhone = t >= T.story[0] - 0.2 && t < T.end;
  $("phonewrap").style.display = inPhone ? "" : "none";
  if (inPhone) {
    // A slides out left as B pushes in from the right, and back again
    const k = eio(span(t, T.toB)) * (1 - eio(span(t, T.toA)));
    const A = $("scrA"), B = $("scrB");
    A.style.cssText = `transform:translateX(${(-30 * k).toFixed(2)}%);filter:brightness(${(1 - 0.5 * k).toFixed(3)});display:${k >= 1 ? "none" : ""}`;
    B.style.cssText = `transform:translateX(${(100 * (1 - k)).toFixed(2)}%);box-shadow:-20px 0 40px rgba(0,0,0,${(0.6 * k).toFixed(2)});display:${k <= 0 ? "none" : ""}`;
    A.innerHTML = k < 1 ? screenA(t) : "";
    B.innerHTML = k > 0 ? screenB(t) : "";
    const ph = life(t, T.story[0], T.end, { d: 0.8, dy: 120, out: 0.5 });
    const cam = camera(t);
    $("phone").style.cssText = `opacity:${ph.o.toFixed(3)};transform-origin:220px ${cam.oy.toFixed(1)}px;transform:translateY(${ph.y.toFixed(1)}px) scale(${(ph.s * cam.s).toFixed(4)})`;
  }
  $("cap").innerHTML = narration(t);
  tap(t);
};

const IMGS = ["assets/terrace.png", "assets/monad.png", "assets/chainlink.png", ...["42", "47", "33", "49"].map((id) => `assets/crest-${id}.png`)];
document.fonts.ready.then(() => Promise.all(IMGS.map((s) => { const i = new Image(); i.src = s; return i.decode().catch(() => {}); }))).then(() => {
  window.seek(Number(new URLSearchParams(location.search).get("t") || 0));
  window.ready = true;
});
