<style>

  /* narration beside the phone */

  body.v #cap { left: 64px; top: 200px; width: 952px; }
  .beat { font-family: var(--cond); font-weight: 800; font-size: 120px; line-height: 0.95; text-transform: uppercase; margin-top: 26px; white-space: nowrap; letter-spacing: -1px; }
  body.v .beat { font-size: 96px; margin-top: 18px; }
  .bsub { font-size: 40px; font-weight: 700; color: var(--ink-2); margin-top: 24px; height: 50px; white-space: nowrap; }
  body.v .bsub { font-size: 34px; margin-top: 16px; height: 44px; }
  .cextra { margin-top: 22px; height: 46px; }
  body.v .cextra { margin-top: 12px; }
  .steps { margin-top: 34px; display: flex; gap: 10px; }
  body.v .steps { margin-top: 18px; }
  .steps i { width: 46px; height: 6px; border-radius: 3px; background: #262626; display: block; }
  .steps i.on { background: var(--green); }
  .steps i.now { background: var(--ink); }
  /* rolling digits and the sweeping bar */
  .roll { display: inline-block; overflow: hidden; height: 1.08em; vertical-align: -0.12em; line-height: 1.08; }
  .roll > span { display: block; }
  .gd-pos { position: relative; }
  .gd-pos .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .gd-pos.win, .gd-pos.lose { box-shadow: none; }

  /* lock screen: the fan is away from the app */
  .lock { position: absolute; inset: 0; overflow: hidden; }
  .lk-wall { position: absolute; inset: 0; }
  .lk-date { position: absolute; left: 0; right: 0; top: 84px; text-align: center; font-size: 19px; font-weight: 600; color: rgba(255,255,255,0.82); }
  .lk-time { position: absolute; left: 0; right: 0; top: 104px; text-align: center; font-family: var(--sans); font-weight: 700; font-size: 104px; letter-spacing: -2px; line-height: 1; color: rgba(255,255,255,0.94); font-variant-numeric: tabular-nums; }
  .lk-ctx { position: absolute; left: 0; right: 0; top: 236px; text-align: center; font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.55); }
  .nt { position: absolute; left: 12px; right: 12px; top: 300px; display: grid; grid-template-columns: 42px 1fr; gap: 12px; padding: 14px 15px 15px 13px; border-radius: 26px; background: rgba(40,40,40,0.82); border: 1px solid rgba(255,255,255,0.07); box-shadow: 0 14px 34px rgba(0,0,0,0.45); }
  .nt img { width: 42px; height: 42px; border-radius: 11px; margin-top: 2px; }

  .switch.on i { transform: translateX(18px); background: var(--green); }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #14532d, #22c55e); display: grid; place-items: center; font-family: var(--cond); font-weight: 800; font-size: 22px; color: var(--on-green); flex: none; }

<body>
<div id="frame">
  <div id="glow"></div>
  <div id="grid"></div>
  <div id="stage" class="layer"></div>
  <div id="phonewrap"><div id="phone"><div id="screen"><div id="island"></div><div id="status"><span>9:41</span><span>●●● ▮</span></div><div id="view"></div></div></div></div>
  <div id="cap"></div>
  <div id="fx" style="position:absolute;inset:0;z-index:24;pointer-events:none"></div>
  <div id="tap"></div><div id="ripple"></div>
  <div id="vig"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const VERT = new URLSearchParams(location.search).get("f") === "9x16";
if (VERT) document.body.classList.add("v");
const W = VERT ? 1080 : 1920, H = VERT ? 1920 : 1080;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => cl((t - a) / d);           // a start and a duration
const span = (t, [a, b]) => prog(t, a, b - a);       // a start and an end
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const spring = (x) => (x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(9 * x));
const lerp = (a, b, x) => a + (b - a) * x;
function life(t, a, b, { d = 0.5, dy = 26, out = 0.35 } = {}) {
  const i = spring(prog(t, a, d)), o = eo(prog(t, b - out, out));
  return { o: cl(prog(t, a, d * 0.6)) * (1 - o), y: (1 - i) * dy - o * 14, s: lerp(0.96, 1, i) };
}
const st = ({ o, y = 0, s = 1 }) => `opacity:${o.toFixed(3)};transform:translateY(${y.toFixed(1)}px) scale(${s.toFixed(4)})`;
const icon = (n, s = 24, sw = 1.75) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const usd = (n) => `$${Math.abs(n).toFixed(2)}`;
const signed = (n) => `${n >= 0 ? "+" : "−"}${usd(n)}`;

/** Words rise out of a mask one after another, and drop away together at `b`. *word* is green, _word_ red. */
function words(t, a, b, html, { stag = 0.07, d = 0.55 } = {}) {
  return html.split(/(<br\/>)/).map((chunk) => chunk === "<br/>" ? "<br/>" : chunk.split(" ").filter(Boolean).map((w, i) => {
    const p = spring(prog(t, a + i * stag, d)), o = eo(prog(t, b - 0.3, 0.3));
    const txt = /^\*.*\*$/.test(w) ? `<span class="green">${w.slice(1, -1)}</span>` : /^_.*_$/.test(w) ? `<span class="redt">${w.slice(1, -1)}</span>` : w;
    return `<span class="m"><span class="w" style="transform:translateY(${((1 - p) * 110 + o * -110).toFixed(1)}%)">${txt}</span></span>`;
  }).join(" ")).join("");
}

/** Old text rolls up and out, new text rolls in from below, character by character (RollingNumber). */
function roll(prev, next, k) {
  if (k >= 1 || prev === next) return next;
  const n = Math.max(prev.length, next.length), a = prev.padStart(n, " "), b = next.padStart(n, " ");
  return [...b].map((c, i) => {
    if (c === a[i]) return c === " " ? "" : c;
    const ki = eio(cl(k * 1.25 - (n - 1 - i) * 0.06));
    return `<span class="roll"><span style="transform:translateY(${(-ki * 100).toFixed(1)}%)"><span style="display:block">${a[i] === " " ? "&nbsp;" : a[i]}</span><span style="display:block">${c === " " ? "&nbsp;" : c}</span></span></span>`;
  }).join("");
}

/* ---------------- one fan's Saturday lunch (48 s) ---------------- */
const T = {
  cover: [0, 3.6],
  story: [3.6, 39.6],
  p1: 7.7,        // push: Fernandes 41', Man Utd 1-0
  sleep: [13.4, 14.0],
  p2: 16.3,       // push: 84' Chelsea level, 1-1 (replaces the first)
  tapN: 22.7,     // tap the alert
  open: [22.85, 23.7],
  gWin: 28.4,     // Man Utd 2-1, 90+2', in the app
  tapP: 32.5,     // Profile tab
  prof: [32.6, 33.1],
  end: 39.6, dur: 48,
};
const BEATS = [
  [3.9, "Saturday. *Lunch.*", "Man Utd v Chelsea is on. You're not watching."],
  [7.5, "*Bruno.* 41'.", "Your phone buzzes. You're winning."],
  [11.9, "One glance. *Relief.*", "No app open, no score to check."],
  [16.1, "84'. Chelsea _level._", "A new alert replaces the old one."],
  [20.0, "_Panic._ Tap it.", "It opens straight on Game day."],
  [23.95, "Your bet, *live.*", "Beside the score, as it happens."],
  [28.2, "90+2'. *Back* *in* *front.*", "Winning again. One buzz per swing."],
  [32.7, "On by *default.*", "Profile → Swing alerts. Off any time."],
];
const CLOCK = [[T.open[0], 86], [T.gWin, 92], [T.end, 94]];
function clock(t) {
  let m = CLOCK[0][1];
  for (let i = 1; i < CLOCK.length; i++) if (t >= CLOCK[i - 1][0]) m = lerp(CLOCK[i - 1][1], CLOCK[i][1], span(t, [CLOCK[i - 1][0], CLOCK[i][0]]));
  m = Math.floor(m);
  return m > 90 ? `90+${m - 90}'` : `${m}'`;
}

const RET = 19.7; // a $10 bet on Man Utd pays back $19.70
const POS = {
  utd: { title: "Man Utd win", pick: "Yes", tl: [[-1, "lose"], [T.gWin, "win"]] },
  ars: { title: "Arsenal win", pick: "Yes", tl: [[-1, "win"]] },
};
const SCORE = { A: [[-1, "1–0"]], B: [[-1, "1–1"], [T.gWin, "2–1"]] };
function at(tl, t) {
  let i = 0;
  while (i + 1 < tl.length && t >= tl[i + 1][0]) i++;
  return { s: tl[i][1], prev: i ? tl[i - 1][1] : tl[i][1], since: tl[i][0] };
}
const gain = (s) => (s === "win" || s === "won" ? RET - 10 : -10);
const netNow = (t) => Object.values(POS).reduce((n, p) => n + gain(at(p.tl, t).s), 0);
function netCount(t) {
  if (t < T.gWin) return netNow(t);
  return lerp(netNow(T.gWin - 0.01), netNow(T.gWin), eio(prog(t, T.gWin, 1.0)));
}
/** How the fan feels, -1 (losing) to 1 (winning), for the room's light. */
function mood(t) {
  if (t < T.p1) return 0;
  if (t < T.p2) return lerp(0, 1, eo(prog(t, T.p1, 0.8)));
  if (t < T.gWin) return lerp(1, -1, eo(prog(t, T.p2, 0.8)));
  if (t < T.end) return lerp(-1, 1, eo(prog(t, T.gWin, 0.8)));
  return 0;
}

/* ---------------- cover ---------------- */
function cover(t) {
  if (t >= T.cover[1]) return "";
  const out = eo(prog(t, T.cover[1] - 0.5, 0.5));
  const s = (k) => `opacity:${1 - out};transform:translateY(${-out * 30 * k}px)`;
  const cy = VERT ? 520 : 130, R = VERT ? 105 : 82;
  const wob = Math.sin(t * 38) * 6 * Math.max(0, Math.sin(((t % 1.6) / 1.6) * Math.PI * 2)) ** 8; // the bell rings now and then
  return `<div class="ctr" style="top:${cy}px;${s(1)}">
      <span style="display:inline-flex;align-items:center;gap:16px;font-family:var(--cond);font-weight:800;font-size:${VERT ? 44 : 40}px;letter-spacing:2px"><img src="assets/terrace.png" style="width:${VERT ? 64 : 56}px;height:${VERT ? 64 : 56}px;border-radius:14px" />TERRACE</span>
    </div>
    <div class="ring" style="left:${W / 2 - R}px;top:${cy + (VERT ? 110 : 92)}px;width:${2 * R}px;height:${2 * R}px;${s(1.4)};background:radial-gradient(circle at 35% 30%, #0f3a1f, var(--green-deep) 70%);border-color:var(--green);box-shadow:0 0 ${80 + 24 * Math.sin(t * 4)}px rgba(34,197,94,0.4)"><span style="display:inline-block;transform:rotate(${wob.toFixed(2)}deg);transform-origin:50% 10%">${icon("bell", VERT ? 96 : 84, 1.9)}</span></div>
    <div class="ctr" style="top:${cy + (VERT ? 340 : 296)}px;${s(1.8)}">
      <div><span class="kicker" style="height:50px"><span class="dot" style="opacity:${0.55 + 0.45 * Math.sin(t * 6)}"></span>Live</span></div>
      <span class="big" style="display:block;font-size:${VERT ? 180 : 200}px;margin-top:26px">Swing <span class="green">alerts</span></span>
      <span class="lead" style="display:block;font-size:${VERT ? 40 : 42}px;margin-top:26px;color:var(--ink)">${VERT ? "When a goal flips your bet,<br/>your phone tells you." : "When a goal flips your bet, your phone tells you."}</span>
      <div style="margin-top:${VERT ? 54 : 40}px"><span class="brandrow">On <img src="assets/monad.png" /><b>MONAD</b> &nbsp;· settled by <img class="cl" src="assets/chainlink.png" /><b>CHAINLINK</b></span></div>
    </div>`;
}

/* ---------------- the lock screen ---------------- */
const PUSH = [
  { at: T.p1, title: `Fernandes 41': your Man Utd win is now winning <span class="nt-amt" style="color:#86efac">(+$9.70)</span>`, body: "Man Utd 1–0 Chelsea · +$9.70 if it ends like this" },
  { at: T.p2, title: "84' Chelsea level: your Man Utd win is now losing", body: "Man Utd 1–1 Chelsea · −$10.00 if it ends like this" },
];
function lockScreen(t) {
  const m = mood(t);
  const g = cl(m), r = cl(-m);
  const wall = `background:radial-gradient(140% 70% at 50% 8%, rgba(34,197,94,${(0.30 * g).toFixed(3)}), transparent 60%), radial-gradient(140% 70% at 50% 8%, rgba(239,68,68,${(0.30 * r).toFixed(3)}), transparent 60%), radial-gradient(120% 80% at 30% 100%, #1b2235, transparent 70%), linear-gradient(180deg, #121826, #07090f)`;
  const late = t >= T.sleep[1];
  const time = late ? "16:39" : t >= T.p1 - 0.4 ? "15:41" : "15:40";
  let notes = "";
  PUSH.forEach((p, i) => {
    const next = PUSH[i + 1];
    if (t < p.at) return;
    const k = spring(prog(t, p.at, 0.7)), o = cl(prog(t, p.at, 0.25));
    // a newer alert from the same match takes this one's place: it sinks back and fades under the new one
    const gone = next ? eo(prog(t, next.at, 0.45)) : 0;
    if (gone >= 1) return;
    notes += `<div class="nt" id="nt${i}" style="opacity:${(o * (1 - gone)).toFixed(3)};transform:translateY(${((1 - k) * -70 + gone * 26).toFixed(1)}px) scale(${(lerp(0.9, 1, k) * (1 - 0.08 * gone)).toFixed(4)});z-index:${2 - i}">
      <img src="assets/terrace.png" /><div style="min-width:0"><div class="nt-top"><b>Terrace</b><span>now</span></div><div class="nt-title">${p.title}</div><div class="nt-body">${p.body}</div></div></div>`;
  });
  const dark = cl(prog(t, T.sleep[0], T.sleep[1] - T.sleep[0])) * (1 - cl(prog(t, T.p2 - 0.15, 0.2)));
  const opened = eio(span(t, T.open));
  return `<div class="lock" style="opacity:${(1 - opened).toFixed(3)};transform:scale(${(1 + 0.06 * opened).toFixed(4)})"><div class="lk-wall" style="${wall}"></div>
    <div class="lk-date">Saturday 8 November</div><div class="lk-time">${time}</div>
    <div class="lk-ctx">${icon("ball", 14, 2)} Man Utd v Chelsea · on now</div>
    ${notes}
    <div class="lk-btn" style="left:44px">${icon("bolt", 22, 1.8)}</div><div class="lk-btn" style="right:44px">${icon("eye", 22, 1.8)}</div><div class="lk-home"></div>
    <div style="position:absolute;inset:0;background:#000;opacity:${(0.94 * dark).toFixed(3)};z-index:5"></div></div>`;
}

/* ---------------- Game day, opened from the alert ---------------- */
const tabs = (on) => `<div class="tabbar">${[["home", "Home"], ["pitch", "Markets"], ["plus", "Create"], ["users", "Social"], ["shield", "Profile"]].map(([ic, l]) =>
  `<div class="tab${l === "Create" ? " tab-create" : ""}${l === on ? " on" : ""}" id="tab-${l}"><span class="pill">${icon(ic, 22)}</span><span class="tl">${l}</span></div>`).join("")}</div>`;
const CREST = (id) => `<span class="crest"><img src="assets/crest-${id}.png" /></span>`;
const BADGE = { lose: ["b-lost", "Losing"], win: ["b-won", "Winning"], won: ["b-won", "Won"] };
const COLOR = { lose: "var(--red)", win: "var(--green)", won: "var(--green)" };

function posLine(key, t) {
  const p = POS[key], { s, prev, since } = at(p.tl, t);
  const k = prog(t, since, 0.9);
  const [cls, label] = BADGE[s];
  const amtOf = (x) => (x === "lose" ? `−${usd(10)}` : `+${usd(RET - 10)}`);
  const amt = roll(amtOf(prev), amtOf(s), prog(t, since, 0.7));
  const sw = eio(prog(t, since, 0.6));
  const bar = prev === s || k >= 1 ? COLOR[s] : `linear-gradient(180deg, ${COLOR[s]} ${(sw * 100).toFixed(1)}%, ${COLOR[prev]} ${(sw * 100).toFixed(1)}%)`;
  const good = s !== "lose";
  const wash = k > 0 && k < 1 && prev !== s ? `background:rgba(${good ? "34,197,94" : "239,68,68"},${(0.26 * (1 - k)).toFixed(3)});` : "";
  const pop = k > 0 && k < 1 && prev !== s ? `transform:scale(${(1 + 0.14 * Math.sin(Math.min(1, k * 2.2) * Math.PI)).toFixed(3)})` : "";
  return `<div class="gd-pos" id="pos-${key}" style="${wash}"><i class="bar" style="background:${bar}"></i>
    <div style="min-width:0"><div class="uname">${p.title}</div><div class="umeta">${p.pick} · ${usd(10)}</div></div>
    <div class="gd-pos-side"><span class="badge ${cls}" style="${pop}">${label}</span><div class="gd-amt ${good ? "amt-won" : "amt-lost"}">${amt}</div></div>
  </div>`;
}

function board(id, game, home, away, keys, goals, t) {
  const sc = at(SCORE[game], t), sk = prog(t, sc.since, 0.6);
  let banner = "", pop = 1;
  for (const [g, txt] of goals) {
    const k = prog(t, g, 1.7);
    if (k <= 0 || k >= 1) continue;
    const i = eo(prog(t, g, 0.25)), o = eo(prog(t, g + 1.35, 0.35));
    banner = `<div class="gd-goal" style="opacity:${(cl(prog(t, g, 0.12)) * (1 - o)).toFixed(3)};clip-path:inset(0 ${((1 - i) * 50).toFixed(1)}% 0 ${((1 - i) * 50).toFixed(1)}%)">${icon("ball", 20, 2)}${txt}</div>`;
    pop = 1 + 0.2 * Math.sin(Math.min(1, prog(t, g, 0.7)) * Math.PI);
  }
  const n = keys.reduce((s, k) => s + gain(at(POS[k].tl, t).s), 0);
  const pulse = 0.5 + 0.5 * Math.sin(t * 6.2);
  return `<div class="card gd-match gd-live" id="${id}">
    ${banner}<div class="gd-head"><span class="badge b-live" style="box-shadow:0 0 ${(4 + 10 * pulse).toFixed(1)}px rgba(239,68,68,${(0.35 + 0.4 * pulse).toFixed(2)})"><i class="livedot" style="opacity:${(0.45 + 0.55 * pulse).toFixed(2)}"></i>${clock(t)}</span>Premier League<span style="margin-left:auto;color:var(--ink-4)">${icon("chevronRight", 16)}</span></div>
    <div class="gd-score"><span class="t">${CREST(home[0])}${home[1]}</span><span class="sc" style="display:inline-block;transform:scale(${pop.toFixed(3)});${pop > 1.01 ? "color:var(--green-ink)" : ""}">${roll(sc.prev, sc.s, sk)}</span><span class="t away">${away[1]}${CREST(away[0])}</span></div>
    <div class="gd-positions">${keys.map((k) => posLine(k, t)).join("")}</div>
    <div class="gd-foot"><span>${usd(10 * keys.length)} riding</span><span class="${n >= 0 ? "amt-won" : "amt-lost"}">If it ends now ${signed(n)}</span></div>
  </div>`;
}

function hero(t) {
  const n = netCount(t);
  const states = Object.values(POS).map((p) => at(p.tl, t).s);
  const w = states.filter((s) => s === "win").length, l = states.filter((s) => s === "lose").length;
  const tint = n >= 0 ? "var(--green-mid)" : "var(--red-mid)";
  const bg = n >= 0 ? "var(--green-tint)" : "#1a0c0c";
  return `<div class="card gd-hero" id="hero" style="border-color:${tint};background:linear-gradient(180deg, ${bg}, var(--surface) 80%)"><div class="gd-hero-row">
      <div><div class="gd-k">On the line</div><div class="gd-v">${usd(20)}</div><div class="umeta">2 games</div></div>
      <div style="text-align:right"><div class="gd-k">If it all ends now</div><div class="gd-v ${n >= 0 ? "amt-won" : "amt-lost"}">${signed(n)}</div><div class="umeta">${w} winning · ${l} losing</div></div>
    </div></div>`;
}

function gameDayScreen(t) {
  const enter = (i) => { const p = spring(prog(t, T.open[1] - 0.2 + i * 0.12, 0.6)); return `opacity:${cl(prog(t, T.open[1] - 0.3 + i * 0.12, 0.25))};transform:translateY(${((1 - p) * 30).toFixed(1)}px)`; };
  const B = board("cardB", "B", ["33", "Man Utd"], ["49", "Chelsea"], ["utd"], [[T.gWin, "GOAL · MAN UTD 90+2'"]], t);
  const A = board("cardA", "A", ["42", "Arsenal"], ["47", "Spurs"], ["ars"], [], t);
  let h = `<div style="${enter(0)}">${hero(t)}</div>`;
  h += `<div class="sec-hd" style="${enter(1)}"><h3 style="color:var(--red-ink)">In play</h3><span class="badge b-live">2 games</span></div>`;
  h += `<div style="${enter(1)}">${B}</div><div style="margin-top:10px;${enter(2)}">${A}</div>`;
  return `<div class="hdr"><div style="flex:1;min-width:0"><div class="hdr-title">Game day</div><div class="hdr-sub">Everything you've got on, as it happens</div></div><span class="balpill">$70.00</span></div>
    <div class="body"><div class="scroll">${h}</div></div>${tabs("Home")}`;
}

/* ---------------- Profile → Notifications ---------------- */
const PREFS = [
  ["Results", "Your bets and 1v1s once the match is settled"],
  ["Challenges", "A mate challenges you, takes on or turns down your 1v1"],
  ["Followers", "Someone follows you"],
  ["Swing alerts", "A goal turns one of your bets from winning to losing, or back"],
];
function profileScreen(t) {

  const hl = prog(t, T.prof[1] + 0.9, 0.5), pulse = 0.5 + 0.5 * Math.sin((t - T.prof[1]) * 5);

  const h = `<div class="card" style="display:flex;align-items:center;gap:12px;${enter(0)}"><span class="avatar">JM</span><div style="min-width:0"><div class="uname" style="font-size:17px">Jamie</div><div class="umeta">Man Utd · 14 bets this season</div></div><span class="balpill">$70.00</span></div>
    <div class="sec-hd" style="${enter(1)}"><h3>Notifications</h3></div>
    <div class="card" style="padding:2px 14px;${enter(1)}"><div class="kv"><div><div class="v">Notifications on this device</div><div class="umeta">Results, challenges and new followers, even when Terrace is closed.</div></div><span class="switch on"><i></i></span></div>${rows}</div>`;
  return `<div class="hdr"><div style="flex:1;min-width:0"><div class="hdr-title">Profile</div><div class="hdr-sub">Your account and settings</div></div></div>
    <div class="body"><div class="scroll">${h}</div></div>${tabs("Profile")}`;
}

/* ---------------- camera ---------------- */
const SHOTS = [[T.p1 - 0.1, T.sleep[0], "nt0", 1.32], [T.p2 - 0.1, T.tapN - 0.2, "nt1", 1.32], [24.6, 27.6, "cardB", 1.18], [28.1, 31.9, "cardB", 1.18], [T.prof[1] + 0.6, T.end - 0.3, "prefSwing", 1.2]];
function camera(t) {
  let s = 1, oy = 450;
  for (const [a, b, id, z] of SHOTS) {
    const k = eio(prog(t, a, 0.9)) * (1 - eio(prog(t, b - 0.9, 0.9)));
    if (k <= 0) continue;
    const el = $(id);
    if (!el) continue;
    let y = el.offsetHeight / 2, n = el;
    while (n && n.id !== "screen") { y += n.offsetTop; n = n.offsetParent; }
    y += 12;
    const zz = VERT ? 1.08 : z; // 9:16: the phone has 520..1540 to itself, so only a small push
    s = lerp(1, zz, k);
    oy = lerp(450, cl(y, 200, 760), k);
  }
  return { s, oy };
}

/* buzz: the phone shakes and rings spread from its sides */
const BUZZ = [T.p1, T.p2];
function buzz(t) {
  for (const b of BUZZ) {
    const k = t - b + 0.15;
    if (k < 0 || k > 0.75) continue;
    const env = Math.sin((k / 0.75) * Math.PI);
    return { x: Math.sin(k * 95) * 5 * env, r: Math.sin(k * 95 + 1) * 0.6 * env, k: k / 0.75 };
  }
  return { x: 0, r: 0, k: -1 };
}
function buzzRings(t) {
  let h = "";
  for (const b of BUZZ) {
    const k = prog(t, b - 0.15, 0.9);
    if (k <= 0 || k >= 1) continue;
    const r = $("phone").getBoundingClientRect(), cy = r.top + r.height * 0.36;
    for (const side of [-1, 1]) for (const j of [0, 1, 2]) {
      const kk = cl(k * 1.3 - j * 0.15), d = 26 + kk * 70 + j * 10, hh = 120 + j * 40;
      const x = side < 0 ? r.left - d : r.right + d - 40;
      h += `<div class="buzz" style="left:${x}px;top:${cy - hh / 2}px;width:40px;height:${hh}px;opacity:${(Math.sin(kk * Math.PI) * 0.8).toFixed(3)};transform:scaleX(${side})"></div>`;
    }
  }
  return h;
}

const TAPS = [[T.tapN, "nt1"], [T.tapP, "tab-Profile"]];
function tap(t) {
  const dot = $("tap"), rip = $("ripple");
  dot.style.opacity = 0; rip.style.opacity = 0;
  for (const [a, id] of TAPS) {
    if (t < a - 0.45 || t > a + 0.5) continue;
    const el = $(id);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2, k = t - a;
    const o = k < -0.3 ? prog(t, a - 0.45, 0.15) : k > 0.3 ? 1 - prog(t, a + 0.3, 0.2) : 1;
    dot.style.cssText = `left:${x}px;top:${y + (k < -0.1 ? (1 - eo(prog(t, a - 0.45, 0.35))) * 40 : 0)}px;opacity:${o};transform:scale(${k > -0.08 && k < 0.1 ? 0.8 : 1})`;
    if (k > 0) {
      const p = eo(prog(t, a, 0.45)), size = 30 + p * 70;
      rip.style.cssText = `left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;opacity:${(1 - p) * 0.9}`;
    }
  }
}

/* ---------------- narration ---------------- */
function narration(t) {
  const [a, b] = T.story;
  if (t < a || t >= b) return "";
  const idx = BEATS.reduce((n, [x], i) => (t >= x ? i : n), -1);
  let h = `<div style="${st(life(t, a + 0.1, b))}"><span class="kicker"><span class="dot" style="opacity:${0.55 + 0.45 * Math.sin(t * 6)}"></span>One fan · Swing alerts</span></div>`;
  if (idx >= 0) {
    const [x, line, sub] = BEATS[idx], next = BEATS[idx + 1] ? BEATS[idx + 1][0] : b;
    const long = line.replace(/[*_]/g, "").length > 15;
    h += `<div class="beat" style="${long ? `font-size:${VERT ? 80 : 98}px` : ""}">${words(t, x + 0.05, next, line)}</div>`;
    h += `<div class="bsub" style="${st(life(t, x + 0.45, next, { dy: 20, out: 0.3 }))}">${sub}</div>`;
    const extra = idx === 3 ? `<span class="chip-cl" style="background:#1f1f1f;color:var(--ink-2)">${icon("bell", 22, 2)}One alert per match. The newest wins.</span>`
      : idx === 7 ? `<span class="chip-cl" style="background:var(--green-deep);color:var(--green-ink);padding-left:16px">${icon("check", 22, 2.4)}Swing alerts · on</span>` : "";
    h += `<div class="cextra" style="${st(life(t, x + 0.7, next, { dy: 16, out: 0.3 }))}">${extra}</div>`;
  }
  h += `<div class="steps" style="${st(life(t, a + 0.6, b))}">${BEATS.map((_, i) => `<i class="${i < idx ? "on" : i === idx ? "now" : ""}"></i>`).join("")}</div>`;
  return h;
}

function endCard(t) {
  if (t < T.end) return "";
  const e = (k, dy = 30) => st(life(t, T.end + 0.25 + k * 0.3, 99, { d: 0.7, dy }));
  const top = VERT ? 540 : 150;
  return `<div class="ctr" style="top:${top}px;opacity:${1 - prog(t, T.dur - 0.6, 0.6)}">
    <div class="ring" style="position:relative;display:inline-flex;width:150px;height:150px;background:radial-gradient(circle at 35% 30%, #0f3a1f, var(--green-deep) 70%);border-color:var(--green);box-shadow:0 0 80px rgba(34,197,94,0.35);${e(0)}">${icon("bell", 80, 1.9)}</div>
    <span class="big" style="display:block;font-size:${VERT ? 140 : 150}px;margin-top:40px;${e(1)}">Swing <span class="green">alerts</span></span>
    <span class="lead" style="display:block;font-size:${VERT ? 42 : 44}px;margin-top:24px;color:var(--ink);${e(2, 16)}">Know the moment your bet flips.</span>
    <div style="margin-top:40px;${e(3, 16)}"><span class="pillurl">play.terrace.social</span></div>
    <div style="margin-top:38px;${e(4, 12)}"><span class="brandrow"><img src="assets/terrace.png" /><b>TERRACE</b> &nbsp;on <img src="assets/monad.png" /><b>MONAD</b></span></div>
    <div style="margin-top:22px;${e(5, 12)}"><span class="brandrow">Settled by <img class="cl" src="assets/chainlink.png" /><b>CHAINLINK</b></span></div>
  </div>`;
}

/* ---------------- seek ---------------- */
window.seek = (t) => {
  const m = mood(t), g = cl((m + 1) / 2), red = 0.13 * (1 - g) * Math.abs(m), grn = 0.04 + 0.1 * g * Math.max(0, m);
  $("glow").style.background = `radial-gradient(900px 760px at ${VERT ? 50 : 30}% ${VERT ? 55 : 48}%, rgba(239,68,68,${red.toFixed(3)}), transparent 70%), radial-gradient(1000px 760px at ${VERT ? 50 : 62}% ${VERT ? 30 : 40}%, rgba(34,197,94,${grn.toFixed(3)}), transparent 70%)`;
  $("stage").innerHTML = cover(t) + endCard(t);

  const inPhone = t >= T.story[0] - 0.2 && t < T.end;
  $("phonewrap").style.display = inPhone ? "" : "none";
  let fx = "";
  if (inPhone) {
    let v = "";
    if (t < T.open[1]) v += lockScreen(t);
    if (t >= T.open[0] && t < T.prof[1]) v += `<div style="position:absolute;inset:0;opacity:${eio(span(t, T.open)) * (1 - eio(span(t, T.prof)))}">${gameDayScreen(t)}</div>`;
    if (t >= T.prof[0]) v += `<div style="position:absolute;inset:0;opacity:${eio(span(t, T.prof))}">${profileScreen(t)}</div>`;
    $("view").innerHTML = v;
    const ph = life(t, T.story[0], T.end, { d: 0.8, dy: 120, out: 0.5 });
    const cam = camera(t), bz = buzz(t);
    let ty = ph.y;
    if (VERT) { // keep the phone's bottom inside the safe area while the camera pushes in
      const bottom = 560 + 1.05 * (cam.oy + (900 - cam.oy) * cam.s);
      ty -= Math.max(0, bottom - 1540) / 1.05;
    } else { // 16:9: the push may run off the bottom, never off the top
      ty += Math.max(0, 28 - (92 + cam.oy * (1 - cam.s)));
    }
    $("phone").style.cssText = `opacity:${ph.o.toFixed(3)};transform-origin:220px ${cam.oy.toFixed(1)}px;transform:translate(${bz.x.toFixed(2)}px,${ty.toFixed(1)}px) rotate(${bz.r.toFixed(3)}deg) scale(${(ph.s * cam.s).toFixed(4)})`;
    fx = buzzRings(t);
  }
  $("fx").innerHTML = fx;
  $("status").firstElementChild.textContent = t < T.open[0] ? "" : t < T.gWin ? "16:41" : "16:47"; // the lock screen shows its own big clock
  $("cap").innerHTML = narration(t);
  tap(t);
};

const IMGS = ["assets/terrace.png", "assets/monad.png", "assets/chainlink.png", ...["42", "47", "33", "49"].map((id) => `assets/crest-${id}.png`)];
document.fonts.ready.then(() => Promise.all(IMGS.map((s) => { const i = new Image(); i.src = s; return i.decode().catch(() => {}); }))).then(() => {
  window.seek(Number(new URLSearchParams(location.search).get("t") || 0));
  window.ready = true;
});
</script>
</body>
