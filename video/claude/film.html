<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Terrace · My Claude vs your Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=block" rel="stylesheet" />
<style>
  /* tokens from monad/app/src/app/globals.css (dark) */
  :root {
    --canvas: #0a0a0a; --surface: #111111; --raised: #1a1a1a; --deep: #0d0d0d;
    --line: #262626; --line-soft: #1e1e1e; --line-hair: #171717;
    --green: #22c55e; --green-ink: #4ade80; --green-deep: #052e16; --green-mid: #14532d; --on-green: #04180c;
    --red: #ef4444; --red-ink: #f87171; --amber-ink: #fbbf24; --amber-deep: #2a1605; --blue: #60a5fa; --blue-deep: #12263f;
    --violet-ink: #c4b5fd; --violet-deep: #2e1065;
    --ink: #f9fafb; --ink-2: #9ca3af; --ink-3: #6b7280; --ink-4: #4b5563;
    --sans: "Barlow", system-ui, sans-serif; --cond: "Barlow Condensed", "Arial Narrow", sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
    --clay: #d97757;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }
  #frame { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--canvas); font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  body.v #frame { width: 1080px; height: 1920px; }
  #glow { position: absolute; inset: 0; z-index: 0; }
  #grid { position: absolute; inset: 0; z-index: 0; background-image: radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1.2px); background-size: 28px 28px; }
  #vig { position: absolute; inset: 0; z-index: 30; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgba(0,0,0,0.5) 100%); }
  .big { font-family: var(--cond); font-weight: 800; text-transform: uppercase; line-height: 0.92; letter-spacing: -1px; white-space: nowrap; }
  .green { color: var(--green); }
  .lead { font-weight: 600; color: var(--ink-2); }
  .brands { display: inline-flex; align-items: center; gap: 30px; font-size: 24px; font-weight: 600; color: var(--ink-2); }
  .brands .b { display: inline-flex; align-items: center; gap: 12px; }
  .brands .w { color: var(--ink); font-family: var(--cond); font-size: 32px; font-weight: 800; letter-spacing: 1px; }
  body.v .brands { flex-direction: column; gap: 18px; }
  .logo { display: inline-flex; align-items: center; gap: 16px; font-family: var(--cond); font-weight: 800; letter-spacing: 2px; }

  #cover, #end { position: absolute; left: 0; right: 0; text-align: center; z-index: 12; }
  .ln { display: block; }

  /* chapter title: big in the middle, then shrinks into the corner label */
  #dim { position: absolute; inset: 0; background: rgba(8,8,8,0.82); z-index: 14; }
  #chap { position: absolute; left: 0; top: 0; z-index: 15; transform-origin: 0 0; font-family: var(--cond); font-weight: 800; text-transform: uppercase; line-height: 1; white-space: nowrap; font-size: 120px; letter-spacing: -0.5px; }
  #chap .n { color: var(--green); margin-right: 0.28em; }

  /* windows */
  .win { position: absolute; border-radius: 18px; overflow: hidden; z-index: 6; box-shadow: 0 30px 80px rgba(0,0,0,0.65); }
  .bar { height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 18px; font-weight: 700; font-size: 16px; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .bar .who { margin-left: 12px; letter-spacing: 1.6px; text-transform: uppercase; font-size: 14px; }
  .bar .app { margin-left: auto; font-weight: 600; opacity: 0.7; }
  #term { background: #0c0c0c; border: 1.5px solid #2a2a2a; }
  #term .bar { background: #151515; border-bottom: 1px solid #222; color: var(--ink-2); }
  #term .bar .who { color: var(--green-ink); }
  #tbody { padding: 26px 30px; font-family: var(--mono); font-size: 24px; line-height: 1.55; color: #e5e7eb; }
  .tl { white-space: pre-wrap; margin-bottom: 14px; }
  .tl .p { color: var(--ink-3); }
  .tl .dot { color: var(--green); }
  .tl .tool { color: var(--clay); font-weight: 700; }
  .tl .dim { color: var(--ink-3); }
  .tl .hl { color: var(--green-ink); font-weight: 700; }
  .tl .lnk { color: #0a0a0a; background: var(--green); padding: 1px 8px; border-radius: 6px; font-weight: 700; }
  .cur { display: inline-block; width: 13px; height: 27px; background: #e5e7eb; vertical-align: -4px; margin-left: 2px; }
  #desk { background: #faf9f5; border: 1.5px solid #e4e1d6; color: #1f1e1d; }
  #desk .bar { background: #f0eee6; border-bottom: 1px solid #e4e1d6; color: #6b6a65; }
  #desk .bar .who { color: #9a4a2f; }
  #dbody { position: absolute; left: 0; right: 0; top: 46px; bottom: 92px; padding: 22px 28px; overflow: hidden; display: flex; flex-direction: column; gap: 14px; }
  .ub { align-self: flex-end; max-width: 82%; background: #ebe8dd; border-radius: 18px; padding: 14px 20px; font-size: 23px; font-weight: 500; }
  .ab { font-family: "Source Serif 4", Georgia, serif; font-size: 27px; line-height: 1.45; color: #1f1e1d; max-width: 94%; }
  .ab b { font-weight: 600; }
  .chipt { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #ddd9cc; border-radius: 10px; padding: 7px 14px; font-size: 18px; font-weight: 600; color: #6b6a65; background: #f5f3ec; }
  .chipt i { width: 8px; height: 8px; border-radius: 50%; background: var(--clay); display: block; }
  #dinput { position: absolute; left: 24px; right: 24px; bottom: 20px; height: 56px; border-radius: 16px; border: 1.5px solid #ddd9cc; background: #fff; display: flex; align-items: center; padding: 0 18px; font-size: 18px; color: #a19f97; }
  #fly { position: absolute; z-index: 20; height: 40px; border-radius: 10px; background: var(--green); color: #04180c; font-family: var(--mono); font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 10px; padding: 0 14px; white-space: nowrap; box-shadow: 0 0 40px rgba(34,197,94,0.45); }
  #trail { position: absolute; inset: 0; z-index: 19; pointer-events: none; }

  /* phone with the real challenge screen (ChallengeView.tsx) */
  #phonewrap { position: absolute; width: 440px; height: 900px; z-index: 9; transform-origin: 0 0; }
  #phone { position: absolute; left: 0; top: 0; width: 440px; height: 900px; border-radius: 64px; background: #050505; border: 2px solid #2a2a2a; box-shadow: 0 40px 90px rgba(0,0,0,0.7), 0 0 0 10px #0e0e0e, 0 0 0 11.5px #262626; }
  #screen { position: absolute; inset: 12px; border-radius: 52px; overflow: hidden; background: var(--canvas); }
  #island { position: absolute; left: 50%; top: 12px; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; z-index: 9; }
  #status { position: absolute; left: 0; right: 0; top: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 6px 36px 0; font-weight: 700; font-size: 17px; z-index: 8; }
  .pad { position: absolute; inset: 62px 18px 20px; }
  .apphdr { display: flex; align-items: center; gap: 10px; height: 44px; font-family: var(--cond); font-weight: 800; font-size: 22px; letter-spacing: 1px; }
  .apphdr img { width: 30px; height: 30px; border-radius: 8px; }
  .apphdr .pill { margin-left: auto; height: 30px; border-radius: 15px; background: var(--raised); border: 1px solid var(--line); display: flex; align-items: center; padding: 0 12px; font-family: var(--sans); font-size: 14px; font-weight: 700; letter-spacing: 0; }
  .card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 18px; padding: 16px; margin-top: 10px; }
  .card.greenish { border-color: #1f3a2a; background: linear-gradient(180deg, #0d1a12, #0f0f0f); text-align: center; }
  .row { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-family: var(--cond); font-weight: 800; font-size: 17px; flex: none; }
  .umeta { font-size: 13px; color: var(--ink-3); font-weight: 500; }
  .uname { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 6px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.3px; white-space: nowrap; }
  .b-open { background: var(--green-deep); color: var(--green-ink); }
  .b-flash { background: var(--amber-deep); color: var(--amber-ink); }
  .b-settled { background: var(--raised); color: var(--ink-2); }
  .b-terrace { background: var(--green-deep); color: var(--green-ink); }
  .b-chainlink { background: var(--blue-deep); color: var(--blue); }
  .b-ai { background: var(--violet-deep); color: var(--violet-ink); font-size: 10.5px; padding: 2px 6px; }
  .crest { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font-family: var(--cond); font-weight: 800; font-size: 20px; margin: 0 auto; }
  .q { font-family: var(--cond); font-weight: 700; text-transform: uppercase; font-size: 28px; line-height: 1.05; margin-top: 16px; }
  .oddsrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .odd { border-radius: 14px; border: 1px solid var(--line); min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .odd .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
  .odd .val { font-family: var(--cond); font-size: 24px; font-weight: 700; }
  .odd-yes { background: #0c1f14; border-color: #17422a; } .odd-yes .lbl { color: var(--green-ink); }
  .odd-no { background: #1d0d0d; border-color: #452020; } .odd-no .lbl { color: var(--red-ink); }
  .kv { display: flex; justify-content: space-between; align-items: center; padding: 11px 0 0; font-size: 15px; }
  .kv .k { color: var(--ink-2); } .kv .v { font-weight: 700; }

  /* full-time board */
  #ft { position: absolute; z-index: 10; width: 560px; border-radius: 24px; background: var(--surface); border: 1.5px solid var(--line); padding: 28px 30px; }
  #ft .h { display: flex; align-items: center; gap: 14px; font-family: var(--cond); font-weight: 800; font-size: 40px; text-transform: uppercase; }
  #ft .teams { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; }
  #ft .tm { text-align: center; font-weight: 700; font-size: 17px; color: var(--ink-2); width: 160px; }
  #ft .tm .crest { width: 74px; height: 74px; font-size: 24px; margin-bottom: 10px; }
  #ft .stamp { margin-top: 24px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--cond); font-weight: 800; font-size: 32px; text-transform: uppercase; background: #0c1f14; border: 1.5px solid #17422a; color: var(--green-ink); }
  #ft .cl { margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 600; color: var(--ink-2); }
  #ft .cl img { width: 26px; height: 26px; border-radius: 50%; background: #fff; }
  #coin { position: absolute; z-index: 21; height: 54px; border-radius: 27px; background: var(--green); color: #04180c; display: flex; align-items: center; padding: 0 22px; font-family: var(--cond); font-weight: 800; font-size: 32px; box-shadow: 0 0 50px rgba(34,197,94,0.5); }

  #url { display: inline-flex; align-items: center; height: 68px; border-radius: 34px; border: 1.5px solid var(--green-mid); background: #0b1a10; color: var(--green-ink); padding: 0 32px; font-weight: 700; font-size: 32px; }
  #cmd { display: inline-flex; align-items: center; gap: 14px; height: 64px; border-radius: 14px; background: #0c0c0c; border: 1.5px solid #2a2a2a; padding: 0 26px; font-family: var(--mono); font-size: 24px; color: #e5e7eb; }
  #cmd .p { color: var(--ink-3); }
  body.v #cmd { font-size: 19px; padding: 0 18px; }
  body.v #tbody { font-size: 23px; padding: 22px 24px; }
  body.v .ab { font-size: 25px; }
  body.v .ub { font-size: 22px; }
  body.v #dbody { gap: 10px; padding: 18px 24px; }
</style>
</head>
<body>
<div id="frame">
  <div id="glow"></div><div id="grid"></div>
  <div id="cover"></div>
  <div id="term" class="win"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="who">You</span><span class="app">Claude Code · terminal</span></div><div id="tbody"></div></div>
  <div id="desk" class="win"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="who">Your mate</span><span class="app">Claude Desktop</span></div><div id="dbody"></div><div id="dinput">Reply to Claude…</div></div>
  <div id="phonewrap"><div id="phone"><div id="screen"><div id="island"></div><div id="status"><span>9:41</span><span>●●● ▮</span></div><div id="view"></div></div></div></div>
  <div id="ft"></div>
  <svg id="trail"></svg><div id="fly"></div><div id="coin"></div>
  <div id="end"></div>
  <div id="dim"></div><div id="chap"></div>
  <div id="vig"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const VERT = new URLSearchParams(location.search).get("f") === "9x16";
if (VERT) document.body.classList.add("v");
const W = VERT ? 1080 : 1920, H = VERT ? 1920 : 1080;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => cl((t - a) / d);
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const spring = (x) => (x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(9 * x));
const lerp = (a, b, x) => a + (b - a) * x;
function life(t, a, b, { d = 0.5, dy = 26, out = 0.35 } = {}) {
  const i = spring(prog(t, a, d)), o = eo(prog(t, b - out, out));
  return { o: cl(prog(t, a, d * 0.6)) * (1 - o), y: (1 - i) * dy - o * 14, s: lerp(0.96, 1, i) };
}
const st = ({ o, y = 0, s = 1 }) => `opacity:${o.toFixed(3)};transform:translateY(${y.toFixed(1)}px) scale(${s.toFixed(4)})`;
const typed = (t, a, b, text) => text.slice(0, Math.round(cl((t - a) / (b - a)) * text.length));

/* The real bet: challenge #15, "Over 2.5 goals", VfB Stuttgart v Borussia Mönchengladbach, $10 each, settled YES. */
const T = {
  coverOut: 3.0, split: [3.0, 4.2],
  ch: [
    { at: 4.2, n: 1, text: "Say your take." },
    { at: 14.6, n: 2, text: "Send the link." },
    { at: 19.6, n: 3, text: "Their Claude takes it on." },
    { at: 28.6, n: 4, text: "It's live on Terrace." },
    { at: 35.6, n: 5, text: "Full time decides." },
  ],
  // terminal
  type1: [6.2, 8.6], tool1: 9.0, rule1: 9.5, ask1: 10.1, type2: [11.2, 11.5], tool2: 11.9, live: 12.5, send: 12.9,
  // link flight
  fly: [16.6, 17.9], landed: 18.1,
  // desktop
  dtool1: 21.6, dsay1: [22.1, 23.6], dyes: 24.6, dtool2: 25.2, dsay2: [25.8, 27.0],
  // phone + settle
  phoneIn: 29.8, ftIn: 37.4, stamp: 38.6, chainlink: 39.2, settled: 40.0, coin: [40.8, 42.0],
  end: 44.4, dur: 50,
};

/* ---------------- chapter titles ---------------- */
function chapter(t) {
  const el = $("chap"), dim = $("dim");
  let c = null, next = Infinity;
  T.ch.forEach((x, i) => { if (t >= x.at) { c = x; next = T.ch[i + 1]?.at ?? T.end; } });
  if (!c || t >= T.end) { el.style.opacity = 0; dim.style.opacity = 0; return; }
  el.innerHTML = `<span class="n">${c.n}</span>${c.text}`;
  el.style.fontSize = "120px";
  const w = el.offsetWidth, avail = W - (VERT ? 120 : 240);
  const fs = Math.min(120, (120 * avail) / w);
  el.style.fontSize = fs + "px";
  const w2 = el.offsetWidth, h2 = el.offsetHeight;
  const big = { x: (W - w2) / 2, y: (H - h2) / 2 - (VERT ? 40 : 20), k: 1 };
  const small = { x: VERT ? 64 : 80, y: VERT ? 210 : 70, k: (VERT ? 52 : 50) / fs };
  const a = c.at;
  const m = eio(prog(t, a + 1.25, 0.55));
  const x = lerp(big.x, small.x, m), y = lerp(big.y, small.y, m), k = lerp(big.k, small.k, m);
  const reveal = eo(prog(t, a, 0.45));
  const out = prog(t, next - 0.35, 0.35);
  el.style.opacity = (1 - out).toFixed(3);
  el.style.clipPath = `inset(0 0 ${((1 - reveal) * 100).toFixed(1)}% 0)`;
  el.style.transform = `translate(${x.toFixed(1)}px, ${(y + (1 - reveal) * 40).toFixed(1)}px) scale(${k.toFixed(4)})`;
  dim.style.opacity = (cl(prog(t, a - 0.05, 0.25)) * (1 - prog(t, a + 1.25, 0.45)) * 0.9).toFixed(3);
}

/* ---------------- layout ---------------- */
const L = VERT
  ? { term: [60, 330, 960, 570], desk: [60, 960, 960, 570], phone: { x: 540 - 220 * 0.9, y: 620, k: 0.9 }, phoneSide: { x: 540 - 220 * 0.9, y: 712 }, ft: { x: 330, y: 290, k: 0.75 } }
  : { term: [80, 190, 860, 740], desk: [980, 190, 860, 740], phone: { x: 960 - 220 * 0.95, y: 110, k: 0.95 }, phoneSide: { x: 1180, y: 110 }, ft: { x: 220, y: 300, k: 1 } };

function windows(t) {
  // windows slide in from the side their title went (my Claude left/top, your Claude right/bottom)
  const inT = eo(prog(t, T.split[0] + 0.4, 0.8));
  const back = eio(prog(t, T.phoneIn - 0.8, 0.7)); // make room for the phone
  for (const [id, r, dir] of [["term", L.term, -1], ["desk", L.desk, 1]]) {
    const el = $(id);
    const [x, y, w, h] = r;
    const off = (1 - inT) * (VERT ? 0 : 1200) * dir, offY = (1 - inT) * (VERT ? 1200 : 0) * dir;
    const o = inT * (1 - back * 0.94) * (1 - prog(t, T.end - 0.6, 0.5));
    el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;opacity:${o.toFixed(3)};transform:translate(${off}px,${offY}px) scale(${lerp(1, 0.92, back)});filter:blur(${(back * 4).toFixed(1)}px)`;
  }
  // the window that isn't speaking dims a little
  const focus = t < T.ch[1].at ? "term" : t < T.ch[2].at ? null : "desk";
  if (focus && back === 0) $(focus === "term" ? "desk" : "term").style.opacity = (inT * 0.55).toFixed(3);
}

function terminal(t) {
  const lines = [];
  const p1 = "bet my mate $10 there'll be over 2.5 goals in Stuttgart v Gladbach tonight";
  const cur = (t2) => (Math.floor(t2 * 2.4) % 2 === 0 ? `<span class="cur"></span>` : "");
  if (t >= T.split[0]) lines.push(`<div class="tl"><span class="p">&gt; </span>${typed(t, ...T.type1, p1)}${t < T.tool1 ? cur(t) : ""}</div>`);
  const show = (at, html) => { if (t >= at) lines.push(`<div class="tl" style="opacity:${prog(t, at, 0.25)}">${html}</div>`); };
  show(T.tool1, `<span class="dot">⏺</span> <span class="tool">terrace · preview take</span>\n  <span class="dim">⎿ settles YES if the match has 3 or more goals</span>`);
  show(T.ask1, `<span class="dot">⏺</span> Rule: <span class="hl">YES if there are 3+ goals.</span> $10 each, winner takes <span class="hl">$20</span>. Go?`);
  if (t >= T.type2[0] - 0.4) lines.push(`<div class="tl"><span class="p">&gt; </span>${typed(t, ...T.type2, "yes")}${t < T.tool2 ? cur(t) : ""}</div>`);
  show(T.tool2, `<span class="dot">⏺</span> <span class="tool">terrace · challenge</span>`);
  show(T.live, `<span class="dot">⏺</span> Challenge #15 is live: <span class="lnk" id="tlink">play.terrace.social/c/15</span>`);
  show(T.send, `  <span class="dim">Send your mate the link.</span>`);
  $("tbody").innerHTML = lines.join("");
}

function desktop(t) {
  const out = [];
  const pop = (at, html) => { if (t >= at) { const p = spring(prog(t, at, 0.5)); out.push(html.replace("STYLE", `opacity:${cl(prog(t, at, 0.25))};transform:translateY(${((1 - p) * 14).toFixed(1)}px)`)); } };
  const words = (t0, t1, html) => {
    // reveal word by word; tags pass through untouched
    const parts = html.split(/(<[^>]+>|\s+)/).filter(Boolean);
    const n = parts.filter((w) => !w.startsWith("<") && w.trim()).length;
    let k = Math.round(cl((t - t0) / (t1 - t0)) * n), i = 0;
    return parts.map((w) => (w.startsWith("<") || !w.trim() ? w : i++ < k ? w : `<span style="opacity:0">${w}</span>`)).join("");
  };
  pop(T.landed, `<div class="ub" style="STYLE">accept this: play.terrace.social/c/15</div>`);
  pop(T.dtool1, `<div class="chipt" style="STYLE"><i></i>terrace · challenge details</div>`);
  if (t >= T.dsay1[0]) out.push(`<div class="ab">${words(...T.dsay1, "Your mate's Claude says <b>YES: over 2.5 goals</b> in Stuttgart v Gladbach. You'd take <b>NO</b> for $10. Winner takes $20. Want in?")}</div>`);
  pop(T.dyes, `<div class="ub" style="STYLE">yes</div>`);
  pop(T.dtool2, `<div class="chipt" style="STYLE"><i></i>terrace · accept challenge</div>`);
  if (t >= T.dsay2[0]) out.push(`<div class="ab">${words(...T.dsay2, "You're on: you back <b>NO</b> with $10. Winner takes $20 once Chainlink settles it.")}</div>`);
  $("dbody").innerHTML = out.join("");
}

/* the link flies from the terminal to the desktop's input */
function flight(t) {
  const fly = $("fly"), trail = $("trail");
  fly.style.opacity = 0; trail.innerHTML = "";
  if (t < T.fly[0] - 0.3 || t > T.landed + 0.2) return;
  const a = $("tlink")?.getBoundingClientRect(), b = $("dinput").getBoundingClientRect();
  if (!a) return;
  const fr = $("frame").getBoundingClientRect();
  const x0 = a.left - fr.left, y0 = a.top - fr.top - 4, x1 = b.left - fr.left + 30, y1 = b.top - fr.top + 8;
  const p = eio(prog(t, ...T.fly));
  const cx = (x0 + x1) / 2, cy = Math.min(y0, y1) - (VERT ? 0 : 220);
  const cxv = VERT ? Math.max(x0, x1) + 260 : cx;
  const bez = (u) => [(1 - u) ** 2 * x0 + 2 * (1 - u) * u * cxv + u * u * x1, (1 - u) ** 2 * y0 + 2 * (1 - u) * u * cy + u * u * y1];
  const [x, y] = bez(p);
  const lift = t < T.fly[0] ? spring(prog(t, T.fly[0] - 0.3, 0.3)) : 1;
  const land = 1 - prog(t, T.landed - 0.05, 0.2);
  fly.style.cssText = `left:${x}px;top:${y}px;opacity:${land};transform:scale(${lerp(1, 1.12, lift) * lerp(1, 0.9, p)}) rotate(${Math.sin(p * Math.PI) * -4}deg)`;
  fly.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#04180c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>play.terrace.social/c/15`;
  const pts = []; for (let i = 0; i <= 30; i++) { const u = (i / 30) * p; pts.push(bez(u).map((v) => v.toFixed(1)).join(",")); }
  trail.setAttribute("width", W); trail.setAttribute("height", H);
  trail.innerHTML = `<polyline points="${pts.join(" ")}" fill="none" stroke="rgba(34,197,94,${(0.55 * land).toFixed(2)})" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" transform="translate(20,20)"/>`;
}

/* ---------------- phone: ChallengeView ---------------- */
const VFB = `<div class="crest" style="background:#e32219;color:#fff">VfB</div>`;
const BMG = `<div class="crest" style="background:#111;color:#fff;border:3px solid #1fa04a">BMG</div>`;
function challenge(t) {
  const settled = t >= T.settled;
  const badge = settled ? `<span class="badge b-settled">Settled</span>` : `<span class="badge b-open">On</span>`;
  const won = settled ? `<div class="card greenish" style="opacity:${prog(t, T.settled, 0.3)};transform:scale(${lerp(0.94, 1, spring(prog(t, T.settled, 0.5)))})"><div class="q" style="margin:0;font-size:24px">Claude called it</div><div class="umeta" style="margin-top:4px">$20 paid out. Bragging rights: settled.</div></div>` : "";
  return `<div class="pad">
    <div class="apphdr"><img src="assets/terrace.png" />TERRACE<span class="pill">1v1</span></div>
    <div class="card" style="border-color:var(--green-mid)">
      <div class="row"><div class="avatar" style="background:#3b1d14;color:#f0a68a">C</div>
        <div style="flex:1;min-width:0"><div class="umeta">Challenge from</div><div class="uname">Claude <span class="badge b-ai">AI</span></div></div>${badge}</div>
      <div class="row" style="justify-content:center;gap:22px;margin-top:16px">
        <div style="text-align:center">${VFB}<div class="umeta" style="margin-top:7px;color:var(--ink-2)">VfB Stuttgart</div></div>
        <div style="font-family:var(--cond);font-size:16px;color:var(--ink-4)">V</div>
        <div style="text-align:center">${BMG}<div class="umeta" style="margin-top:7px;color:var(--ink-2)">B. Mönchengladbach</div></div></div>
      <div class="q">Over 2.5 goals</div>
      <div class="oddsrow"><div class="odd odd-yes"><span class="lbl">They say</span><span class="val">Yes</span></div><div class="odd odd-no"><span class="lbl">Their mate says</span><span class="val">No</span></div></div>
      <div class="kv"><span class="k">Stake each</span><span class="v">$10.00</span></div>
      <div class="kv"><span class="k">Winner takes</span><span class="v" style="font-family:var(--cond);font-size:24px;color:var(--green)">$20.00</span></div>
    </div>
    <div class="card row"><div class="avatar" style="background:#2e1065;color:#c4b5fd">M</div><div><div class="uname">Mate's Claude <span class="badge b-ai">AI</span></div><div class="umeta">took the other side: No</div></div></div>
    ${won}
    <div class="row" style="justify-content:center;gap:6px;margin-top:14px"><span class="badge b-terrace">1v1</span><span class="badge b-chainlink">Settled by Chainlink</span></div>
  </div>`;
}

function phone(t) {
  const inP = spring(prog(t, T.phoneIn, 0.8)), o = cl(prog(t, T.phoneIn, 0.3)) * (1 - prog(t, T.end - 0.5, 0.45));
  const side = eio(prog(t, T.ftIn - 0.7, 0.7));
  const x = lerp(L.phone.x, L.phoneSide.x, side), y = lerp(L.phone.y, L.phoneSide.y, side);
  $("phonewrap").style.cssText = `left:${x}px;top:${y + (1 - inP) * 160}px;opacity:${o};transform:scale(${L.phone.k})`;
  if (o > 0) $("view").innerHTML = challenge(t);
}

function fulltime(t) {
  const el = $("ft");
  const o = cl(prog(t, T.ftIn, 0.3)) * (1 - prog(t, T.end - 0.5, 0.45));
  const p = spring(prog(t, T.ftIn, 0.6));
  el.style.cssText = `left:${L.ft.x}px;top:${L.ft.y + (1 - p) * 40}px;opacity:${o};transform:scale(${L.ft.k});transform-origin:0 0`;
  if (o <= 0) { el.innerHTML = ""; return; }
  const whistle = `<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="14" r="6"/><path d="M13 9.5L21 6v4l-6.5 2"/><path d="M9 11v.01"/></svg>`;
  const sp = spring(prog(t, T.stamp, 0.5));
  el.innerHTML = `<div class="h"><span style="transform:rotate(${Math.sin(t * 30) * 12 * (1 - prog(t, T.ftIn + 0.4, 0.6))}deg);display:inline-block">${whistle}</span>Full time</div>
    <div class="teams"><div class="tm">${VFB.replace('class="crest"', 'class="crest"')}VfB Stuttgart</div><div style="font-family:var(--cond);font-weight:800;font-size:30px;color:var(--ink-4)">V</div><div class="tm">${BMG}B. Mönchengladbach</div></div>
    <div class="stamp" style="opacity:${cl(prog(t, T.stamp, 0.2))};transform:scale(${lerp(1.3, 1, sp)})">Over 2.5 goals · Yes</div>
    <div class="cl" style="opacity:${prog(t, T.chainlink, 0.3)}"><img src="assets/chainlink.png" />Checked by Chainlink from the official result</div>`;
}

/* winnings fly to the winner's card */
function coin(t) {
  const c = $("coin");
  c.style.opacity = 0;
  if (t < T.coin[0] || t > T.coin[1] + 0.3) return;
  const fr = $("frame").getBoundingClientRect();
  const from = $("ft").getBoundingClientRect(), to = $("phonewrap").getBoundingClientRect();
  const x0 = from.left - fr.left + from.width / 2 - 50, y0 = from.top - fr.top + from.height - 60;
  const x1 = to.left - fr.left + to.width / 2 - 50, y1 = to.top - fr.top + to.height * 0.66;
  const p = eio(prog(t, ...T.coin));
  const arc = Math.sin(p * Math.PI) * (VERT ? 80 : 160);
  c.style.cssText = `left:${lerp(x0, x1, p)}px;top:${lerp(y0, y1, p) - arc}px;opacity:${(1 - prog(t, T.coin[1], 0.3))};transform:scale(${lerp(0.8, 1.1, Math.sin(p * Math.PI))})`;
  c.textContent = "+$20";
}

/* ---------------- cover + end ---------------- */
const BRANDS = `<span class="brands"><span class="b">In <span class="w">CLAUDE</span></span><span class="b">Settled by <img src="assets/chainlink.png" style="height:34px;border-radius:50%;background:#fff" /><span class="w">CHAINLINK</span></span><span class="b">On <img src="assets/monad.png" style="height:40px;border-radius:10px" /><span class="w">MONAD</span></span></span>`;
function cover(t) {
  const el = $("cover");
  if (t >= T.split[1]) { el.innerHTML = ""; return; }
  const s = eio(prog(t, ...T.split));
  const fade = 1 - prog(t, T.split[0], 0.6);
  const mv = (dir) => VERT ? `translateY(${dir * s * 900}px)` : `translateX(${dir * s * 1300}px)`;
  el.style.top = VERT ? "500px" : "170px";
  const fs = VERT ? 132 : 172;
  el.innerHTML = `<div style="margin-bottom:38px;opacity:${fade}"><span class="logo" style="font-size:${VERT ? 44 : 40}px"><img src="assets/terrace.png" style="width:${VERT ? 64 : 56}px;height:${VERT ? 64 : 56}px;border-radius:14px" />TERRACE</span></div>
    <span class="ln big" style="font-size:${fs}px;transform:${mv(-1)}">My Claude</span>
    <span class="ln big" style="font-size:${fs * 0.42}px;color:var(--ink-3);margin:6px 0;opacity:${fade}">versus</span>
    <span class="ln big green" style="font-size:${fs}px;transform:${mv(1)}">Your Claude</span>
    <span class="ln lead" style="font-size:${VERT ? 32 : 36}px;margin-top:30px;opacity:${fade};padding:0 60px;white-space:normal">A football bet between two AIs. The final score decides.</span>
    <div style="margin-top:44px;opacity:${fade}">${BRANDS}</div>`;
}
function endcard(t) {
  const el = $("end");
  if (t < T.end) { el.innerHTML = ""; return; }
  const e = (a, dy = 26) => st(life(t, T.end + a, 99, { d: 0.7, dy }));
  el.style.cssText = `top:${VERT ? 470 : 190}px;opacity:${1 - prog(t, T.dur - 0.6, 0.6)}`;
  const fs = VERT ? 116 : 132;
  el.innerHTML = `<img src="assets/terrace.png" style="width:100px;height:100px;border-radius:24px;${e(0.2)}" />
    <span class="ln big" style="font-size:${fs}px;margin-top:30px;${e(0.3)}">Bet your mate.</span>
    <span class="ln big green" style="font-size:${fs}px;${e(0.6)}">Through Claude.</span>
    <div style="margin-top:40px;${e(1.1, 16)}"><span id="cmd"><span class="p">$</span>claude mcp add terrace -- npx -y terrace-mcp</span></div>
    <div style="margin-top:20px;${e(1.5, 16)}"><span id="url">play.terrace.social</span></div>
    <div class="lead" style="font-size:22px;margin-top:22px;${e(1.8, 12)}">Free test dollars, no real money</div>
    <div style="margin-top:30px;${e(2.0, 12)}">${BRANDS}</div>`;
}

/* ---------------- seek ---------------- */
window.seek = (t) => {
  const v = cl(prog(t, T.split[0], 2));
  $("glow").style.background = `radial-gradient(900px 700px at ${VERT ? "50% 30%" : "28% 45%"}, rgba(34,197,94,${(0.13).toFixed(3)}), transparent 70%), radial-gradient(800px 640px at ${VERT ? "50% 75%" : "75% 55%"}, rgba(217,119,87,${(0.09 * v).toFixed(3)}), transparent 70%)`;
  cover(t);
  windows(t);
  terminal(t);
  desktop(t);
  flight(t);
  phone(t);
  fulltime(t);
  coin(t);
  endcard(t);
  chapter(t);
};

document.fonts.ready.then(() => Promise.all(["assets/terrace.png", "assets/monad.png", "assets/chainlink.png"].map((s) => { const i = new Image(); i.src = s; return i.decode().catch(() => {}); }))).then(() => {
  window.seek(Number(new URLSearchParams(location.search).get("t") || 0));
  window.ready = true;
});
</script>
