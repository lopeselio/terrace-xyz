<script>
const $ = (id) => document.getElementById(id);
const VERT = new URLSearchParams(location.search).get("f") === "9x16";
if (VERT) document.body.classList.add("v");
const W = VERT ? 1080 : 1920, H = VERT ? 1920 : 1080;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => cl((t - a) / d);
const span = (t, [a, b]) => prog(t, a, b - a); // progress through a [start, end] window
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const spring = (x) => (x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(9 * x));
const lerp = (a, b, x) => a + (b - a) * x;
function life(t, a, b, { d = 0.5, dy = 26, out = 0.35 } = {}) {
  const i = spring(prog(t, a, d)), o = eo(prog(t, b - out, out));
  return { o: cl(prog(t, a, d * 0.6)) * (1 - o), y: (1 - i) * dy - o * 14, s: lerp(0.96, 1, i) };
}
const st = ({ o, y = 0, s = 1 }) => `opacity:${o.toFixed(3)};transform:translateY(${y.toFixed(1)}px) scale(${s.toFixed(4)})`;
const typed = (t, a, b, text) => text.slice(0, Math.round(cl((t - a) / (b - a)) * text.length));

/* The real bet: challenge #15, "Over 2.5 goals", VfB Stuttgart v Borussia Mönchengladbach, $10 each, settled YES. */
const T = {
  coverOut: 3.0, split: [3.0, 4.2],
  ch: [
    { at: 4.2, n: 1, text: "Add Terrace to Claude." },
    { at: 15.4, n: 2, text: "Say your take." },
    { at: 25.8, n: 3, text: "Send the link." },
    { at: 30.8, n: 4, text: "Their Claude takes it on." },
    { at: 40.6, n: 5, text: "It's live on Terrace." },
    { at: 47.6, n: 6, text: "Full time decides." },
    { at: 56.4, n: 7, text: "Collect it from the chat." },
  ],
  // 1: install in Claude Code, switch the connector on in Claude Desktop, both show their account
  add: [6.1, 7.5], added: 7.8, mcp: [8.5, 8.8], mcpOk: 9.1, acct: [10.6, 11.6], acctTool: 11.9, acctOut: 12.3,
  plus: 6.9, conn: 7.5, tog: 8.3, menuOut: 9.2, dtype: [9.5, 10.3], dsend: 10.5, dused: 11.0, dacct: [11.4, 13.4],
  // 2: the take
  newSession: 15.4, type1: [17.4, 19.8], tool1: 20.2, ask1: 21.3, type2: [22.4, 22.7], tool2: 23.1, live: 23.7, send: 24.1,
  // 3: link flight
  fly: [27.9, 29.2], landed: 29.4,
  // 4: desktop accepts
  dtool1: 32.6, dsay1: [33.0, 35.0], dyes: 35.8, dtool2: 36.4, dsay2: [36.9, 38.2],
  // 5, 6: phone + settle
  phoneIn: 41.8, ftIn: 49.4, stamp: 50.6, chainlink: 51.2, payBtn: 52.0,
  // 7: collect from Claude Code
  termBack: [56.6, 57.5], ctype: [58.4, 59.4], ctool: 59.8, cout: 60.3, settled: 60.3, coin: [60.5, 61.7], hop: 61.7,
  deskBack: [62.4, 63.2], mtype: [63.4, 64.3], msend: 64.5, mused: 65.0, mans: [65.4, 67.6],
  end: 69.4, dur: 75,
};

/* ---------------- Clawd ----------------
   The block-character crab from Claude Code's welcome banner:  ▐▛███▜▌ / ▝▜█████▛▘ / ▘▘ ▝▝
   Each character is 2x2 quadrants; quadrants are 1 wide x 2 tall like a terminal cell. */
const Q = { " ": "0000", "▐": "0101", "▛": "1110", "█": "1111", "▜": "1101", "▌": "1010", "▝": "0100", "▘": "1000" };
const CLAWD_ROWS = [" ▐▛███▜▌", "▝▜█████▛▘", "  ▘▘ ▝▝"];
const CLAWD_RECTS = (() => {
  const r = [];
  CLAWD_ROWS.forEach((row, ri) => [...row].forEach((ch, ci) => {
    const q = Q[ch];
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(([dx, dy], k) => { if (q[k] === "1") r.push([2 * ci + dx, (2 * ri + dy) * 2]); });
  }));
  return r;
})();
/** w = width in px. blink closes the eyes; flip mirrors it to face the other way. */
function clawd(w, { color = "#d97757", blink = false, flip = false, style = "" } = {}) {
  const rects = CLAWD_RECTS.map(([x, y]) => `<rect x="${x}" y="${y}" width="1.04" height="2.04"/>`).join("");
  const eyes = blink ? `<rect x="5" y="2" width="1.04" height="2.04"/><rect x="12" y="2" width="1.04" height="2.04"/>` : "";
  return `<svg class="clawd" width="${w}" height="${(w * 12) / 18}" viewBox="0 0 18 12" shape-rendering="crispEdges" fill="${color}" style="${flip ? "transform:scaleX(-1);" : ""}${style}">${rects}${eyes}</svg>`;
}
const blinkAt = (t, seed = 0) => (t + seed) % 3.1 < 0.12;

/* ---------------- chapter titles ---------------- */
function chapter(t) {
  const el = $("chap"), dim = $("dim");
  let c = null, next = Infinity;
  T.ch.forEach((x, i) => { if (t >= x.at) { c = x; next = T.ch[i + 1]?.at ?? T.end; } });
  if (!c || t >= T.end) { el.style.opacity = 0; dim.style.opacity = 0; return; }
  el.innerHTML = `<span class="n">${c.n}</span>${c.text}`;
  el.style.fontSize = "120px";
  const w = el.offsetWidth, avail = W - (VERT ? 120 : 240);
  const fs = Math.min(120, (120 * avail) / w);
  el.style.fontSize = fs + "px";
  const w2 = el.offsetWidth, h2 = el.offsetHeight;
  const big = { x: (W - w2) / 2, y: (H - h2) / 2 - (VERT ? 40 : 20), k: 1 };
  const small = { x: VERT ? 64 : 80, y: VERT ? 210 : 70, k: (VERT ? 52 : 50) / fs };
  const a = c.at;
  const m = eio(prog(t, a + 1.25, 0.55));
  const x = lerp(big.x, small.x, m), y = lerp(big.y, small.y, m), k = lerp(big.k, small.k, m);
  const reveal = eo(prog(t, a, 0.45));
  const out = prog(t, next - 0.35, 0.35);
  el.style.opacity = (1 - out).toFixed(3);
  el.style.clipPath = `inset(0 0 ${((1 - reveal) * 100).toFixed(1)}% 0)`;
  el.style.transform = `translate(${x.toFixed(1)}px, ${(y + (1 - reveal) * 40).toFixed(1)}px) scale(${k.toFixed(4)})`;
  dim.style.opacity = (cl(prog(t, a - 0.05, 0.25)) * (1 - prog(t, a + 1.25, 0.45)) * 0.9).toFixed(3);
}

function cursor(t) {

    pos = t >= time ? p : [lerp(prev[0], p[0], eio(prog(t, time - 0.5, 0.45))), lerp(prev[1], p[1], eio(prog(t, time - 0.5, 0.45)))];

  const fly = $("fly"), trail = $("trail");

  const a = $("tlink")?.getBoundingClientRect(), b = $("dinput").getBoundingClientRect();

  const x0 = a.left - fr.left, y0 = a.top - fr.top - 4, x1 = b.left - fr.left + 30, y1 = b.top - fr.top + 8;

  const [x, y] = bez(p);

function phone(t) {

  const c7 = eio(span(t, T.termBack));
  const x = lerp(lerp(L.phone.x, L.phoneSide.x, side), L.phoneC.x, c7), y = lerp(lerp(L.phone.y, L.phoneSide.y, side), L.phoneC.y, c7);
  $("phonewrap").style.cssText = `left:${x}px;top:${y + (1 - inP) * 160}px;opacity:${o};transform:scale(${lerp(L.phone.k, L.phoneC.k, c7)})`;
  if (o > 0) $("view").innerHTML = challenge(t);
}

function fulltime(t) {
  const el = $("ft");
  const o = cl(prog(t, T.ftIn, 0.3)) * (1 - prog(t, T.termBack[0] - 0.2, 0.5));
  const p = spring(prog(t, T.ftIn, 0.6));
  el.style.cssText = `left:${L.ft.x}px;top:${L.ft.y + (1 - p) * 40}px;opacity:${o};transform:scale(${L.ft.k});transform-origin:0 0`;
  if (o <= 0) { el.innerHTML = ""; return; }
  const whistle = `<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="14" r="6"/><path d="M13 9.5L21 6v4l-6.5 2"/><path d="M9 11v.01"/></svg>`;
  const sp = spring(prog(t, T.stamp, 0.5));
  el.innerHTML = `<div class="h"><span style="transform:rotate(${Math.sin(t * 30) * 12 * (1 - prog(t, T.ftIn + 0.4, 0.6))}deg);display:inline-block">${whistle}</span>Full time</div>
    <div class="teams"><div class="tm">${VFB.replace('class="crest"', 'class="crest"')}VfB Stuttgart</div><div style="font-family:var(--cond);font-weight:800;font-size:30px;color:var(--ink-4)">V</div><div class="tm">${BMG}B. Mönchengladbach</div></div>
    <div class="stamp" style="opacity:${cl(prog(t, T.stamp, 0.2))};transform:scale(${lerp(1.3, 1, sp)})">Over 2.5 goals · Yes</div>
    <div class="cl" style="opacity:${prog(t, T.chainlink, 0.3)}"><img src="assets/chainlink.png" />Checked by Chainlink from the official result</div>`;
}

/* winnings fly to the winner's card */
function coin(t) {
  const c = $("coin");
  c.style.opacity = 0;
  if (t < T.coin[0] || t > T.coin[1] + 0.3) return;
  const fr = $("frame").getBoundingClientRect();
  const from = $("phonewrap").getBoundingClientRect(), to = $("tpay")?.getBoundingClientRect();
  if (!to) return;
  const x0 = from.left - fr.left + from.width / 2 - 50, y0 = from.top - fr.top + from.height * 0.7;
  const x1 = to.left - fr.left, y1 = to.top - fr.top - 12;
  const p = eio(span(t, T.coin));
  const arc = Math.sin(p * Math.PI) * (VERT ? 80 : 160);
  c.style.cssText = `left:${lerp(x0, x1, p)}px;top:${lerp(y0, y1, p) - arc}px;opacity:${(1 - prog(t, T.coin[1], 0.3))};transform:scale(${lerp(0.8, 1.1, Math.sin(p * Math.PI))})`;
  c.textContent = "+$20";
}

/* ---------------- cover + end ---------------- */
/* other MCP clients that run local (stdio) servers like terrace-mcp */
const COMPAT = `<span class="compat"><span class="lbl">Also works in</span>${[
  ["cursor", "Cursor", true], ["windsurf", "Windsurf"], ["githubcopilot", "GitHub Copilot"], ["googlegemini", "Gemini CLI"], ["openai", "Codex CLI"], ["zedindustries", "Zed"],
].map(([f, n, img]) => `<span class="c">${img ? `<img src="assets/${f}.svg" style="width:28px;height:28px;border-radius:7px" />` : `<span class="mk" style="--m:url(assets/${f}.svg)"></span>`}${n}</span>`).join("")}</span>`;
const BRANDS = `<span class="brands"><span class="b">In <span class="mk mk-claude" style="width:36px;height:36px"></span><span class="w">CLAUDE</span></span><span class="b">Settled by <img src="assets/chainlink.png" style="height:34px;border-radius:50%;background:#fff" /><span class="w">CHAINLINK</span></span><span class="b">On <img src="assets/monad.png" style="height:40px;border-radius:10px" /><span class="w">MONAD</span></span></span>`;
function cover(t) {
  const el = $("cover");
  if (t >= T.split[1]) { el.innerHTML = ""; return; }
  const s = eio(span(t, T.split));
  const fade = 1 - prog(t, T.split[0], 0.6);
  const mv = (dir) => VERT ? `translateY(${dir * s * 900}px)` : `translateX(${dir * s * 1300}px)`;
  el.style.top = VERT ? "500px" : "170px";
  const fs = VERT ? 132 : 172;
  el.innerHTML = `<div style="margin-bottom:38px;opacity:${fade}"><span class="logo" style="font-size:${VERT ? 44 : 40}px"><img src="assets/terrace.png" style="width:${VERT ? 64 : 56}px;height:${VERT ? 64 : 56}px;border-radius:14px" />TERRACE</span></div>
    <span class="ln big" style="font-size:${fs}px;transform:${mv(-1)}">My Claude</span>
    <span class="ln big" style="font-size:${fs * 0.42}px;color:var(--ink-3);margin:6px 0;opacity:${fade};display:flex;align-items:center;justify-content:center;gap:28px">${clawd(fs * 0.62, { blink: blinkAt(t, 0.5) })}versus${clawd(fs * 0.62, { blink: blinkAt(t, 1.7), flip: true })}</span>
    <span class="ln big green" style="font-size:${fs}px;transform:${mv(1)}">Your Claude</span>
    <span class="ln lead" style="font-size:${VERT ? 32 : 36}px;margin-top:30px;opacity:${fade};padding:0 60px;white-space:normal">A football bet between two AIs. The final score decides.</span>
    <div style="margin-top:44px;opacity:${fade}">${BRANDS}</div>`;
}
function endcard(t) {
  const el = $("end");
  if (t < T.end) { el.innerHTML = ""; return; }
  const e = (a, dy = 26) => st(life(t, T.end + a, 99, { d: 0.7, dy }));
  el.style.cssText = `top:${VERT ? 300 : 50}px;opacity:${1 - prog(t, T.dur - 0.6, 0.6)}`;
  const fs = VERT ? 116 : 132;
  el.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;gap:30px;${e(0.2)}">${clawd(110, { blink: blinkAt(t) })}<img src="assets/terrace.png" style="width:100px;height:100px;border-radius:24px" />${clawd(110, { blink: blinkAt(t, 1.4), flip: true })}</div>
    <span class="ln big" style="font-size:${fs}px;margin-top:30px;${e(0.3)}">Bet your mate.</span>
    <span class="ln big green" style="font-size:${fs}px;${e(0.6)}">Through Claude.</span>
    <div style="margin-top:36px;${e(1.1, 16)}"><span id="cmd"><span class="p">$</span>claude mcp add terrace -- npx -y terrace-mcp</span></div>
    <div style="margin-top:26px;${e(1.4, 16)}"><span class="links"><div><span class="mk mk-gh" style="width:34px;height:34px"></span>github.com/lopeselio/terrace-mcp</div><div><span class="mk mk-npm" style="width:34px;height:34px"></span>npmjs.com/package/terrace-mcp</div></span></div>
    <div style="margin-top:26px;${e(1.7, 16)}"><span id="url">play.terrace.social</span></div>
    <div class="lead" style="font-size:22px;margin-top:16px;${e(1.9, 12)}">Free test dollars, no real money</div>
    <div style="margin-top:22px;${e(2.1, 12)}">${BRANDS}</div>
    <div style="margin-top:22px;${e(2.4, 12)}">${COMPAT}</div>`;
}

/* ---------------- seek ---------------- */
window.seek = (t) => {
  const v = cl(prog(t, T.split[0], 2));
  $("glow").style.background = `radial-gradient(900px 700px at ${VERT ? "50% 30%" : "28% 45%"}, rgba(34,197,94,${(0.13).toFixed(3)}), transparent 70%), radial-gradient(800px 640px at ${VERT ? "50% 75%" : "75% 55%"}, rgba(217,119,87,${(0.09 * v).toFixed(3)}), transparent 70%)`;
  cover(t);
  windows(t);
  terminal(t);
  desktop(t);
  flight(t);
  cursor(t);
  phone(t);
  fulltime(t);
  coin(t);
  endcard(t);
  chapter(t);
};

document.fonts.ready.then(() => Promise.all(["assets/terrace.png", "assets/monad.png", "assets/chainlink.png", "assets/vfb.png", "assets/bmg.png"].map((s) => { const i = new Image(); i.src = s; return i.decode().catch(() => {}); }))).then(() => {
  window.seek(Number(new URLSearchParams(location.search).get("t") || 0));
  window.ready = true;
});
</script>
</body>
</html>
